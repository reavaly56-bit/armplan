          <button class="${ui.gymSub === 'equip' ? 'active' : ''}" data-action="gym-sub" data-sub="equip">Снаряды</button>
          <button class="${ui.gymSub === 'exercises' ? 'active' : ''}" data-action="gym-sub" data-sub="exercises">Упражн.</button>
          <button class="${ui.gymSub === 'program' ? 'active' : ''}" data-action="gym-sub" data-sub="program">Цикл</button>
          <button class="${ui.gymSub === 'backup' ? 'active' : ''}" data-action="gym-sub" data-sub="backup">Бэкап</button>
        </div>
      `;

      let content = '';

      if (ui.gymSub === 'equip') {
        const db = state.equipment.dumbbells;
        const dbList = getSortedList(db);
        const stepEquips = Object.values(state.equipment).filter(e => e.mode === 'step');

        content = `
          <div class="tip-box" style="margin-top:0;">
            Меняй веса и шаг зала в любой момент — история не пропадёт.
          </div>

          <div class="card">
            <div class="card-title">Гантели (кг)</div>
            <div class="pill-wrap">
              ${dbList.map(w => `
                <span class="w-pill">
                  ${fmtKg(w)} кг
                  <button data-action="del-db" data-w="${w}">×</button>
                </span>
              `).join('')}
            </div>
            <div class="row mt-8">
              <input id="new-db-input" class="inp" type="number" step="0.5" inputmode="decimal" placeholder="Добавить, напр. 25" style="flex:1;" />
              <button class="btn btn-primary btn-sm" data-action="add-db">+ Добавить</button>
            </div>
          </div>

          ${stepEquips.map(eq => `
            <div class="card">
              <div class="card-title" style="margin-bottom:8px;">${esc(eq.name)}</div>
              <div class="grid-2">
                <div>
                  <div class="small muted" style="margin-bottom:3px;">Мин. вес (кг)</div>
                  <input class="inp" type="number" step="0.25" inputmode="decimal" value="${fmtKg(eq.min)}"
                    data-action="upd-equip" data-id="${eq.id}" data-field="min" />
                </div>
                <div>
                  <div class="small muted" style="margin-bottom:3px;">Шаг (кг)</div>
                  <input class="inp" type="number" step="0.25" inputmode="decimal" value="${fmtKg(eq.step)}"
                    data-action="upd-equip" data-id="${eq.id}" data-field="step" />
                </div>
              </div>
            </div>
          `).join('')}
        `;
      } else if (ui.gymSub === 'exercises') {
        const equipOpts = Object.values(state.equipment);
        content = `
          <div class="card">
            <div class="card-title">➕ Добавить упражнение</div>
            <div class="mt-8">
              <input id="new-ex-name" class="inp inp-text" placeholder="Название" />
            </div>
            <div class="grid-2 mt-8">
              <select id="new-ex-day">
                <option value="1">День 1</option>
                <option value="2">День 2</option>
                <option value="3">День 3</option>
                <option value="4">День 4</option>
              </select>
              <select id="new-ex-equip">
                ${equipOpts.map(eq => `<option value="${eq.id}">${esc(eq.name)}</option>`).join('')}
              </select>
            </div>
            <div class="grid-2 mt-8">
              <select id="new-ex-hands">
                <option value="uni">По одной руке</option>
                <option value="both">Обе руки</option>
              </select>
              <button class="btn btn-primary btn-sm" data-action="add-custom-ex">Добавить</button>
            </div>
          </div>

          ${[1, 2, 3, 4].map(d => `
            <div style="font-weight:800; margin:12px 2px 6px; color:var(--accent);">День ${d} — ${DAY_INFO[d].full}</div>
            ${state.exercises.filter(e => e.day === d).map(ex => `
              <div class="card" style="padding:10px 12px; margin-bottom:8px;">
                <div class="row-between">
                  <div style="font-weight:700; font-size:14px;">${esc(ex.name)}</div>
                  <label class="small muted row" style="gap:4px;">
                    <input type="checkbox" ${ex.elbowRisk ? 'checked' : ''} data-action="ex-elbow-risk" data-id="${ex.id}" /> локоть
                  </label>
                </div>
                <div class="grid-2 mt-8">
                  <select style="padding:6px 8px; font-size:12.5px;" data-action="ex-change-equip" data-id="${ex.id}">
                    ${equipOpts.map(eq => `<option value="${eq.id}" ${eq.id === ex.equipId ? 'selected' : ''}>${esc(eq.name)}</option>`).join('')}
                  </select>
                  ${ex.type !== 'table' ? `
                    <select style="padding:6px 8px; font-size:12.5px;" data-action="ex-deload-mode" data-id="${ex.id}">
                      ${Object.entries(DELOAD_MODES).map(([k, lbl]) => `
                        <option value="${k}" ${(ex.deloadMode || 'working') === k ? 'selected' : ''}>${esc(lbl)}</option>
                      `).join('')}
                    </select>
                  ` : '<div></div>'}
                </div>
                ${ex.type !== 'table' ? `
                  <div class="grid-2 mt-8">
                    ${ex.hands === 'uni' ? `
                      <div>
                        <div class="small muted">Макс Правая (кг)</div>
                        <input class="inp" style="padding:5px;" type="number" step="0.5" inputmode="decimal" placeholder="авто" value="${ex.baseline1RM?.R || ''}"
                          data-action="ex-base" data-id="${ex.id}" data-hand="R" />
                      </div>
                      <div>
                        <div class="small muted">Макс Левая (кг)</div>
                        <input class="inp" style="padding:5px;" type="number" step="0.5" inputmode="decimal" placeholder="авто" value="${ex.baseline1RM?.L || ''}"
                          data-action="ex-base" data-id="${ex.id}" data-hand="L" />
                      </div>
                    ` : `
                      <div style="grid-column:span 2;">
                        <div class="small muted">Макс на 1 раз (кг)</div>
                        <input class="inp" style="padding:5px;" type="number" step="0.5" inputmode="decimal" placeholder="авто" value="${ex.baseline1RM?.both || ''}"
                          data-action="ex-base" data-id="${ex.id}" data-hand="both" />
                      </div>
                    `}
                  </div>
                ` : ''}
              </div>
            `).join('')}
          `).join('')}
        `;
      } else if (ui.gymSub === 'program') {
        content = `
          <div class="card">
            <div class="card-title" style="margin-bottom:10px;">Настройки цикла</div>
            <div style="margin-bottom:10px;">
              <div class="small muted" style="margin-bottom:4px;">Схема тяжёлой недели</div>
              <div class="seg seg-full" style="grid-template-columns:1fr 1fr;">
                <button class="${state.settings.heavyScheme === '8-6-6-3-3' ? 'active' : ''}" data-action="set-scheme" data-val="8-6-6-3-3">8-6-6-3-3</button>
                <button class="${state.settings.heavyScheme === '8-6-6-4-2' ? 'active' : ''}" data-action="set-scheme" data-val="8-6-6-4-2">8-6-6-4-2</button>
              </div>
            </div>
            <div style="margin-bottom:10px;">
              <div class="small muted" style="margin-bottom:4px;">С какой недели начинать (Н1)</div>
              <div class="seg seg-full" style="grid-template-columns:1fr 1fr;">
                <button class="${state.settings.startWeekType === 'light' ? 'active' : ''}" data-action="set-start-wt" data-val="light">🌿 Лёгкая</button>
                <button class="${state.settings.startWeekType === 'heavy' ? 'active' : ''}" data-action="set-start-wt" data-val="heavy">🔥 Тяжёлая</button>
              </div>
            </div>
            <div style="margin-bottom:10px;">
              <div class="small muted" style="margin-bottom:4px;">Период</div>
              <select data-action="set-period">
                ${Object.entries(PERIODS).map(([k, p]) => `
                  <option value="${k}" ${state.settings.period === k ? 'selected' : ''}>${p.name} (${Math.round(p.mult * 100)}%)</option>
                `).join('')}
              </select>
            </div>
            <div class="grid-2">
              <div>
                <div class="small muted" style="margin-bottom:4px;">Свой вес (кг)</div>
                <input class="inp" type="number" step="0.5" inputmode="decimal" value="${fmtKg(state.settings.bodyweight)}" data-action="set-bw" />
              </div>
              <div>
                <div class="small muted" style="margin-bottom:4px;">Соревнования</div>
                <input class="inp" type="date" value="${esc(state.settings.compDate || '2027-03-15')}" data-action="set-comp" />
              </div>
            </div>
            <div class="row-between mt-12">
              <span class="small">Автозапуск таймера отдыха</span>
              <input type="checkbox" ${state.settings.autoTimer ? 'checked' : ''} data-action="set-autotimer" style="width:20px; height:20px;" />
            </div>
          </div>
        `;
      } else {
        content = `
          <div class="card">
            <div class="card-title">💾 Сохранить копию</div>
            <div class="small muted mt-8">На случай смены телефона сохрани копию истории в Telegram или Заметки.</div>
            <div class="grid-2 mt-12">
              <button class="btn btn-primary" data-action="export-file">⬇ Файл</button>
              <button class="btn" data-action="export-copy">📋 Скопировать</button>
            </div>
          </div>

          <div class="card">
            <div class="card-title">📥 Восстановить</div>
            <div class="mt-8">
              <input id="import-file" type="file" accept=".json,application/json" style="width:100%; font-size:13px;" />
            </div>
            <textarea id="import-text" rows="3" class="mt-8" placeholder="Или вставь скопированный код..."></textarea>
            <button class="btn btn-ok btn-block mt-8" data-action="import-run">Восстановить</button>
          </div>
        `;
      }

      return `<div class="container">${subNav}${content}</div>`;
    }

    function renderTimerBar() {
      if (!ui.timer.active) return '';
      const pct = ui.timer.total > 0 ? Math.max(0, Math.min(100, ((ui.timer.total - ui.timer.remain) / ui.timer.total) * 100)) : 100;
      return `
        <div id="timer-bar" class="timer-bar">
          <div>
            <div id="timer-time-val" class="timer-time ${ui.timer.remain <= 0 ? 'done' : ''}">${ui.timer.remain > 0 ? fmtTime(ui.timer.remain) : 'ГОТОВО'}</div>
            <div class="timer-lbl">${esc(ui.timer.label)}</div>
          </div>
          <div class="row">
            <button class="btn btn-xs" data-action="timer-add" data-sec="30">+30с</button>
            <button class="btn btn-xs btn-danger" data-action="timer-stop">Стоп</button>
          </div>
          <div class="timer-prog"><div id="timer-prog-in" class="timer-prog-in" style="width:${pct}%"></div></div>
        </div>
      `;
    }

    function renderNav() {
      const items = [
        { id: 'workout', ico: '🏋️', lbl: 'Тренировка' },
        { id: 'plan',    ico: '📅', lbl: 'План' },
        { id: 'progress',ico: '📈', lbl: 'Прогресс' },
        { id: 'gym',     ico: '⚙️', lbl: 'Зал' }
      ];
      return `
        <nav class="nav">
          <div class="nav-inner">
            ${items.map(it => `
              <button class="nav-btn ${ui.tab === it.id ? 'active' : ''}" data-action="tab" data-tab="${it.id}">
                <span class="ico">${it.ico}</span>
                <span>${it.lbl}</span>
              </button>
            `).join('')}
          </div>
        </nav>
      `;
    }

    function render() {
      const app = document.getElementById('app');
      app.className = 'app' + (ui.timer.active ? ' has-timer' : '');
      let main = '';
      if (ui.tab === 'workout') main = renderWorkoutTab();
      else if (ui.tab === 'plan') main = renderPlanTab();
      else if (ui.tab === 'progress') main = renderProgressTab();
      else main = renderGymTab();
      app.innerHTML = renderTopbar() + main + renderTimerBar() + renderNav();
    }

    // ==================== EVENT DELEGATION ====================
    document.addEventListener('click', (e) => {
      const btn = e.target.closest('[data-action]');
      if (!btn) return;
      const act = btn.dataset.action;

      if (act === 'tab') {
        ui.tab = btn.dataset.tab;
        if (ui.tab === 'plan') {
          ui.planWeek = state.settings.currentWeek;
          ui.planDay = ui.selectedDay;
        }
        render();
        window.scrollTo({ top: 0, behavior: 'instant' });
      }
      else if (act === 'sel-day') {
        ui.selectedDay = parseInt(btn.dataset.day, 10);
        ui.expandedExId = null;
        ui.editBaseKey = null;
        render();
      }
      else if (act === 'week-prev') {
        if (state.settings.currentWeek > 1) {
          state.settings.currentWeek--;
          saveState();
          render();
        }
      }
      else if (act === 'week-next') {
        state.settings.currentWeek++;
        saveState();
        showToast(`Неделя ${state.settings.currentWeek} (${getWeekType(state.settings.currentWeek, state.settings.startWeekType) === 'heavy' ? 'Тяжёлая' : 'Лёгкая'})`);
        render();
      }
      else if (act === 'toggle-factors') {
        ui.factorsOpen = !ui.factorsOpen;
        render();
      }
      else if (act === 'pain-set') {
        const h = btn.dataset.hand;
        state.settings.elbowPain[h] = parseInt(btn.dataset.val, 10) || 0;
        clearUntouchedDraftsFor(null);
        saveState();
        render();
      }
      else if (act === 'set-energy') {
        state.settings.energy = btn.dataset.val;
        clearUntouchedDraftsFor(null);
        saveState();
        render();
      }
      else if (act === 'set-scheme') {
        state.settings.heavyScheme = btn.dataset.val;
        clearUntouchedDraftsFor(null);
        saveState();
        render();
      }
      else if (act === 'set-start-wt') {
        state.settings.startWeekType = btn.dataset.val;
        clearUntouchedDraftsFor(null);
        saveState();
        render();
      }
      else if (act === 'toggle-ex') {
        const id = btn.dataset.id;
        ui.expandedExId = ui.expandedExId === id ? null : id;
        ui.editBaseKey = null;
        render();
      }
      else if (act === 'sel-hand') {
        ui.selectedHand[btn.dataset.id] = btn.dataset.hand;
        ui.editBaseKey = null;
        render();
      }
      else if (act === 'open-calib') {
        ui.editBaseKey = btn.dataset.key;
        render();
      }
      else if (act === 'close-calib') {
        ui.editBaseKey = null;
        render();
      }
      else if (act === 'apply-calib') {
        const exId = btn.dataset.id;
        const hand = btn.dataset.hand;
        const ex = state.exercises.find(x => x.id === exId);
        const wEl = document.getElementById(`calib-w-${exId}-${hand}`);
        const rEl = document.getElementById(`calib-r-${exId}-${hand}`);
        const w = parseFloat(wEl && wEl.value);
        const r = parseInt(rEl && rEl.value, 10) || 8;
        if (isNaN(w) || (w <= 0 && ex.type !== 'bodyweight')) {
          showToast('Впиши вес в кг');
          return;
        }
        if (!ex.baseline1RM) ex.baseline1RM = {};
        if (ex.type === 'static') {
          ex.baseline1RM[hand] = round2(w);
        } else if (ex.type === 'bodyweight') {
          const bw = Number(state.settings.bodyweight) || 75;
          ex.baseline1RM[hand] = epley1RM(bw + Math.max(0, w), r);
        } else {
          ex.baseline1RM[hand] = epley1RM(w, r);
        }
        delete state.drafts[draftKey(state.settings.currentWeek, exId, hand)];
        ui.editBaseKey = null;
        saveState();
        showToast(`Готово! Расчётный макс ~${fmtKg(ex.baseline1RM[hand])} кг`);
        render();
      }
      else if (act === 'set-w-step') {
        const ex = state.exercises.find(x => x.id === btn.dataset.id);
        const hand = btn.dataset.hand;
        const idx = parseInt(btn.dataset.idx, 10);
        const dir = parseInt(btn.dataset.dir, 10);
        const plan = computePlan(ex, hand, state.settings.currentWeek);
        const draft = getOrInitDraft(ex, hand, plan);
        const equip = getEquip(ex.equipId);
        draft.sets[idx].weight = stepWeightBy(draft.sets[idx].weight, dir, equip);
        saveState();
        render();
      }
      else if (act === 'set-done') {
        const ex = state.exercises.find(x => x.id === btn.dataset.id);
        const hand = btn.dataset.hand;
        const idx = parseInt(btn.dataset.idx, 10);
        const rest = parseInt(btn.dataset.rest, 10) || 90;
        const plan = computePlan(ex, hand, state.settings.currentWeek);
        const draft = getOrInitDraft(ex, hand, plan);
        draft.sets[idx].done = !draft.sets[idx].done;
        saveState();
        if (draft.sets[idx].done && state.settings.autoTimer) {
          startTimer(rest, `${ex.name} · подход ${idx + 1}`);
        } else {
          render();
        }
      }
      else if (act === 'add-set') {
        const ex = state.exercises.find(x => x.id === btn.dataset.id);
        const hand = btn.dataset.hand;
        const plan = computePlan(ex, hand, state.settings.currentWeek);
        const draft = getOrInitDraft(ex, hand, plan);
        const last = draft.sets[draft.sets.length - 1] || { weight: 10, reps: 8, sec: 15 };
        draft.sets.push({ weight: last.weight, reps: last.reps, sec: last.sec, done: false });
        saveState();
        render();
      }
      else if (act === 'reset-draft') {
        delete state.drafts[draftKey(state.settings.currentWeek, btn.dataset.id, btn.dataset.hand)];
        saveState();
        render();
      }
      else if (act === 'set-effort') {
        const ex = state.exercises.find(x => x.id === btn.dataset.id);
        const hand = btn.dataset.hand;
        const plan = computePlan(ex, hand, state.settings.currentWeek);
        const draft = getOrInitDraft(ex, hand, plan);
        draft.effort = btn.dataset.eff;
        saveState();
        render();
      }
      else if (act === 'save-ex') {
        const ex = state.exercises.find(x => x.id === btn.dataset.id);
        saveExerciseRecord(ex, btn.dataset.hand);
      }
      else if (act === 'open-plan-today') {
        ui.tab = 'plan';
        ui.planWeek = state.settings.currentWeek;
        ui.planDay = ui.selectedDay;
        render();
      }
      else if (act === 'plan-week') {
        ui.planWeek = parseInt(btn.dataset.week, 10);
        render();
      }
      else if (act === 'plan-day') {
        ui.planDay = parseInt(btn.dataset.day, 10);
        render();
      }
      else if (act === 'plan-hand') {
        ui.planHand = btn.dataset.hand;
        render();
      }
      else if (act === 'plan-toggle-pain') {
        ui.planIgnorePain = !ui.planIgnorePain;
        render();
      }
      else if (act === 'jump-to-week') {
        state.settings.currentWeek = parseInt(btn.dataset.week, 10);
        ui.selectedDay = ui.planDay;
        ui.tab = 'workout';
        saveState();
        render();
      }
      else if (act === 'prog-hand') {
        ui.progHand = btn.dataset.hand;
        render();
      }
      else if (act === 'del-hist') {
        if (!confirm('Удалить запись из истории?')) return;
        state.history = state.history.filter(h => h.id !== btn.dataset.id);
        saveState();
        showToast('Удалено');
        render();
      }
      else if (act === 'gym-sub') {
        ui.gymSub = btn.dataset.sub;
        render();
      }
      else if (act === 'add-db') {
        const inp = document.getElementById('new-db-input');
        const val = parseFloat(inp && inp.value);
        if (isNaN(val) || val <= 0) { showToast('Впиши вес'); return; }
        const list = getSortedList(state.equipment.dumbbells);
        if (!list.includes(round2(val))) {
          list.push(round2(val));
          list.sort((a, b) => a - b);
          state.equipment.dumbbells.weights = list;
          clearUntouchedDraftsFor(null);
          saveState();
          showToast(`Добавлена гантель ${fmtKg(val)} кг`);
          render();
        }
      }
      else if (act === 'del-db') {
        const w = parseFloat(btn.dataset.w);
        const list = getSortedList(state.equipment.dumbbells).filter(x => x !== w);
        if (!list.length) { showToast('Нужна хотя бы одна гантель'); return; }
        state.equipment.dumbbells.weights = list;
        clearUntouchedDraftsFor(null);
        saveState();
        render();
      }
      else if (act === 'add-custom-ex') {
        const name = (document.getElementById('new-ex-name')?.value || '').trim();
        if (!name) { showToast('Впиши название'); return; }
        const day = parseInt(document.getElementById('new-ex-day').value, 10);
        const equipId = document.getElementById('new-ex-equip').value;
        const hands = document.getElementById('new-ex-hands').value;
        const maxOrder = Math.max(0, ...state.exercises.filter(x => x.day === day).map(x => x.order));
        state.exercises.push({
          id: 'custom_' + Date.now(),
          day, order: maxOrder + 1, name, equipId, hands,
          type: equipId === 'table' ? 'table' : (equipId === 'bodyweight_plates' ? 'bodyweight' : 'weight'),
          elbowRisk: false,
          deloadMode: 'working',
          baseline1RM: {}
        });
        saveState();
        showToast(`Добавлено в День ${day}`);
        render();
      }
      else if (act === 'export-file') {
        const jsonStr = JSON.stringify(state, null, 2);
        const fname = `armplan-backup-${new Date().toISOString().slice(0, 10)}.json`;
        if (window.AndroidBridge && window.AndroidBridge.shareBackup) {
          window.AndroidBridge.shareBackup(jsonStr, fname);
          showToast('Выбери куда сохранить');
        } else {
          const blob = new Blob([jsonStr], { type: 'application/json' });
          const a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = fname;
          a.click();
          showToast('Файл скачан');
        }
      }
      else if (act === 'export-copy') {
        const txt = JSON.stringify(state);
        if (window.AndroidBridge && window.AndroidBridge.copyText && window.AndroidBridge.copyText(txt)) {
          showToast('Скопировано! Сохрани в Заметках');
        } else if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(txt).then(() => showToast('Скопировано!'));
        } else {
          const ta = document.getElementById('import-text');
          if (ta) { ta.value = txt; ta.select(); document.execCommand('copy'); showToast('Скопировано!'); }
        }
      }
      else if (act === 'import-run') {
        const fileInp = document.getElementById('import-file');
        const txtInp = document.getElementById('import-text');
        const applyJson = (rawStr) => {
          try {
            const parsed = JSON.parse(rawStr);
            if (!parsed || typeof parsed !== 'object' || !Array.isArray(parsed.history)) {
              showToast('Неверный файл копии');
              return;
            }
            state = mergeWithDefaults(parsed);
            saveState();
            showToast(`Восстановлено записей: ${state.history.length}`);
            render();
          } catch {
            showToast('Ошибка чтения файла');
          }
        };
        if (fileInp && fileInp.files && fileInp.files[0]) {
          const reader = new FileReader();
          reader.onload = () => applyJson(reader.result);
          reader.readAsText(fileInp.files[0]);
        } else if (txtInp && txtInp.value.trim()) {
          applyJson(txtInp.value.trim());
        } else {
          showToast('Выбери файл или вставь код');
        }
      }
      else if (act === 'timer-add') {
        addTimer(parseInt(btn.dataset.sec, 10) || 30);
      }
      else if (act === 'timer-stop') {
        stopTimer();
      }
    });

    document.addEventListener('change', (e) => {
      const el = e.target.closest('[data-action]');
      if (!el) return;
      const act = el.dataset.action;

      if (act === 'set-w-input' || act === 'set-r-input' || act === 'set-sec-input') {
        const ex = state.exercises.find(x => x.id === el.dataset.id);
        const hand = el.dataset.hand;
        const idx = parseInt(el.dataset.idx, 10);
        const plan = computePlan(ex, hand, state.settings.currentWeek);
        const draft = getOrInitDraft(ex, hand, plan);
        const val = parseFloat(el.value);
        if (!isNaN(val)) {
          if (act === 'set-w-input') draft.sets[idx].weight = round2(Math.max(0, val));
          else if (act === 'set-r-input') draft.sets[idx].reps = Math.max(0, Math.round(val));
          else draft.sets[idx].sec = Math.max(1, Math.round(val));
          saveState();
        }
      }
      else if (act === 'draft-table') {
        const ex = state.exercises.find(x => x.id === el.dataset.id);
        const hand = el.dataset.hand;
        const plan = computePlan(ex, hand, state.settings.currentWeek);
        const draft = getOrInitDraft(ex, hand, plan);
        draft[el.dataset.field] = el.value;
        saveState();
      }
      else if (act === 'draft-note') {
        const ex = state.exercises.find(x => x.id === el.dataset.id);
        const hand = el.dataset.hand;
        const plan = computePlan(ex, hand, state.settings.currentWeek);
        const draft = getOrInitDraft(ex, hand, plan);
        draft.note = el.value;
        saveState();
      }
      else if (act === 'prog-ex') {
        ui.progExId = el.value;
        render();
      }
      else if (act === 'hist-filter') {
        ui.histFilter = el.value;
        render();
      }
      else if (act === 'upd-equip') {
        const eq = state.equipment[el.dataset.id];
        const val = parseFloat(el.value);
        if (eq && !isNaN(val) && val >= 0) {
          if (el.dataset.field === 'step' && val < 0.25) return;
          eq[el.dataset.field] = round2(val);
          clearUntouchedDraftsFor(null);
          saveState();
          showToast(`Обновлено: ${eq.name}`);
        }
      }
      else if (act === 'ex-change-equip') {
        const ex = state.exercises.find(x => x.id === el.dataset.id);
        if (ex) {
          ex.equipId = el.value;
          clearUntouchedDraftsFor(ex.id);
          saveState();
          showToast('Снаряд обновлён');
        }
      }
      else if (act === 'ex-deload-mode') {
        const ex = state.exercises.find(x => x.id === el.dataset.id);
        if (ex) {
          ex.deloadMode = el.value;
          clearUntouchedDraftsFor(ex.id);
          saveState();
          showToast('Режим разгрузки обновлён');
        }
      }
      else if (act === 'ex-elbow-risk') {
        const ex = state.exercises.find(x => x.id === el.dataset.id);
        if (ex) {
          ex.elbowRisk = el.checked;
          clearUntouchedDraftsFor(ex.id);
          saveState();
        }
      }
      else if (act === 'ex-base') {
        const ex = state.exercises.find(x => x.id === el.dataset.id);
        if (ex) {
          if (!ex.baseline1RM) ex.baseline1RM = {};
          const v = parseFloat(el.value);
          ex.baseline1RM[el.dataset.hand] = isNaN(v) || v <= 0 ? null : round2(v);
          clearUntouchedDraftsFor(ex.id);
          saveState();
        }
      }
      else if (act === 'set-period') {
        state.settings.period = el.value;
        clearUntouchedDraftsFor(null);
        saveState();
        render();
      }
      else if (act === 'set-bw') {
        const v = parseFloat(el.value);
        if (!isNaN(v) && v >= 30 && v <= 200) {
          state.settings.bodyweight = round2(v);
          clearUntouchedDraftsFor(null);
          saveState();
        }
      }
      else if (act === 'set-comp') {
        state.settings.compDate = el.value;
        saveState();
        render();
      }
      else if (act === 'set-autotimer') {
        state.settings.autoTimer = el.checked;
        saveState();
      }
    });

    // ==================== ANDROID BACK BUTTON ====================
    window.__armplanBack = function() {
      if (ui.editBaseKey) {
        ui.editBaseKey = null;
        render();
        return true;
      }
      if (ui.expandedExId) {
        ui.expandedExId = null;
        render();
        return true;
      }
      if (ui.factorsOpen) {
        ui.factorsOpen = false;
        render();
        return true;
      }
      if (ui.tab !== 'workout') {
        ui.tab = 'workout';
        render();
        return true;
      }
      return false;
    };

    // ==================== INIT ====================
    if ('serviceWorker' in navigator && location.protocol.startsWith('http') && location.hostname !== 'appassets.androidplatform.net') {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }

    loadState().then(() => {
      ui.planWeek = state.settings.currentWeek;
      render();
    });
  })();
  </script>
</body>
</html>
