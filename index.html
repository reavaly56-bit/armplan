            subText = `${fmtSetShort(ex, first)} → ${fmtSetShort(ex, peak)} · ${plan.sets.length} подх.`;
          }
          if (plan.elbowCared) badges += '<span class="chip chip-heavy">−20%</span>';
          if (plan.progTag === '+1 повт') badges += '<span class="chip chip-blue">+1 повт</span>';
          if (wType === 'light' && plan.weekType === 'heavy') badges += '<span class="chip chip-heavy">тяжёлая</span>';
        }

        const needsCal = needsCalibrationForEx(ex, wk);
        const draftProg = !done ? getDraftProgress(ex, wk) : null;
        if (draftProg && draftProg.hasMarked) {
          badges += draftProg.doneSets > 0
            ? `<span class="chip chip-blue">начато ${draftProg.doneSets}/${draftProg.totalSets}</span>`
            : `<span class="chip chip-blue">в процессе</span>`;
        }
        return `
          <button class="ex-row ${done ? 'done' : ''}" data-action="start-ex" data-id="${ex.id}">
            <div class="ex-row-left">
              <div class="ex-circle">${done ? ICONS.check : idx + 1}</div>
              <div class="ex-row-info">
                <div class="ex-row-name">${esc(ex.name)} ${badges}</div>
                <div class="ex-row-sub" ${needsCal ? 'style="color:var(--heavy); font-weight:600;"' : ''}>${esc(subText)}</div>
              </div>
            </div>
            <span class="ex-row-chev">›</span>
          </button>
        `;
      }).join('');

      return `
        <div class="container">
          <div class="week-bar">
            <button class="week-nav" data-action="week-prev" ${wk <= 1 ? 'style="opacity:0.35"' : ''}>‹</button>
            <div class="week-center">
              <div class="week-title">
                Неделя ${wk}
                <span class="chip ${wType === 'heavy' ? 'chip-heavy' : 'chip-light'}">${wType === 'heavy' ? 'Тяжёлая' : 'Лёгкая'}</span>
              </div>
              <div class="week-sub">
                ${wType === 'heavy' ? `Пирамида ${state.settings.heavyScheme}` : 'Разгрузка 10-10-8-8 · крюк 50–60% · жим 3+1'}
              </div>
            </div>
            <button class="week-nav" data-action="week-next">›</button>
          </div>

          <div class="seg mb-12" style="grid-template-columns:repeat(4,1fr);">${dayBtns}</div>

          <div class="start-card">
            <div class="start-meta">
              <div>
                <div class="start-day-name">${DAY_INFO[ui.selectedDay].full}</div>
                <div class="small muted" style="margin-top:2px;">${esc(ctaSub)}</div>
              </div>
              <span class="chip ${allDone ? 'chip-ok' : 'chip-blue'}">${doneCount}/${dayEx.length}</span>
            </div>
            <button class="btn btn-primary btn-lg btn-block" data-action="start-day">
              ${ICONS.play}
              <span>${ctaText}</span>
            </button>
          </div>

          <div class="elbow-card">
            <div class="elbow-top">
              <span class="elbow-lbl">Беречь локоть</span>
              <span class="elbow-hint">−20% в крюке и кисти</span>
            </div>
            <div class="elbow-grid">
              <button class="elbow-pill ${ec.R ? 'care' : ''}" data-action="toggle-elbow" data-hand="R">
                <span>Правый</span>
                <span class="elbow-status">${ec.R ? 'Беречь ✓' : 'Норм'}</span>
              </button>
              <button class="elbow-pill ${ec.L ? 'care' : ''}" data-action="toggle-elbow" data-hand="L">
                <span>Левый</span>
                <span class="elbow-status">${ec.L ? 'Беречь ✓' : 'Норм'}</span>
              </button>
            </div>
          </div>

          <div class="row-between mb-8" style="padding:0 2px;">
            <span class="small muted" style="font-weight:700;">Упражнения дня (${dayEx.length})</span>
          </div>
          ${exRows}
        </div>
      `;
    }

    // ==================== RENDER: GUIDED SESSION SCREEN ====================
    function renderActiveSession() {
      const sess = state.activeSession;
      const dayEx = getDayExercises(sess.day);
      const isDark = state.settings.theme === 'dark';

      if (sess.phase === 'day_done') {
        const doneExCount = dayEx.filter(e => isExerciseDoneOnWeek(e, sess.week)).length;
        const wkRecs = state.history.filter(h => h.week === sess.week && h.day === sess.day);
        const totalSets = wkRecs.reduce((acc, r) => acc + (r.sets ? r.sets.length : 0), 0);
        return `
          <div class="sess-top">
            <div class="sess-top-row">
              <button class="back-btn" data-action="exit-session">← На главную</button>
              <button class="ico-btn" data-action="toggle-theme">${isDark ? ICONS.sun : ICONS.moon}</button>
            </div>
          </div>
          <div class="container">
            <div class="stage-card rest-done" style="padding:32px 20px;">
              <div style="width:60px; height:60px; border-radius:50%; background:var(--ok-bg); color:var(--ok-text); display:flex; align-items:center; justify-content:center; margin:0 auto 14px;">
                <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
              </div>
              <div style="font-size:24px; font-weight:900; letter-spacing:-0.5px;">Тренировка завершена!</div>
              <div class="muted mt-6">Неделя ${sess.week} · День ${sess.day} (${DAY_INFO[sess.day].short})</div>
              <div class="grid-2" style="margin:20px 0;">
                <div class="stat-box"><div class="stat-val">${doneExCount}/${dayEx.length}</div><div class="stat-lbl">Упражнений</div></div>
                <div class="stat-box"><div class="stat-val">${totalSets}</div><div class="stat-lbl">Подходов</div></div>
              </div>
              <button class="btn btn-primary btn-lg btn-block" data-action="finish-day-home">Готово — к списку дней</button>
            </div>
          </div>
        `;
      }

      const exIdx = Math.max(0, dayEx.findIndex(e => e.id === sess.exId));
      const ex = dayEx[exIdx] || dayEx[0];
      const equip = getEquip(ex.equipId);
      const isUni = ex.hands === 'uni';
      const isWarmup = ex.type === 'warmup';
      const isStatic = ex.type === 'static';
      const hand = isUni ? (sess.hand === 'L' ? 'L' : 'R') : 'both';

      const plan = computePlan(ex, hand, sess.week);
      const planR = isUni ? computePlan(ex, 'R', sess.week) : plan;
      const planL = isUni ? computePlan(ex, 'L', sess.week) : plan;
      const draft = getOrInitDraft(ex, hand, plan, sess.week);
      const draftR = isUni ? getOrInitDraft(ex, 'R', planR, sess.week) : draft;
      const draftL = isUni ? getOrInitDraft(ex, 'L', planL, sess.week) : draft;

      const wType = plan.weekType;
      if (draft.sets && draft.sets.length) {
        if (sess.setIdx >= draft.sets.length) sess.setIdx = draft.sets.length - 1;
        if (sess.setIdx < 0) sess.setIdx = 0;
      }

      const barsHtml = dayEx.map((e, i) => {
        const done = isExerciseDoneOnWeek(e, sess.week);
        const cls = i === exIdx ? 'active' : (done ? 'done' : '');
        return `<div class="sess-bar ${cls}"></div>`;
      }).join('');

      const headerHtml = `
        <div class="sess-top">
          <div class="sess-top-row">
            <button class="back-btn" data-action="exit-session">← К списку дня</button>
            <div class="row">
              <span class="chip ${wType === 'heavy' ? 'chip-heavy' : 'chip-light'}">
                Нед ${sess.week} · ${wType === 'heavy' ? 'Тяжёлая' : (wType === 'warmup' ? 'Разминка' : 'Лёгкая')}
              </span>
              <button class="ico-btn" style="width:34px; height:34px;" data-action="toggle-theme">${isDark ? ICONS.sun : ICONS.moon}</button>
            </div>
          </div>
          <div class="sess-bars">${barsHtml}</div>
        </div>
      `;

      const whyCls = isWarmup ? 'warmup' : (plan.elbowCared ? 'warn' : '');
      const titleBlockHtml = `
        <div class="ex-nav-strip">
          <span>УПРАЖНЕНИЕ ${exIdx + 1} ИЗ ${dayEx.length} · ${esc(isWarmup ? 'РАЗМИНКА' : equip.name).toUpperCase()}</span>
          <div class="ex-skip-btns">
            <button class="ex-skip-btn" data-action="sess-prev-ex" ${exIdx <= 0 ? 'style="opacity:0.35"' : ''}>‹</button>
            <button class="ex-skip-btn" data-action="sess-next-ex" ${exIdx >= dayEx.length - 1 ? 'style="opacity:0.35"' : ''}>›</button>
          </div>
        </div>
        <div class="sess-title-row">
          <div class="sess-title">${esc(ex.name)}</div>
          ${!isWarmup && !needsCalibrationForEx(ex, sess.week) ? `
            <button class="btn btn-xs" data-action="toggle-edit-base" style="flex-shrink:0; margin-top:2px;">Вес</button>
          ` : ''}
        </div>
        ${plan.whyText ? `<div class="why-line ${whyCls}">${esc(plan.whyText)}</div>` : ''}
      `;

      // CASE 1: CALIBRATION / EDIT STARTING WEIGHT (supports BOTH hands at once!)
      if (sess.phase !== 'resting' && !isWarmup && (needsCalibrationForEx(ex, sess.week) || ui.editBaseOpen)) {
        const calibHint = isStatic
          ? 'Впиши обычный вес блинов для удержания (кг):'
          : (ex.equipId === 'barbell20'
            ? 'Общий рабочий вес вместе с грифом (20 кг) и повторы:'
            : (ex.equipId === 'barbell8'
              ? 'Общий рабочий вес вместе с кривым грифом (8 кг) и повторы:'
              : 'Впиши свой обычный рабочий вес и повторы — я распишу подходы:'));

        const curR = ex.baselinePeak?.R || '';
        const curL = ex.baselinePeak?.L || '';
        const curB = ex.baselinePeak?.both || '';

        return `
          ${headerHtml}
          <div class="container">
            ${titleBlockHtml}
            <div class="stage-card" style="text-align:left;">
              <div class="row-between mb-8">
                <div class="card-title">${needsCalibrationForEx(ex, sess.week) ? 'Укажи рабочий вес' : 'Изменить рабочий вес'}</div>
                ${!needsCalibrationForEx(ex, sess.week) ? `<button class="btn btn-xs" data-action="toggle-edit-base">Отмена</button>` : ''}
              </div>
              <div class="small muted mb-12">${calibHint}</div>

              ${isUni ? `
                <div class="field-lbl" style="color:var(--blue);">Правая рука</div>
                <div class="row mb-8">
                  <div style="flex:1;">
                    <input id="calib-w-r" class="inp inp-num" type="number" step="0.25" inputmode="decimal" placeholder="Вес (кг)" value="${curR}" />
                  </div>
                  ${!isStatic ? `
                    <div style="width:92px;">
                      <input id="calib-r-r" class="inp inp-num" type="number" inputmode="numeric" value="${curR ? 3 : 8}" placeholder="Повт" />
                    </div>
                  ` : ''}
                </div>
                <label class="row small mb-12" style="cursor:pointer; font-weight:600;">
                  <input type="checkbox" ${ui.calibSameHands ? 'checked' : ''} data-action="toggle-calib-same" style="width:18px; height:18px;" />
                  <span>Левая рука — такой же вес</span>
                </label>
                ${!ui.calibSameHands ? `
                  <div class="field-lbl" style="color:var(--heavy);">Левая рука</div>
                  <div class="row mb-12">
                    <div style="flex:1;">
                      <input id="calib-w-l" class="inp inp-num" type="number" step="0.25" inputmode="decimal" placeholder="Вес (кг)" value="${curL || curR}" />
                    </div>
                    ${!isStatic ? `
                      <div style="width:92px;">
                        <input id="calib-r-l" class="inp inp-num" type="number" inputmode="numeric" value="${curL ? 3 : 8}" placeholder="Повт" />
                      </div>
                    ` : ''}
                  </div>
                ` : ''}
              ` : `
                <div class="row mb-12">
                  <div style="flex:1;">
                    <div class="field-lbl">Вес (кг)</div>
                    <input id="calib-w-b" class="inp inp-num" type="number" step="0.25" inputmode="decimal" placeholder="Напр. 30" value="${curB}" />
                  </div>
                  ${!isStatic ? `
                    <div style="width:96px;">
                      <div class="field-lbl">Повторы</div>
                      <input id="calib-r-b" class="inp inp-num" type="number" inputmode="numeric" value="${curB ? 3 : 8}" />
                    </div>
                  ` : ''}
                </div>
              `}

              <button class="btn btn-primary btn-lg btn-block" data-action="sess-apply-calib">
                Рассчитать и поехали
              </button>
            </div>
          </div>
        `;
      }

      // CASE 2: FINISH EXERCISE SCREEN
      if (sess.phase === 'finish_ex') {
        const nextEx = findNextExAfter(ex, sess.week);
        const renderSummary = (d, label) => {
          const used = d.sets.filter(s => s.done);
          const arr = used.length ? used : d.sets;
          const warm = (d.extraLog || []).filter(x => x.kind === 'warmup');
          return `
            <div class="plan-sets" style="margin-top:4px;">${label ? `<span class="muted">${label}: </span>` : ''}${arr.map(s => fmtSetShort(ex, s)).join(' · ')}</div>
            ${warm.length ? `<div class="small muted" style="font-size:11.5px; margin-top:2px;">${label ? `${label} разм.: ` : 'Разминка: '}${warm.map(s => fmtSetShort(ex, s)).join(' · ')}</div>` : ''}
          `;
        };

        let nextOutcomeHtml = '';
        if (!isWarmup && wType === 'heavy') {
          if (isUni) {
            const pRSet = planR.sets[planR.sets.length - 1] || {};
            const pLSet = planL.sets[planL.sets.length - 1] || {};
            const outR = previewNextHeavyOutcome(ex, 'R', sess.week, draftR.sets.filter(s => s.done), draftR.effort, pRSet.weight, pRSet.reps);
            const outL = previewNextHeavyOutcome(ex, 'L', sess.week, draftL.sets.filter(s => s.done), draftL.effort, pLSet.weight, pLSet.reps);
            nextOutcomeHtml = outR === outL
              ? `<div class="small muted mb-12">${esc(outR)}</div>`
              : `<div class="small muted mb-12"><strong>П:</strong> ${esc(outR)}<br/><strong>Л:</strong> ${esc(outL)}</div>`;
          } else {
            const pSet = plan.sets[plan.sets.length - 1] || {};
            const out = previewNextHeavyOutcome(ex, 'both', sess.week, draft.sets.filter(s => s.done), draft.effort, pSet.weight, pSet.reps);
            if (out) nextOutcomeHtml = `<div class="small muted mb-12">${esc(out)}</div>`;
          }
        } else if (!isWarmup) {
          nextOutcomeHtml = `<div class="small muted mb-12">Разгрузка сделана — следующая тяжёлая пойдёт по плану.</div>`;
        }

        const uniDiffEfforts = isUni && draftR.effort !== draftL.effort;

        return `
          ${headerHtml}
          <div class="container">
            ${titleBlockHtml}
            <div class="stage-card" style="text-align:left;">
              <div class="row-between mb-8">
                <div class="card-title">${isWarmup ? 'Разминка сделана!' : 'Упражнение сделано!'}</div>
                <span class="chip chip-ok">${draftR.sets.filter(s => s.done).length}/${draftR.sets.length} подх.</span>
              </div>

              ${isUni
                ? `${renderSummary(draftR, 'Правая')}${renderSummary(draftL, 'Левая')}`
                : renderSummary(draft, '')}

              ${!isWarmup ? `
                <div class="field-lbl mt-12">Как зашло в целом? (влияет на следующую неделю)</div>
                <div class="effort-grid">
                  ${['easy', 'ok', 'hard', 'fail'].map(ef => `
                    <button class="eff-btn ${(!uniDiffEfforts && draftR.effort === ef) ? 'active' : ''}" data-eff="${ef}" data-action="sess-effort" data-hand="all">${feelLabel(ef)}</button>
                  `).join('')}
                </div>
                ${isUni ? `
                  <div class="grid-2 mb-8">
                    <div style="background:var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:7px 9px;">
                      <div class="small muted" style="font-size:11px; margin-bottom:4px;">Правая: <strong>${feelLabel(draftR.effort)}</strong></div>
                      <div style="display:flex; gap:4px; flex-wrap:wrap;">
                        ${['easy','ok','hard','fail'].map(ef => `<button class="btn btn-xs ${draftR.effort===ef?'btn-primary':''}" style="min-height:24px; padding:2px 6px; font-size:11px;" data-action="sess-effort" data-hand="R" data-eff="${ef}">${ef==='easy'?'Лгк':ef==='ok'?'Норм':ef==='hard'?'Еле':'Нет'}</button>`).join('')}
                      </div>
                    </div>
                    <div style="background:var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:7px 9px;">
                      <div class="small muted" style="font-size:11px; margin-bottom:4px;">Левая: <strong>${feelLabel(draftL.effort)}</strong></div>
                      <div style="display:flex; gap:4px; flex-wrap:wrap;">
                        ${['easy','ok','hard','fail'].map(ef => `<button class="btn btn-xs ${draftL.effort===ef?'btn-primary':''}" style="min-height:24px; padding:2px 6px; font-size:11px;" data-action="sess-effort" data-hand="L" data-eff="${ef}">${ef==='easy'?'Лгк':ef==='ok'?'Норм':ef==='hard'?'Еле':'Нет'}</button>`).join('')}
                      </div>
                    </div>
                  </div>
                ` : ''}
                ${nextOutcomeHtml}
                <input class="inp mb-12" style="font-weight:500;" placeholder="Заметка (необязательно)" value="${esc(draftR.note || '')}" data-action="draft-note" />
              ` : '<div class="mt-12"></div>'}

              ${!nextEx ? `
                <button class="btn btn-ok btn-lg btn-block" data-action="sess-save-next" data-rest="0">
                  Сохранить и завершить тренировку ✓
                </button>
              ` : `
                <button class="btn btn-primary btn-lg btn-block" data-action="sess-save-next" data-rest="0">
                  Дальше: ${esc(nextEx.name)} →
                </button>
                <button class="btn btn-block mt-8" data-action="sess-save-next" data-rest="120">
                  ${ICONS.timer} <span>Сохранить и отдых 2:00</span>
                </button>
              `}
              <button class="btn btn-sm btn-block mt-8" style="border:none; background:transparent; color:var(--muted);" data-action="sess-add-set">
                + Добавить ещё подход
              </button>
              <button class="btn btn-sm btn-block" style="border:none; background:transparent; color:var(--danger); min-height:32px;" data-action="sess-reset-ex">
                Сбросить и начать с 1-го подхода
              </button>
            </div>
          </div>
        `;
      }

      // CASE 3: ACTIVE GUIDED SET (ready | working | resting | rest_done)
      const curSet = draft.sets[sess.setIdx] || draft.sets[0];
      const targetPlanSet = (plan.sets && plan.sets[sess.setIdx]) || { restSec: 90, isPeak: false };
      const fullRestSec = targetPlanSet.restSec || 90;

      // Determine what happens when user finishes THIS current slot!
      const isRightOfUni = isUni && hand === 'R' && draftL.sets[sess.setIdx] && !draftL.sets[sess.setIdx].done;
      const isPeakSet = Boolean(curSet.isPeak || (wType === 'heavy' && sess.setIdx >= 3));
      const nextSlotPreview = (() => {
        // Simulate marking current done
        const nextCheckStartIdx = isRightOfUni ? sess.setIdx : sess.setIdx + 1;
        const nextCheckStartHand = isRightOfUni ? 'L' : (isUni ? 'R' : 'both');
        const list = [];
        const maxLen = isUni ? Math.max(draftR.sets.length, draftL.sets.length) : draft.sets.length;
        for (let i = 0; i < maxLen; i++) {
          if (isUni) {
            if (draftR.sets[i]) list.push({ setIdx: i, hand: 'R', done: draftR.sets[i].done || (i === sess.setIdx && hand === 'R') });
            if (draftL.sets[i]) list.push({ setIdx: i, hand: 'L', done: draftL.sets[i].done || (i === sess.setIdx && hand === 'L') });
          } else {
            list.push({ setIdx: i, hand: 'both', done: draft.sets[i].done || i === sess.setIdx });
          }
        }
        return list.find(x => !x.done) || null;
      })();

      // Inline set editor helper
      const renderSetEditor = (idxToEdit, handToEdit) => {
        const dObj = handToEdit === 'R' ? draftR : (handToEdit === 'L' ? draftL : draft);
        const sObj = dObj.sets[idxToEdit];
        if (!sObj) return '';
        const hLbl = handToEdit === 'R' ? ' · Правая' : (handToEdit === 'L' ? ' · Левая' : '');
        return `
          <div class="edit-panel">
            <div class="row-between mb-8">
              <strong class="small">Подход ${idxToEdit + 1}${hLbl} — фактический результат</strong>
              <button class="chip chip-blue" data-action="sess-close-edit">Готово</button>
            </div>
            ${isWarmup ? `
              <div>
                <div class="field-lbl">Повторы</div>
                <div class="stepper">
                  <button data-action="sess-step-r" data-idx="${idxToEdit}" data-hand="${handToEdit}" data-dir="-1">−</button>
                  <input type="number" inputmode="numeric" value="${sObj.reps}" data-action="sess-inp-r" data-idx="${idxToEdit}" data-hand="${handToEdit}" />
                  <button data-action="sess-step-r" data-idx="${idxToEdit}" data-hand="${handToEdit}" data-dir="1">+</button>
                </div>
              </div>
            ` : `
              <div class="grid-2">
                <div>
                  <div class="field-lbl">Вес (кг)</div>
                  <div class="stepper">
                    <button data-action="sess-step-w" data-idx="${idxToEdit}" data-hand="${handToEdit}" data-dir="-1">−</button>
                    <input type="number" step="0.25" inputmode="decimal" value="${fmtKg(sObj.weight)}" data-action="sess-inp-w" data-idx="${idxToEdit}" data-hand="${handToEdit}" />
                    <button data-action="sess-step-w" data-idx="${idxToEdit}" data-hand="${handToEdit}" data-dir="1">+</button>
                  </div>
                </div>
                <div>
                  <div class="field-lbl">${isStatic ? 'Секунды' : 'Повторы'}</div>
                  <div class="stepper">
                    <button data-action="sess-step-r" data-idx="${idxToEdit}" data-hand="${handToEdit}" data-dir="-1">−</button>
                    <input type="number" inputmode="numeric" value="${isStatic ? (sObj.sec || 15) : sObj.reps}" data-action="sess-inp-r" data-idx="${idxToEdit}" data-hand="${handToEdit}" />
                    <button data-action="sess-step-r" data-idx="${idxToEdit}" data-hand="${handToEdit}" data-dir="1">+</button>
                  </div>
                </div>
              </div>
            `}
            ${sObj.done ? `
              <button class="btn btn-sm btn-danger btn-block mt-8" data-action="sess-uncheck-slot" data-idx="${idxToEdit}" data-hand="${handToEdit}">
                Снять галочку (переделать подход)
              </button>
            ` : ''}
          </div>
        `;
      };

      // Live autoregulation 4-button feel widget for the JUST COMPLETED set!
      const renderLiveFeelWidget = () => {
        if (isWarmup || !sess.lastCompleted || sess.restType === 'between_ex') return '';
        const lc = sess.lastCompleted;
        if (lc.fromFailBtn) {
          return `
            <div class="retry-banner">
              <span>${esc(lc.feedback || 'Не засчитал — скинул вес, переделаем подход')}</span>
              <button class="btn btn-xs" style="background:var(--surface); border-color:var(--border); flex-shrink:0;" data-action="sess-undo-fail">Отменить</button>
            </div>
          `;
        }
        const curFeel = lc.feel || 'ok';
        const scopeText = lc.pairedBoth
          ? `подход ${lc.setIdx + 1} (П·Л)`
          : (lc.hand === 'R' ? `подход ${lc.setIdx + 1} · Правая` : (lc.hand === 'L' ? `подход ${lc.setIdx + 1} · Левая` : `подход ${lc.setIdx + 1}`));
        const feedback = lc.feedback || '';
        const btns = [
          { f: 'easy', lbl: 'Очень легко', sub: 'разминка ↑' },
          { f: 'ok',   lbl: 'Норм',        sub: 'по плану' },
          { f: 'hard', lbl: 'Еле-еле',     sub: 'полегче ↓' },
          { f: 'fail', lbl: 'Не пошло',    sub: 'повтор ↓' }
        ];
        return `
          <div class="feel-box">
            <div class="feel-head">
              <span>Как зашёл ${esc(scopeText)}?</span>
              <span class="muted" style="font-weight:600; white-space:nowrap;">авто-план</span>
            </div>
            <div class="feel-grid">
              ${btns.map(b => `
                <button class="feel-btn ${curFeel === b.f ? 'active' : ''}" data-feel="${b.f}" data-action="sess-live-feel">
                  <span>${b.lbl}</span>
                  <span class="feel-sub">${b.sub}</span>
                </button>
              `).join('')}
            </div>
            ${feedback && curFeel !== 'ok' ? `<div class="feel-feedback ${curFeel}">${esc(feedback)}</div>` : ''}
          </div>
        `;
      };

      const isEditingCurrent = sess.editingSlot && sess.editingSlot.setIdx === sess.setIdx && sess.editingSlot.hand === hand;
      let stageHtml = '';

      if (sess.phase === 'resting') {
        const remainMs = Math.max(0, (sess.restEndAt || 0) - Date.now());
        const remainSec = Math.ceil(remainMs / 1000);
        const pct = sess.restTotal > 0 ? Math.max(0, Math.min(100, ((sess.restTotal * 1000 - remainMs) / (sess.restTotal * 1000)) * 100)) : 0;

        const isBetweenHands = sess.restType === 'between_hands';
        const isBetweenEx = sess.restType === 'between_ex';
        const isRetryFail = sess.restType === 'retry_fail' || (sess.lastCompleted && sess.lastCompleted.feel === 'fail');
        const isAfterWarmup = Boolean(sess.lastCompleted && sess.lastCompleted.feel === 'easy');

        const restHeaderLeft = isBetweenHands
          ? `${ICONS.timer} Пауза между руками`
          : (isRetryFail ? `${ICONS.timer} Отдых перед повтором` : `${ICONS.timer} Отдых`);
        const restChip = isBetweenEx
          ? '<span class="chip chip-muted">Пауза между упр.</span>'
          : (isBetweenHands
            ? `<span class="chip chip-heavy">Пик · подход ${sess.setIdx + 1} из ${draft.sets.length}</span>`
            : (isRetryFail
              ? `<span class="chip chip-heavy">Повтор · подход ${sess.setIdx + 1}</span>`
              : `<span class="chip chip-muted">Перед подходом ${sess.setIdx + 1}</span>`));

        let nextTitle = isBetweenEx
          ? `Дальше · ${ex.name}`
          : (isBetweenHands
            ? `Дальше · <strong>Левая рука</strong>`
            : `${isRetryFail ? 'Повтор · ' : ''}Подход ${sess.setIdx + 1} из ${draft.sets.length}${isUni ? (hand === 'R' ? ' · Правая' : ' · Левая') : ''}`);

        const rightDoneChip = (isBetweenHands && sess.lastCompleted)
          ? (sess.lastCompleted.feel === 'easy'
              ? `<span class="chip chip-light" style="padding:2px 7px; font-size:10.5px;">П разм. ${fmtSetShort(ex, sess.lastCompleted)}</span>`
              : (sess.lastCompleted.feel === 'fail'
                ? `<span class="chip chip-heavy" style="padding:2px 7px; font-size:10.5px;">П не засч.</span>`
                : `<span class="chip chip-ok" style="padding:2px 7px; font-size:10.5px;">П ✓ ${fmtSetShort(ex, sess.lastCompleted)}</span>`))
          : (isAfterWarmup
            ? `<span class="chip chip-ok" style="padding:2px 7px; font-size:10.5px;">↑ после разминки</span>`
            : (isRetryFail && !isBetweenEx ? `<span class="chip chip-heavy" style="padding:2px 7px; font-size:10.5px;">↓ снизил вес</span>` : ''));

        const nextDesc = curSet
          ? (isWarmup ? `${curSet.reps} повторений` : (isStatic ? `${fmtKg(curSet.weight)} кг · ${curSet.sec || 15} сек` : `${fmtKg(curSet.weight)} кг × ${curSet.reps}`))
          : 'Укажешь рабочий вес после отдыха';

        stageHtml = `
          <div class="stage-card">
            <div class="stage-top">
              <span class="stage-lbl">${restHeaderLeft}</span>
              ${restChip}
            </div>

            <div id="live-clock" class="rest-clock">${fmtTime(remainSec)}</div>
            <div class="rest-prog-track"><div id="live-prog" class="rest-prog-fill" style="width:${pct.toFixed(1)}%"></div></div>

            <div class="rest-btns">
              <button class="btn btn-sm" data-action="rest-adj" data-sec="-15">−15с</button>
              <button class="btn btn-sm" data-action="rest-adj" data-sec="30">+30с</button>
              <button class="btn btn-primary btn-sm" data-action="rest-skip">Готов раньше →</button>
            </div>

            ${renderLiveFeelWidget()}

            <div class="next-preview-box">
              <div>
                <div style="display:flex; align-items:center; gap:6px; flex-wrap:wrap;">
                  <span class="small muted">${nextTitle}</span>
                  ${rightDoneChip}
                </div>
                <div style="font-size:16.5px; font-weight:800; margin-top:2px; font-variant-numeric:tabular-nums;">${esc(nextDesc)}</div>
                ${isBetweenHands ? `<div style="font-size:11.5px; color:var(--muted); margin-top:1px;">После левой — полный отдых ${fmtTime(fullRestSec)}</div>` : ''}
              </div>
              ${!isBetweenEx && curSet ? `
                <button class="btn btn-xs" data-action="sess-edit-slot" data-idx="${sess.setIdx}" data-hand="${hand}">Изменить</button>
              ` : ''}
            </div>
            ${isEditingCurrent ? `<div class="mt-8">${renderSetEditor(sess.setIdx, hand)}</div>` : ''}
          </div>
        `;
      } else if (sess.phase === 'working') {
        const elapsed = sess.workStartedAt ? Math.max(0, Math.floor((Date.now() - sess.workStartedAt) / 1000)) : 0;

        let doneBtnText = '';
        let doneBtnCls = 'btn-blue';
        if (!nextSlotPreview) {
          doneBtnText = 'Сделал · Завершить упражнение ✓';
          doneBtnCls = 'btn-ok';
        } else if (isRightOfUni) {
          doneBtnText = isPeakSet
            ? `${ICONS.timer} <span>Сделал · Пауза ${fmtTime(PEAK_BETWEEN_HANDS_REST)} → Левая</span>`
            : `Сделал → сразу Левая рука`;
        } else {
          doneBtnText = `${ICONS.timer} <span>Сделал · Отдых ${fmtTime(fullRestSec)}</span>`;
        }

        stageHtml = `
          <div class="stage-card working">
            <div class="stage-top">
              <span class="stage-lbl" style="color:var(--blue);"><span class="pulse-dot"></span> Идёт подход ${sess.setIdx + 1} из ${draft.sets.length}</span>
              <span id="work-elapsed" class="chip chip-blue" style="font-variant-numeric:tabular-nums;">${fmtTime(elapsed)}</span>
            </div>

            ${isUni ? `<div class="hand-pill-lg ${hand === 'L' ? 'left' : ''}">${hand === 'R' ? 'Правая рука' : 'Левая рука'}</div>` : ''}

            <div class="big-target" data-action="sess-edit-slot" data-idx="${sess.setIdx}" data-hand="${hand}" style="cursor:pointer;">
              ${isWarmup ? `
                <span class="big-val">${curSet.reps}</span>
                <span class="big-unit">повторений</span>
              ` : `
                <span class="big-val">${fmtKg(curSet.weight)}</span>
                <span class="big-unit">кг</span>
                <span class="big-x">×</span>
                <span class="big-reps">${isStatic ? (curSet.sec || 15) + 'с' : curSet.reps}</span>
              `}
            </div>
            <div class="stage-hint">
              ${isStatic ? `Держи ${curSet.sec || 15} сек — просигналю, когда готово` : 'Сделал подход — жми кнопку ниже'}
            </div>

            ${isEditingCurrent ? renderSetEditor(sess.setIdx, hand) : ''}

            <button class="btn ${doneBtnCls} btn-lg btn-block" data-action="sess-done-set">
              ${doneBtnText}
            </button>

            <div class="grid-2 mt-8">
              <button class="btn btn-sm" data-action="sess-edit-slot" data-idx="${sess.setIdx}" data-hand="${hand}">Другой ${isWarmup ? 'счёт' : 'вес / повт'}</button>
              ${!isWarmup ? `<button class="btn btn-sm btn-danger" data-action="sess-fail-set">Не пошло</button>` : `<button class="btn btn-sm" data-action="sess-done-set">Пропустить</button>`}
            </div>
          </div>
        `;
      } else {
        // 'ready' or 'rest_done'
        const isRestDone = sess.phase === 'rest_done';
        const justFinishedRightNoRest = isUni && hand === 'L' && sess.lastCompleted && sess.lastCompleted.hand === 'R' && sess.lastCompleted.setIdx === sess.setIdx;

        let hintText = '';
        if (isWarmup) {
          hintText = !nextSlotPreview ? 'Последний подход разминки' : `Свой вес · отдых после подхода ${fmtTime(fullRestSec)}`;
        } else if (isRightOfUni) {
          hintText = isPeakSet
            ? `После правой — пауза ${fmtTime(PEAK_BETWEEN_HANDS_REST)}, затем левая рука`
            : `Сделал правую → сразу левая → отдых ${fmtTime(fullRestSec)}`;
        } else {
          hintText = !nextSlotPreview
            ? 'Последний подход этого упражнения'
            : `Отдых после подхода: ${fmtTime(fullRestSec)}`;
        }

        stageHtml = `
          ${isRestDone ? `
            <div class="go-banner">
              <span>Отдых окончен — приступай!</span>
              <button class="btn btn-xs" style="background:var(--surface); border:none;" data-action="rest-more">+30с</button>
            </div>
          ` : ''}

          <div class="stage-card ${isRestDone ? 'rest-done' : ''}">
            <div class="stage-top">
              <span class="stage-lbl">Подход <strong>${sess.setIdx + 1} из ${draft.sets.length}</strong>${isPeakSet && !isWarmup ? ' · пик' : ''}</span>
              ${isWarmup
                ? '<span class="chip chip-light">Разминка</span>'
                : `<button class="chip chip-blue" data-action="sess-edit-slot" data-idx="${sess.setIdx}" data-hand="${hand}">Изменить</button>`}
            </div>

            ${isUni ? `
              <div style="display:flex; align-items:center; justify-content:center; gap:6px; margin-bottom:4px;">
                <span class="hand-pill-lg ${hand === 'L' ? 'left' : ''}" style="margin-bottom:0;">${hand === 'R' ? 'Правая рука' : 'Левая рука'}</span>
                ${justFinishedRightNoRest ? (
                  sess.lastCompleted.feel === 'easy'
                    ? `<span class="chip chip-light">П разм. ${fmtSetShort(ex, sess.lastCompleted)}</span>`
                    : (sess.lastCompleted.feel === 'fail'
                      ? `<span class="chip chip-heavy">П не засч.</span>`
                      : `<span class="chip chip-ok">П ✓ ${fmtSetShort(ex, sess.lastCompleted)}</span>`)
                ) : ''}
              </div>
            ` : ''}

            <div class="big-target" data-action="sess-edit-slot" data-idx="${sess.setIdx}" data-hand="${hand}" style="cursor:pointer;">
              ${isWarmup ? `
                <span class="big-val">${curSet.reps}</span>
                <span class="big-unit">повторений</span>
              ` : `
                <span class="big-val">${fmtKg(curSet.weight)}</span>
                <span class="big-unit">кг</span>
                <span class="big-x">×</span>
                <span class="big-reps">${isStatic ? (curSet.sec || 15) + 'с' : curSet.reps}</span>
              `}
            </div>
            <div class="stage-hint">${hintText}</div>

            ${justFinishedRightNoRest && !isWarmup ? renderLiveFeelWidget() : ''}
            ${isEditingCurrent ? renderSetEditor(sess.setIdx, hand) : ''}

            <button class="btn ${isRestDone ? 'btn-ok' : 'btn-primary'} btn-lg btn-block" data-action="sess-go">
              ${ICONS.play} <span>Поехали</span>
            </button>
          </div>
        `;
      }

      // Notebook Set List: group extra rows (warm-up / uncounted fails) right above their corresponding working set!
      const extraByIdx = {};
      if (!isWarmup) {
        const listR = draftR.extraLog || [];
        const listL = isUni ? (draftL.extraLog || []) : [];
        const items = [];
        if (isUni) {
          const usedL = new Set();
          listR.forEach((itemR, idxR) => {
            const matchIdx = listL.findIndex((x, i) => !usedL.has(i) && x.kind === itemR.kind && x.setIdx === itemR.setIdx && x.weight === itemR.weight && x.reps === itemR.reps);
            if (matchIdx >= 0) {
              usedL.add(matchIdx);
              items.push({ ...itemR, handTag: 'П·Л', idxR, idxL: matchIdx });
            } else {
              items.push({ ...itemR, handTag: 'П', idxR, idxL: -1 });
            }
          });
          listL.forEach((itemL, idxL) => {
            if (!usedL.has(idxL)) items.push({ ...itemL, handTag: 'Л', idxR: -1, idxL });
          });
        } else {
          listR.forEach((item, idxB) => items.push({ ...item, handTag: '', idxR: idxB, idxL: -1 }));
        }
        items.forEach(it => {
          const slot = Math.max(0, Math.min(draftR.sets.length - 1, Number(it.setIdx) || 0));
          if (!extraByIdx[slot]) extraByIdx[slot] = [];
          extraByIdx[slot].push(it);
        });
      }
      const renderExtraFor = (slotIdx) => {
        const arr = extraByIdx[slotIdx];
        if (!arr || !arr.length) return '';
        return arr.map(it => {
          const isW = it.kind === 'warmup';
          const wStr = `${fmtKg(it.weight)} кг <span class="nb-x">×</span> ${isStatic ? (it.sec || 15) + 'с' : it.reps}`;
          return `
            <div class="nb-row extra-row ${isW ? '' : 'extra-fail'}">
              <div class="nb-left">
                <span class="nb-idx ${isW ? 'warm' : 'fail'}">${isW ? 'Р' : '✕'}</span>
                <span class="nb-weight">${wStr}</span>
                ${it.handTag ? `<span class="nb-tag">${it.handTag}</span>` : ''}
              </div>
              <div class="row" style="gap:4px;">
                <span class="${isW ? 'nb-pill-warm' : 'nb-pill-fail'}">${isW ? 'разминка' : 'не засчитан'}</span>
                <button class="nb-extra-del" data-action="sess-del-extra" data-ir="${it.idxR}" data-il="${it.idxL}" aria-label="Убрать">×</button>
              </div>
            </div>
          `;
        }).join('');
      };

      const nbRows = draftR.sets.map((sR, idx) => {
        const beforeExtra = renderExtraFor(idx);
        if (isUni) {
          const sL = draftL.sets[idx] || sR;
          const bothDone = sR.done && sL.done;
          const isCurRow = idx === sess.setIdx && sess.restType !== 'between_ex';
          const sameW = sR.weight === sL.weight && sR.reps === sL.reps && sR.sec === sL.sec;
          const wText = sameW
            ? `${fmtKg(sR.weight)} кг <span class="nb-x">×</span> ${isStatic ? (sR.sec || 15) + 'с' : sR.reps}`
            : `П ${fmtKg(sR.weight)} / Л ${fmtKg(sL.weight)} кг <span class="nb-x">×</span> ${isStatic ? (sR.sec || 15) + 'с' : sR.reps}`;
          const tag = sR.isPeak ? 'пик' : '';
          const editR = sess.editingSlot && sess.editingSlot.setIdx === idx && sess.editingSlot.hand === 'R' && !(idx === sess.setIdx && hand === 'R');
          const editL = sess.editingSlot && sess.editingSlot.setIdx === idx && sess.editingSlot.hand === 'L' && !(idx === sess.setIdx && hand === 'L');
          return `
            ${beforeExtra}
            <div class="nb-row ${bothDone ? 'done' : ''} ${isCurRow ? 'active' : ''}">
              <div class="nb-left" data-action="sess-pick-slot" data-idx="${idx}" data-hand="${!sR.done ? 'R' : 'L'}">
                <span class="nb-idx">${idx + 1}</span>
                <span class="nb-weight">${wText}</span>
                ${tag ? `<span class="nb-tag">${tag}</span>` : ''}
              </div>
              <div class="rl-checks">
                <button class="rl-box ${sR.done ? 'done' : (isCurRow && hand === 'R' ? 'active' : '')}" data-action="sess-pick-slot" data-idx="${idx}" data-hand="R">
                  П${sR.done ? ' ✓' : ''}
                </button>
                <button class="rl-box ${sL.done ? 'done' : (isCurRow && hand === 'L' ? 'active' : '')}" data-action="sess-pick-slot" data-idx="${idx}" data-hand="L">
                  Л${sL.done ? ' ✓' : ''}
                </button>
              </div>
            </div>
            ${editR ? `<div class="mt-6">${renderSetEditor(idx, 'R')}</div>` : ''}
            ${editL ? `<div class="mt-6">${renderSetEditor(idx, 'L')}</div>` : ''}
          `;
        }

        const isCur = idx === sess.setIdx && sess.restType !== 'between_ex';
        const tSet = (plan.sets && plan.sets[idx]) || {};
        const tag = isWarmup
          ? (idx === draftR.sets.length - 1 ? 'последний' : `отдых ${fmtTime(tSet.restSec || 90)}`)
          : (sR.isPeak ? 'пик' : (isCur ? `отдых ${fmtTime(tSet.restSec || 90)}` : ''));
        const editRow = sess.editingSlot && sess.editingSlot.setIdx === idx && idx !== sess.setIdx;
        return `
          ${beforeExtra}
          <div class="nb-row ${sR.done ? 'done' : ''} ${isCur ? 'active' : ''}" data-action="sess-pick-slot" data-idx="${idx}" data-hand="both">
            <div class="nb-left">
              <span class="nb-idx">${idx + 1}</span>
              <span class="nb-weight">
                ${isWarmup ? `${sR.reps} повторений` : `${fmtKg(sR.weight)} кг <span class="nb-x">×</span> ${isStatic ? (sR.sec || 15) + 'с' : sR.reps}`}
              </span>
              ${tag ? `<span class="nb-tag">${tag}</span>` : ''}
            </div>
            <div class="nb-check">${sR.done ? ICONS.check : ''}</div>
          </div>
          ${editRow ? `<div class="mt-6">${renderSetEditor(idx, 'both')}</div>` : ''}
        `;
      }).join('');

      // Forecast strip for non-warmup
      let nextStripHtml = '';
      if (!isWarmup) {
        const nextStr = previewNextHeavyOutcome(ex, hand, sess.week, draft.sets, draft.effort || 'ok', plan.peakW, (plan.sets[plan.sets.length - 1] || {}).reps);
        if (nextStr) {
          nextStripHtml = `
            <div class="prog-strip">
              <span>Если зайдёт норм</span>
              <strong>${esc(nextStr)}</strong>
            </div>
          `;
        }
      }

      const hasExProgress = getDraftProgress(ex, sess.week).hasAny;

      return `
        ${headerHtml}
        <div class="container">
          ${titleBlockHtml}
          ${stageHtml}

          <div class="nb-card">
            <div class="nb-head">
              <span>${isUni ? 'Подходы: Правая → Левая' : (isWarmup ? `Все подходы · ${draftR.sets.length} × ${ex.warmupReps || 10}` : 'Все подходы (тап — править)')}</span>
              <div class="row" style="gap:6px;">
                ${hasExProgress ? `<button class="chip chip-danger" data-action="sess-reset-ex">Сбросить</button>` : ''}
                <button class="chip chip-muted" data-action="sess-add-set">+ Подход</button>
              </div>
            </div>
            ${nbRows}
          </div>

          ${nextStripHtml}
        </div>
      `;
    }

    // ==================== RENDER: PLAN TAB (HONEST 4-WEEK CYCLE ONLY!) ====================
    function renderPlanTab() {
      const startW = Math.max(1, state.settings.currentWeek);
      const weeks = [startW, startW + 1, startW + 2, startW + 3];
      if (ui.planWeek < startW || ui.planWeek > startW + 3) ui.planWeek = startW;

      const wType = getWeekType(ui.planWeek, state.settings.startWeekType);
      const dayEx = getDayExercises(ui.planDay);

      const pillsHtml = weeks.map(w => {
        const wt = getWeekType(w, state.settings.startWeekType);
        return `
          <button class="wk-pill ${ui.planWeek === w ? 'active' : ''}" data-action="plan-week" data-week="${w}">
            <div class="wk-pill-n">Нед ${w}</div>
            <div class="wk-pill-t ${wt}">${wt === 'heavy' ? 'Тяжёлая' : 'Лёгкая'}</div>
          </button>
        `;
      }).join('');

      const rowsHtml = dayEx.map((ex, i) => {
        if (ex.type === 'warmup') {
          return `
            <div class="card card-tight" style="margin-bottom:9px;">
              <div class="row-between">
                <div style="font-weight:700; font-size:14.5px;">${i + 1}. ${esc(ex.name)}</div>
                <span class="chip chip-light">разминка</span>
              </div>
              <div class="plan-sets">${ex.warmupSets || 3} × ${ex.warmupReps || 10} · свой вес (отдых ${fmtTime(ex.warmupRestSec || 90)})</div>
            </div>
          `;
        }

        let badge = '';
        let detail = '';
        let note = '';

        if (ex.hands === 'uni') {
          const pR = computePlan(ex, 'R', ui.planWeek);
          const pL = computePlan(ex, 'L', ui.planWeek);
          if (pR.needsCalibration || pL.needsCalibration) {
            detail = '<div class="small muted mt-6">Рабочий вес ещё не указан</div>';
          } else {
            const rStr = pR.sets.map(s => fmtSetShort(ex, s)).join(' → ');
            const lStr = pL.sets.map(s => fmtSetShort(ex, s)).join(' → ');
            if (rStr === lStr) {
              detail = `<div class="plan-sets">${esc(rStr)}</div>`;
            } else {
              const rShort = `${fmtKg(pR.sets[0].weight)} → ${fmtSetShort(ex, pR.sets[pR.sets.length - 1])}`;
              const lShort = `${fmtKg(pL.sets[0].weight)} → ${fmtSetShort(ex, pL.sets[pL.sets.length - 1])}`;
              detail = `<div class="plan-sets">П: ${esc(rShort)} &nbsp;|&nbsp; Л: ${esc(lShort)}</div>`;
            }
          }
          if (pR.elbowCared && pL.elbowCared) badge = '<span class="chip chip-heavy">П·Л −20%</span>';
          else if (pR.elbowCared) badge = '<span class="chip chip-heavy">П −20%</span>';
          else if (pL.elbowCared) badge = '<span class="chip chip-heavy">Л −20%</span>';
          else if (pR.progTag === '+1 повт') badge = '<span class="chip chip-blue">+1 повт</span>';
          else if (pR.weekType === 'light' && ex.deloadMode === 'light') badge = '<span class="chip chip-light">50–60%</span>';
          note = pR.stepNote || '';
        } else {
          const p = computePlan(ex, 'both', ui.planWeek);
          if (p.needsCalibration) {
            detail = '<div class="small muted mt-6">Рабочий вес ещё не указан</div>';
          } else {
            detail = `<div class="plan-sets">${esc(p.sets.map(s => fmtSetShort(ex, s)).join(' → '))}</div>`;
          }
          if (p.elbowCared) badge = '<span class="chip chip-heavy">−20%</span>';
          else if (p.weekType === 'light' && ex.deloadMode === 'every4') badge = '<span class="chip chip-light">разгрузка 3+1</span>';
          else if (wType === 'light' && p.weekType === 'heavy') badge = '<span class="chip chip-heavy">тяжёлая</span>';
          else if (p.progTag === '+1 повт') badge = '<span class="chip chip-blue">+1 повт</span>';
          note = p.stepNote || '';
        }

        return `
          <div class="card card-tight" style="margin-bottom:9px;">
            <div class="row-between">
              <div style="font-weight:700; font-size:14.5px;">${i + 1}. ${esc(ex.name)}</div>
              ${badge}
            </div>
            ${detail}
            ${note ? `<div style="font-size:11.5px; color:var(--blue); margin-top:5px;">${esc(note)}</div>` : ''}
          </div>
        `;
      }).join('');

      return `
        <div class="container">
          <div class="week-4">${pillsHtml}</div>

          <div class="seg mb-12" style="grid-template-columns:repeat(4,1fr);">
            ${[1, 2, 3, 4].map(d => `<button class="${ui.planDay === d ? 'active' : ''}" data-action="plan-day" data-day="${d}">День ${d}</button>`).join('')}
          </div>

          ${rowsHtml}

          <div class="plan-note">
            Показываем ближайшие 4 недели — дальше веса обновляются по факту твоих тренировок, без «вечного плюса».
          </div>

          ${ui.planWeek !== state.settings.currentWeek ? `
            <button class="btn btn-primary btn-block mt-12" data-action="jump-to-week" data-week="${ui.planWeek}">
              Перейти к Неделе ${ui.planWeek}
            </button>
          ` : ''}
        </div>
      `;
    }

    // ==================== RENDER: PROGRESS TAB (REAL WORKING WEIGHTS, NO 1RM!) ====================
    function renderProgressTab() {
      const totalSets = state.history.reduce((a, h) => a + (h.sets ? h.sets.length : 0), 0);
      const uniqueDays = new Set(state.history.map(h => h.date)).size;
      const uniqueWeeks = new Set(state.history.map(h => h.week)).size;
      const isDark = state.settings.theme === 'dark';

      const weightExList = state.exercises.filter(e => e.type !== 'warmup');
      const progEx = weightExList.find(e => e.id === ui.progExId) || weightExList[0] || state.exercises[0];
      const activeHand = progEx.hands === 'both' ? 'both' : ui.progHand;
      const allExRecs = getHistoryFor(progEx.id, activeHand).slice().reverse();
      // Prefer heavy weeks for clean progression chart (fallback to all if no heavy yet)
      const heavyRecs = allExRecs.filter(r => r.weekType === 'heavy');
      const chartRecs = heavyRecs.length ? heavyRecs : allExRecs;

      // Best real set & real delta
      let bestSet = { weight: 0, reps: 0, sec: 0 };
      for (const r of allExRecs) {
        const b = getBestPeakFromRecord(r);
        if (b.weight > bestSet.weight || (Math.abs(b.weight - bestSet.weight) <= 0.01 && (b.reps > bestSet.reps || b.sec > bestSet.sec))) {
          bestSet = b;
        }
      }

      let deltaText = '—';
      let deltaSub = 'Прирост';
      if (chartRecs.length >= 2) {
        const firstB = getBestPeakFromRecord(chartRecs[0]);
        const lastB = getBestPeakFromRecord(chartRecs[chartRecs.length - 1]);
        const diffKg = round2(lastB.weight - firstB.weight);
        const spanWks = Math.max(1, (chartRecs[chartRecs.length - 1].week || 1) - (chartRecs[0].week || 1));
        deltaSub = `За ${spanWks} нед.`;
        if (Math.abs(diffKg) >= 0.1) deltaText = `${diffKg > 0 ? '+' : ''}${fmtKg(diffKg)} кг`;
        else if (lastB.reps !== firstB.reps) deltaText = `${lastB.reps > firstB.reps ? '+' : ''}${lastB.reps - firstB.reps} повт`;
        else deltaText = 'ровно';
      }

      let chartHtml = '<div class="small muted" style="text-align:center; padding:22px 8px;">Сохрани первую тренировку — здесь появится график твоих реальных весов.</div>';
      if (chartRecs.length >= 1) {
        const pts = chartRecs.slice(-8).map((r, i) => {
          const b = getBestPeakFromRecord(r);
          // Slight vertical nuance for extra reps so 30.5x3 -> 30.5x4 visibly rises
          const plotY = b.weight + Math.min(0.6, Math.max(0, (b.reps - 3) * 0.15));
          const valLbl = progEx.type === 'static' ? `${fmtKg(b.weight)}×${b.sec || 15}с` : `${fmtKg(b.weight)}×${b.reps}`;
          return { x: i, y: plotY, rawW: b.weight, valLbl, wkLbl: `Нед ${r.week}` };
        });
        const W = 320, H = 138, padL = 34, padR = 18, padT = 22, padB = 24;
        const ys = pts.map(p => p.y);
        const minY = Math.max(0, Math.floor(Math.min(...ys) - 2));
        const maxY = Math.ceil(Math.max(...ys) + 2);
        const mapX = i => pts.length === 1 ? (padL + W - padR) / 2 : padL + (i / (pts.length - 1)) * (W - padL - padR);
        const mapY = y => H - padB - ((y - minY) / Math.max(1, maxY - minY)) * (H - padT - padB);

        const axisCol = isDark ? '#272732' : '#CBD5E1';
        const txtCol = isDark ? '#FAFAFA' : '#111827';
        const mutCol = isDark ? '#71717A' : '#6B7280';
        const strokeCol = isDark ? '#3B82F6' : '#2563EB';
        const prCol = isDark ? '#22C55E' : '#16A34A';
        const dotStroke = isDark ? '#131317' : '#FFFFFF';

        const poly = pts.map((p, i) => `${mapX(i).toFixed(1)},${mapY(p.y).toFixed(1)}`).join(' ');
        const dots = pts.map((p, i) => {
          const isLastPR = i === pts.length - 1 && pts.length > 1 && p.y >= Math.max(...ys) - 0.01;
          const col = isLastPR ? prCol : strokeCol;
          return `
            <circle cx="${mapX(i).toFixed(1)}" cy="${mapY(p.y).toFixed(1)}" r="4.5" fill="${col}" stroke="${dotStroke}" stroke-width="2" />
            <text x="${mapX(i).toFixed(1)}" y="${(mapY(p.y) - 9).toFixed(1)}" fill="${isLastPR ? prCol : txtCol}" font-size="10" text-anchor="middle" font-weight="${isLastPR ? '800' : '700'}">${esc(p.valLbl)}</text>
            <text x="${mapX(i).toFixed(1)}" y="${H - 6}" fill="${mutCol}" font-size="9.5" text-anchor="middle">${esc(p.wkLbl)}</text>
          `;
        }).join('');

        chartHtml = `
          <svg viewBox="0 0 ${W} ${H}" style="width:100%; height:auto; display:block;">
            <line x1="${padL}" y1="${padT}" x2="${padL}" y2="${H - padB}" stroke="${axisCol}" stroke-width="1" />
            <line x1="${padL}" y1="${H - padB}" x2="${W - padR}" y2="${H - padB}" stroke="${axisCol}" stroke-width="1" />
            <text x="${padL - 5}" y="${padT + 4}" fill="${mutCol}" font-size="9.5" text-anchor="end">${fmtKg(maxY)}</text>
            <text x="${padL - 5}" y="${H - padB}" fill="${mutCol}" font-size="9.5" text-anchor="end">${fmtKg(minY)}</text>
            ${pts.length > 1 ? `<polyline fill="none" stroke="${strokeCol}" stroke-width="2.5" stroke-linejoin="round" points="${poly}" />` : ''}
            ${dots}
          </svg>
        `;
      }

      const filteredHist = state.history
        .filter(h => ui.histFilter === 'all' || String(h.day) === ui.histFilter)
        .slice().sort((a, b) => (b.ts || 0) - (a.ts || 0));

      const histHtml = filteredHist.length ? filteredHist.slice(0, 50).map(h => {
        const handStr = h.hand === 'R' ? 'Правая' : h.hand === 'L' ? 'Левая' : '';
        const setsStr = h.type === 'warmup'
          ? (h.sets || []).map(s => `${s.reps}`).join(' · ')
          : (h.sets || []).map(s => `${fmtKg(s.weight)}×${h.type === 'static' ? (s.sec || 0) + 'с' : s.reps}`).join(' · ');
        const metaParts = [`Нед ${h.week}`, h.type === 'warmup' ? 'Разминка' : (h.weekType === 'heavy' ? 'Тяжёлая' : 'Лёгкая')];
        if (handStr) metaParts.push(handStr);
        if (h.type !== 'warmup') metaParts.push(feelLabel(h.effort));
        const warmStr = (h.warmupSets && h.warmupSets.length)
          ? h.warmupSets.map(s => `${fmtKg(s.weight)}×${h.type === 'static' ? (s.sec || 0) + 'с' : s.reps}`).join(' · ')
          : '';
        return `
          <div class="card card-tight" style="margin-bottom:8px;">
            <div class="row-between" style="align-items:flex-start;">
              <div>
                <div style="font-weight:700; font-size:14px;">${esc(h.exerciseName)}</div>
                <div class="small muted">${esc(metaParts.join(' · '))}</div>
              </div>
              <button class="btn btn-xs btn-danger" data-action="del-hist" data-id="${h.id}">✕</button>
            </div>
            <div class="plan-sets">${esc(setsStr)}</div>
            ${warmStr ? `<div class="small muted" style="font-size:11.5px; margin-top:3px;">Разминка: ${esc(warmStr)}</div>` : ''}
            ${h.note ? `<div class="small muted mt-6">${esc(h.note)}</div>` : ''}
          </div>
        `;
      }).join('') : `<div class="card small muted" style="text-align:center;">История пока пуста.</div>`;

      const bestValStr = bestSet.weight > 0
        ? (progEx.type === 'static' ? `${fmtKg(bestSet.weight)} кг × ${bestSet.sec || 15}с` : `${fmtKg(bestSet.weight)} кг × ${bestSet.reps}`)
        : '—';

      return `
        <div class="container">
          <div class="stat-grid">
