    function renderNav() {
      const items = [
        { id: 'workout',  ico: ICONS.dumbbell, lbl: 'Тренировка' },
        { id: 'plan',     ico: ICONS.calendar, lbl: 'План' },
        { id: 'progress', ico: ICONS.activity, lbl: 'Прогресс' }
      ];
      return `
        <nav class="nav">
          <div class="nav-inner">
            ${items.map(it => `
              <button class="nav-btn ${ui.tab === it.id ? 'active' : ''}" data-action="tab" data-tab="${it.id}">
                ${it.ico}
                <span>${it.lbl}</span>
              </button>
            `).join('')}
          </div>
        </nav>
      `;
    }

    function render() {
      applyTheme();
      const app = document.getElementById('app');
      const inSession = Boolean(state.activeSession && state.activeSession.active);
      app.className = 'app' + (inSession ? ' in-session' : '');

      if (inSession) {
        app.innerHTML = renderActiveSession();
        return;
      }

      let main = '';
      if (ui.tab === 'workout') main = renderWorkoutOverview();
      else if (ui.tab === 'plan') main = renderPlanTab();
      else if (ui.tab === 'progress') main = renderProgressTab();
      else main = renderGymTab();

      app.innerHTML = renderHeader() + main + renderNav();
    }

    // ==================== EVENT DELEGATION ====================
    document.addEventListener('click', (e) => {
      const btn = e.target.closest('[data-action]');
      if (!btn) return;
      const act = btn.dataset.action;

      if (act === 'toggle-theme') {
        state.settings.theme = state.settings.theme === 'dark' ? 'light' : 'dark';
        saveState();
        render();
      }
      else if (act === 'set-theme') {
        state.settings.theme = btn.dataset.val;
        saveState();
        render();
      }
      else if (act === 'toggle-gym') {
        if (ui.tab === 'gym') ui.tab = ui.prevTab || 'workout';
        else { ui.prevTab = ui.tab; ui.tab = 'gym'; }
        render();
        window.scrollTo({ top: 0, behavior: 'instant' });
      }
      else if (act === 'tab') {
        ui.tab = btn.dataset.tab;
        if (ui.tab === 'plan') { ui.planWeek = state.settings.currentWeek; ui.planDay = ui.selectedDay; }
        render();
        window.scrollTo({ top: 0, behavior: 'instant' });
      }
      else if (act === 'sel-day') {
        ui.selectedDay = parseInt(btn.dataset.day, 10);
        render();
      }
      else if (act === 'week-prev') {
        if (state.settings.currentWeek > 1) {
          state.settings.currentWeek--;
          saveState();
          render();
        }
      }
      else if (act === 'week-next') {
        state.settings.currentWeek++;
        saveState();
        showToast(`Неделя ${state.settings.currentWeek} (${getWeekType(state.settings.currentWeek, state.settings.startWeekType) === 'heavy' ? 'Тяжёлая' : 'Лёгкая'})`);
        render();
      }
      else if (act === 'toggle-elbow') {
        const h = btn.dataset.hand;
        if (!state.settings.elbowCare) state.settings.elbowCare = { R: false, L: false };
        state.settings.elbowCare[h] = !state.settings.elbowCare[h];
        clearUntouchedDraftsFor(null);
        saveState();
        showToast(`${h === 'R' ? 'Правый' : 'Левый'} локоть: ${state.settings.elbowCare[h] ? 'бережём (−20% в крюке и кисти)' : 'обычный режим'}`);
        render();
      }
      else if (act === 'set-scheme') {
        state.settings.heavyScheme = btn.dataset.val;
        clearUntouchedDraftsFor(null);
        saveState();
        render();
      }
      else if (act === 'set-start-wt') {
        state.settings.startWeekType = btn.dataset.val;
        clearUntouchedDraftsFor(null);
        saveState();
        render();
      }

      // ---- GUIDED SESSION ACTIONS ----
      else if (act === 'start-day') startSession(ui.selectedDay, null);
      else if (act === 'start-ex') startSession(ui.selectedDay, btn.dataset.id);
      else if (act === 'exit-session' || act === 'finish-day-home') {
        state.activeSession = null;
        ui.editBaseOpen = false;
        saveState();
        syncKeepScreenOn();
        render();
        window.scrollTo({ top: 0, behavior: 'instant' });
      }
      else if (act === 'sess-prev-ex' || act === 'sess-next-ex') {
        const sess = state.activeSession;
        if (!sess) return;
        const list = getDayExercises(sess.day);
        const curIdx = list.findIndex(x => x.id === sess.exId);
        const nextIdx = act === 'sess-next-ex' ? curIdx + 1 : curIdx - 1;
        if (nextIdx >= 0 && nextIdx < list.length) switchSessionTo(list[nextIdx]);
      }
      else if (act === 'toggle-edit-base') {
        ui.editBaseOpen = !ui.editBaseOpen;
        render();
      }
      else if (act === 'toggle-calib-same') {
        ui.calibSameHands = !ui.calibSameHands;
        render();
      }
      else if (act === 'sess-apply-calib') {
        const sess = state.activeSession;
        if (!sess) return;
        const ex = state.exercises.find(x => x.id === sess.exId);
        const equip = getEquip(ex.equipId);
        const is42 = state.settings.heavyScheme === '8-6-6-4-2';
        if (!ex.baselinePeak) ex.baselinePeak = {};

        if (ex.hands === 'uni') {
          const wR = parseFloat(document.getElementById('calib-w-r')?.value);
          const rR = parseInt(document.getElementById('calib-r-r')?.value, 10) || 8;
          if (isNaN(wR) || wR <= 0) { showToast('Впиши вес в кг'); return; }
          const peakR = ex.type === 'static' ? snapWeight(wR, equip).weight : estimatePeakFromWorking(wR, rR, equip, is42);
          let peakL = peakR;
          if (!ui.calibSameHands) {
            const wL = parseFloat(document.getElementById('calib-w-l')?.value);
            const rL = parseInt(document.getElementById('calib-r-l')?.value, 10) || 8;
            if (isNaN(wL) || wL <= 0) { showToast('Впиши вес для левой руки'); return; }
            peakL = ex.type === 'static' ? snapWeight(wL, equip).weight : estimatePeakFromWorking(wL, rL, equip, is42);
          }
          ex.baselinePeak.R = peakR;
          ex.baselinePeak.L = peakL;
          delete state.drafts[draftKey(sess.week, ex.id, 'R')];
          delete state.drafts[draftKey(sess.week, ex.id, 'L')];
        } else {
          const wB = parseFloat(document.getElementById('calib-w-b')?.value);
          const rB = parseInt(document.getElementById('calib-r-b')?.value, 10) || 8;
          if (isNaN(wB) || wB <= 0) { showToast('Впиши вес в кг'); return; }
          ex.baselinePeak.both = ex.type === 'static' ? snapWeight(wB, equip).weight : estimatePeakFromWorking(wB, rB, equip, is42);
          delete state.drafts[draftKey(sess.week, ex.id, 'both')];
        }
        clearUntouchedDraftsFor(ex.id);
        ui.editBaseOpen = false;
        sess.setIdx = 0;
        sess.hand = ex.hands === 'uni' ? 'R' : 'both';
        sess.phase = 'ready';
        sess.lastCompleted = null;
        saveState();
        showToast('Готово — подходы рассчитаны!');
        render();
      }
      else if (act === 'sess-go') {
        unlockAudio();
        const sess = state.activeSession;
        if (!sess) return;
        sess.phase = 'working';
        sess.workStartedAt = Date.now();
        sess.restEndAt = 0;
        sess.editingSlot = null;
        sess.lastCompleted = null;
        ui.staticTargetBeeped = false;
        saveState();
        render();
      }
      else if (act === 'sess-done-set') {
        unlockAudio();
        const sess = state.activeSession;
        if (!sess) return;
        const ex = state.exercises.find(x => x.id === sess.exId);
        const isUni = ex.hands === 'uni';
        const hand = isUni ? (sess.hand === 'L' ? 'L' : 'R') : 'both';
        const plan = computePlan(ex, hand, sess.week);
        const draft = getOrInitDraft(ex, hand, plan, sess.week);
        const curSet = draft.sets[sess.setIdx];
        if (!curSet) return;

        const completedIdx = sess.setIdx;
        curSet.done = true;
        curSet.feel = 'ok';
        const isPeakSet = Boolean(curSet.isPeak || (plan.weekType === 'heavy' && completedIdx >= 3));
        const fullRestSec = ((plan.sets && plan.sets[completedIdx]) || {}).restSec || 90;

        // Track last completed set for live autoregulation
        const justFinishedPair = isUni && hand === 'L';
        const draftR = isUni ? getOrInitDraft(ex, 'R', computePlan(ex, 'R', sess.week), sess.week) : draft;
        const draftL = isUni ? getOrInitDraft(ex, 'L', computePlan(ex, 'L', sess.week), sess.week) : null;
        const rightRatedSeparately = justFinishedPair && draftR.sets[completedIdx] && (!draftR.sets[completedIdx].done || draftR.sets[completedIdx].feel !== 'ok');

        sess.editingSlot = null;
        sess.workStartedAt = 0;

        // Find next undone paired slot (if Right of this same set was unmarked into warmup/fail, bring Right back next!)
        let nextSlot = null;
        if (isUni && hand === 'L' && draftR.sets[completedIdx] && !draftR.sets[completedIdx].done) {
          nextSlot = { setIdx: completedIdx, hand: 'R' };
        } else {
          const nextSearchHand = isUni ? (hand === 'R' ? 'L' : 'R') : 'both';
          const nextSearchIdx = (isUni && hand === 'R') ? completedIdx : completedIdx + 1;
          nextSlot = findNextPairedSlot(ex, sess.week, nextSearchIdx, nextSearchHand);
        }

        if (!nextSlot) {
          sess.phase = 'finish_ex';
          sess.restEndAt = 0;
          sess.restType = null;
        } else if (isUni && hand === 'R' && nextSlot.setIdx === completedIdx && nextSlot.hand === 'L') {
          // Transition from Right -> Left of the SAME set
          sess.hand = 'L';
          sess.setIdx = nextSlot.setIdx;
          if (isPeakSet && ex.type !== 'warmup') {
            // Peak sets (4-5 on heavy week): 0:45 pause even between hands!
            sess.phase = 'resting';
            sess.restType = 'between_hands';
            sess.restTotal = PEAK_BETWEEN_HANDS_REST;
            sess.restEndAt = Date.now() + PEAK_BETWEEN_HANDS_REST * 1000;
          } else {
            // Warm-up / lead-up / light sets: go straight to Left hand without timer!
            sess.phase = 'ready';
            sess.restType = null;
            sess.restEndAt = 0;
          }
        } else {
          // Full rest before next set!
          sess.setIdx = nextSlot.setIdx;
          sess.hand = nextSlot.hand;
          sess.phase = 'resting';
          sess.restType = 'between_sets';
          sess.restTotal = fullRestSec;
          sess.restEndAt = Date.now() + fullRestSec * 1000;
        }

        // Snapshot exact 'ok' state right after completion so live feel buttons are 100% idempotent AND stack across sets!
        sess.lastCompleted = {
          setIdx: completedIdx,
          hand,
          weight: curSet.weight,
          reps: curSet.reps,
          sec: curSet.sec,
          pairedBoth: justFinishedPair && !rightRatedSeparately,
          feel: 'ok',
          feedback: '',
          fromFailBtn: false,
          snap: {
            nextSetIdx: sess.setIdx,
            nextHand: sess.hand,
            nextPhase: sess.phase,
            nextRestType: sess.restType,
            setsR: cloneObj(draftR.sets),
            extraR: cloneObj(draftR.extraLog || []),
            effortR: draftR.effort,
            setsL: isUni && draftL ? cloneObj(draftL.sets) : null,
            extraL: isUni && draftL ? cloneObj(draftL.extraLog || []) : null,
            effortL: isUni && draftL ? draftL.effort : null
          }
        };

        saveState();
        render();
      }
      else if (act === 'sess-live-feel') {
        const sess = state.activeSession;
        if (!sess || !sess.lastCompleted) return;
        const ex = state.exercises.find(x => x.id === sess.exId);
        const feel = btn.dataset.feel;
        applyLiveFeelOnSession(sess, ex, feel);
        saveState();
        render();
      }
      else if (act === 'sess-fail-set') {
        unlockAudio();
        const sess = state.activeSession;
        if (!sess) return;
        const ex = state.exercises.find(x => x.id === sess.exId);
        const isUni = ex.hands === 'uni';
        const hand = isUni ? (sess.hand === 'L' ? 'L' : 'R') : 'both';
        const plan = computePlan(ex, hand, sess.week);
        const draft = getOrInitDraft(ex, hand, plan, sess.week);
        const equip = getEquip(ex.equipId);
        const curSet = draft.sets[sess.setIdx];
        if (!curSet) return;

        const preSnap = {
          setIdx: sess.setIdx,
          hand,
          sets: cloneObj(draft.sets),
          extra: cloneObj(draft.extraLog || []),
          effort: draft.effort
        };

        const origW = curSet.weight, origR = curSet.reps, origSec = curSet.sec || null;
        draft.extraLog.push({ kind: 'fail', setIdx: sess.setIdx, weight: origW, reps: origR, sec: origSec });
        curSet.done = false;
        curSet.feel = 'ok';
        adjustRemainingWorkingSets(draft, sess.setIdx, -1, ex, equip, false);
        deriveDraftEffort(draft);

        const fullRestSec = ((plan.sets && plan.sets[sess.setIdx]) || {}).restSec || 90;
        const retryRestSec = Math.min(fullRestSec, 120);
        const retryS = draft.sets[sess.setIdx];
        const msg = `Не засчитал ${fmtSetShort(ex, { weight: origW, reps: origR, sec: origSec })} — скинул до ${fmtSetShort(ex, retryS)}, отдохни и переделай`;

        sess.phase = 'resting';
        sess.restType = 'retry_fail';
        sess.restTotal = retryRestSec;
        sess.restEndAt = Date.now() + retryRestSec * 1000;
        sess.workStartedAt = 0;
        sess.editingSlot = null;
        sess.lastCompleted = {
          setIdx: sess.setIdx,
          hand,
          weight: origW,
          reps: origR,
          sec: origSec,
          pairedBoth: false,
          feel: 'fail',
          feedback: msg,
          fromFailBtn: true,
          failUndoSnap: preSnap
        };
        saveState();
        render();
      }
      else if (act === 'sess-undo-fail') {
        const sess = state.activeSession;
        if (!sess || !sess.lastCompleted || !sess.lastCompleted.failUndoSnap) return;
        const ex = state.exercises.find(x => x.id === sess.exId);
        const u = sess.lastCompleted.failUndoSnap;
        const draft = getOrInitDraft(ex, u.hand, computePlan(ex, u.hand, sess.week), sess.week);
        draft.sets = cloneObj(u.sets);
        draft.extraLog = cloneObj(u.extra || []);
        draft.effort = u.effort;
        sess.setIdx = u.setIdx;
        sess.hand = u.hand;
        sess.phase = 'ready';
        sess.restType = null;
        sess.restEndAt = 0;
        sess.lastCompleted = null;
        saveState();
        showToast('Отменил — вес подхода восстановлен');
        render();
      }
      else if (act === 'rest-adj') {
        const sess = state.activeSession;
        if (!sess || sess.phase !== 'resting') return;
        const delta = parseInt(btn.dataset.sec, 10) || 0;
        const newEnd = Math.max(Date.now() + 1000, sess.restEndAt + delta * 1000);
        sess.restEndAt = newEnd;
        const remainSec = Math.ceil((newEnd - Date.now()) / 1000);
        if (remainSec > sess.restTotal) sess.restTotal = remainSec;
        saveState();
        onTick();
      }
      else if (act === 'rest-more') {
        unlockAudio();
        const sess = state.activeSession;
        if (!sess) return;
        sess.phase = 'resting';
        sess.restTotal = 30;
        sess.restEndAt = Date.now() + 30000;
        saveState();
        render();
      }
      else if (act === 'rest-skip') {
        const sess = state.activeSession;
        if (!sess) return;
        sess.restEndAt = 0;
        sess.restType = null;
        sess.phase = 'ready';
        sess.editingSlot = null;
        sess.lastCompleted = null;
        saveState();
        render();
      }
      else if (act === 'sess-edit-slot') {
        e.stopPropagation();
        const sess = state.activeSession;
        if (!sess) return;
        const idx = parseInt(btn.dataset.idx, 10);
        const h = btn.dataset.hand || sess.hand;
        const same = sess.editingSlot && sess.editingSlot.setIdx === idx && sess.editingSlot.hand === h;
        sess.editingSlot = same ? null : { setIdx: idx, hand: h };
        saveState();
        render();
      }
      else if (act === 'sess-close-edit') {
        e.stopPropagation();
        if (state.activeSession) {
          state.activeSession.editingSlot = null;
          saveState();
          render();
        }
      }
      else if (act === 'sess-pick-slot') {
        e.stopPropagation();
        const sess = state.activeSession;
        if (!sess) return;
        const ex = state.exercises.find(x => x.id === sess.exId);
        const idx = parseInt(btn.dataset.idx, 10);
        const h = btn.dataset.hand || sess.hand;
        const dTarget = getOrInitDraft(ex, h, computePlan(ex, h, sess.week), sess.week);
        const slotDone = Boolean(dTarget.sets[idx] && dTarget.sets[idx].done);
        const same = sess.editingSlot && sess.editingSlot.setIdx === idx && sess.editingSlot.hand === h;
        if (slotDone || (idx === sess.setIdx && h === sess.hand)) {
          // Tap on already-done (or current) slot immediately toggles its inline editor (with "Снять галочку")
          sess.editingSlot = same ? null : { setIdx: idx, hand: h };
        } else if (sess.phase === 'ready' || sess.phase === 'rest_done') {
          sess.setIdx = idx;
          sess.hand = h;
          sess.editingSlot = null;
        } else {
          sess.editingSlot = same ? null : { setIdx: idx, hand: h };
        }
        saveState();
        render();
      }
      else if (act === 'sess-uncheck-slot') {
        e.stopPropagation();
        const sess = state.activeSession;
        if (!sess) return;
        const ex = state.exercises.find(x => x.id === sess.exId);
        const idx = parseInt(btn.dataset.idx, 10);
        const h = btn.dataset.hand || sess.hand;
        const draft = getOrInitDraft(ex, h, computePlan(ex, h, sess.week), sess.week);
        if (!draft.sets[idx]) return;
        draft.sets[idx].done = false;
        draft.sets[idx].feel = 'ok';
        deriveDraftEffort(draft);
        sess.editingSlot = null;
        sess.lastCompleted = null;
        if (sess.phase !== 'working' && sess.phase !== 'resting') {
          sess.setIdx = idx;
          sess.hand = h;
          sess.phase = 'ready';
          sess.restType = null;
          sess.restEndAt = 0;
        }
        saveState();
        showToast('Галочка снята — можно переделать подход');
        render();
      }
      else if (act === 'sess-del-extra') {
        e.stopPropagation();
        const sess = state.activeSession;
        if (!sess) return;
        const ex = state.exercises.find(x => x.id === sess.exId);
        const ir = parseInt(btn.dataset.ir, 10);
        const il = parseInt(btn.dataset.il, 10);
        if (ex.hands === 'uni') {
          if (!isNaN(ir) && ir >= 0) {
            const dR = getOrInitDraft(ex, 'R', computePlan(ex, 'R', sess.week), sess.week);
            if (dR.extraLog && ir < dR.extraLog.length) {
              dR.extraLog.splice(ir, 1);
              deriveDraftEffort(dR);
            }
          }
          if (!isNaN(il) && il >= 0) {
            const dL = getOrInitDraft(ex, 'L', computePlan(ex, 'L', sess.week), sess.week);
            if (dL.extraLog && il < dL.extraLog.length) {
              dL.extraLog.splice(il, 1);
              deriveDraftEffort(dL);
            }
          }
        } else if (!isNaN(ir) && ir >= 0) {
          const dB = getOrInitDraft(ex, 'both', computePlan(ex, 'both', sess.week), sess.week);
          if (dB.extraLog && ir < dB.extraLog.length) {
            dB.extraLog.splice(ir, 1);
            deriveDraftEffort(dB);
          }
        }
        sess.lastCompleted = null;
        saveState();
        showToast('Запись убрана');
        render();
      }
      else if (act === 'sess-reset-ex') {
        const sess = state.activeSession;
        if (!sess) return;
        const ex = state.exercises.find(x => x.id === sess.exId);
        if (!confirm('Сбросить все отмеченные подходы в этом упражнении и начать с 1-го?')) return;
        if (ex.hands === 'uni') {
          delete state.drafts[draftKey(sess.week, ex.id, 'R')];
          delete state.drafts[draftKey(sess.week, ex.id, 'L')];
        } else {
          delete state.drafts[draftKey(sess.week, ex.id, 'both')];
        }
        sess.setIdx = 0;
        sess.hand = ex.hands === 'uni' ? 'R' : 'both';
        sess.phase = 'ready';
        sess.restType = null;
        sess.restEndAt = 0;
        sess.workStartedAt = 0;
        sess.editingSlot = null;
        sess.lastCompleted = null;
        saveState();
        showToast('Сброшено — начинаем с 1-го подхода');
        render();
      }
      else if (act === 'sess-step-w' || act === 'sess-step-r') {
        e.stopPropagation();
        const sess = state.activeSession;
        if (!sess) return;
        const ex = state.exercises.find(x => x.id === sess.exId);
        const idx = parseInt(btn.dataset.idx, 10);
        const h = btn.dataset.hand || sess.hand;
        const dir = parseInt(btn.dataset.dir, 10);
        const plan = computePlan(ex, h, sess.week);
        const draft = getOrInitDraft(ex, h, plan, sess.week);
        if (!draft.sets[idx]) return;
        if (act === 'sess-step-w') {
          draft.sets[idx].weight = stepWeightBy(draft.sets[idx].weight, dir, getEquip(ex.equipId));
        } else if (ex.type === 'static') {
          draft.sets[idx].sec = Math.max(5, (draft.sets[idx].sec || 15) + dir * 5);
        } else {
          draft.sets[idx].reps = Math.max(0, (draft.sets[idx].reps || 0) + dir);
        }
        saveState();
        render();
      }
      else if (act === 'sess-add-set') {
        const sess = state.activeSession;
        if (!sess) return;
        const ex = state.exercises.find(x => x.id === sess.exId);
        const handsToAdd = ex.hands === 'uni' ? ['R', 'L'] : ['both'];
        let newLen = 0;
        for (const h of handsToAdd) {
          const plan = computePlan(ex, h, sess.week);
          const draft = getOrInitDraft(ex, h, plan, sess.week);
          const last = draft.sets[draft.sets.length - 1] || { weight: 10, reps: ex.type === 'warmup' ? 10 : 8, sec: 15, isPeak: false };
          const copy = { weight: last.weight, reps: last.reps, sec: last.sec, done: false, feel: 'ok', isPeak: Boolean(last.isPeak) };
          draft.sets.push(copy);
          draft.baseSets.push(Object.assign({}, copy));
          newLen = draft.sets.length;
        }
        if (sess.phase === 'finish_ex') {
          sess.setIdx = newLen - 1;
          sess.hand = ex.hands === 'uni' ? 'R' : 'both';
          sess.phase = 'ready';
        }
        saveState();
        render();
      }
      else if (act === 'sess-effort') {
        const sess = state.activeSession;
        if (!sess) return;
        const ex = state.exercises.find(x => x.id === sess.exId);
        const targetH = btn.dataset.hand || 'all';
        const ef = btn.dataset.eff;
        const hands = (targetH === 'all' && ex.hands === 'uni') ? ['R', 'L'] : (targetH === 'all' ? ['both'] : [targetH]);
        for (const h of hands) {
          const d = getOrInitDraft(ex, h, computePlan(ex, h, sess.week), sess.week);
          d.effort = ef;
          d.effortManual = true;
        }
        saveState();
        render();
      }
      else if (act === 'sess-save-next') {
        unlockAudio();
        const sess = state.activeSession;
        if (!sess) return;
        const ex = state.exercises.find(x => x.id === sess.exId);
        const restAfter = parseInt(btn.dataset.rest, 10) || 0;
        saveExerciseComplete(ex, sess.week);

        const nextEx = findNextExAfter(ex, sess.week);
        if (!nextEx) {
          sess.phase = 'day_done';
          sess.restEndAt = 0;
          sess.restType = null;
          saveState();
          syncKeepScreenOn();
          render();
          window.scrollTo({ top: 0, behavior: 'instant' });
          return;
        }

        if (restAfter > 0) {
          const initH = nextEx.hands === 'uni' ? 'R' : 'both';
          if (!needsCalibrationForEx(nextEx, sess.week)) {
            if (nextEx.hands === 'uni') {
              getOrInitDraft(nextEx, 'R', computePlan(nextEx, 'R', sess.week), sess.week);
              getOrInitDraft(nextEx, 'L', computePlan(nextEx, 'L', sess.week), sess.week);
            } else {
              getOrInitDraft(nextEx, 'both', computePlan(nextEx, 'both', sess.week), sess.week);
            }
          }
          sess.exId = nextEx.id;
          sess.hand = initH;
          sess.setIdx = 0;
          sess.phase = 'resting';
          sess.restType = 'between_ex';
          sess.restTotal = restAfter;
          sess.restEndAt = Date.now() + restAfter * 1000;
          sess.editingSlot = null;
          sess.lastCompleted = null;
          ui.editBaseOpen = false;
          saveState();
          showToast(`Сохранено! Отдых ${fmtTime(restAfter)}`);
          render();
          window.scrollTo({ top: 0, behavior: 'instant' });
        } else {
          showToast(`Сохранено: ${ex.name}`);
          switchSessionTo(nextEx);
        }
      }

      // ---- PLAN / PROGRESS / GYM ACTIONS ----
      else if (act === 'plan-week') { ui.planWeek = parseInt(btn.dataset.week, 10); render(); }
      else if (act === 'plan-day') { ui.planDay = parseInt(btn.dataset.day, 10); render(); }
      else if (act === 'jump-to-week') {
        state.settings.currentWeek = parseInt(btn.dataset.week, 10);
        ui.selectedDay = ui.planDay;
        ui.tab = 'workout';
        saveState();
        render();
      }
      else if (act === 'prog-hand') { ui.progHand = btn.dataset.hand; render(); }
      else if (act === 'del-hist') {
        if (!confirm('Удалить запись из истории?')) return;
        state.history = state.history.filter(h => h.id !== btn.dataset.id);
        saveState();
        showToast('Удалено');
        render();
      }
      else if (act === 'clear-history') {
        if (!confirm('Очистить всю историю тренировок и незавершённые подходы? Твои рабочие веса и настройки зала останутся.')) return;
        state.history = [];
        state.drafts = {};
        state.activeSession = null;
        state.settings.currentWeek = 1;
        ui.planWeek = 1;
        saveState();
        syncKeepScreenOn();
        showToast('История и черновики очищены');
        render();
      }
      else if (act === 'gym-sub') { ui.gymSub = btn.dataset.sub; render(); }
      else if (act === 'add-db') {
        const val = parseFloat(document.getElementById('new-db-input')?.value);
        if (isNaN(val) || val <= 0) { showToast('Впиши вес'); return; }
        const list = getSortedList(state.equipment.dumbbells);
        if (!list.includes(round2(val))) {
          list.push(round2(val)); list.sort((a, b) => a - b);
          state.equipment.dumbbells.weights = list;
          clearUntouchedDraftsFor(null);
          saveState();
          showToast(`Добавлена гантель ${fmtKg(val)} кг`);
          render();
        }
      }
      else if (act === 'del-db') {
        const w = parseFloat(btn.dataset.w);
        const list = getSortedList(state.equipment.dumbbells).filter(x => x !== w);
        if (!list.length) { showToast('Нужна хотя бы одна гантель'); return; }
        state.equipment.dumbbells.weights = list;
        clearUntouchedDraftsFor(null);
        saveState();
        render();
      }
      else if (act === 'add-custom-ex') {
        const name = (document.getElementById('new-ex-name')?.value || '').trim();
        if (!name) { showToast('Впиши название'); return; }
        const day = parseInt(document.getElementById('new-ex-day').value, 10);
        const equipId = document.getElementById('new-ex-equip').value;
        const hands = document.getElementById('new-ex-hands').value;
        const maxOrder = Math.max(0, ...state.exercises.filter(x => x.day === day).map(x => x.order));
        state.exercises.push({
          id: 'custom_' + Date.now(), day, order: maxOrder + 1, name, equipId, hands,
          type: 'weight', elbowRisk: false, deloadMode: 'working', baselinePeak: {}
        });
        saveState();
        showToast(`Добавлено в День ${day}`);
        render();
      }
      else if (act === 'export-file') {
        const jsonStr = JSON.stringify(state, null, 2);
        const fname = `armplan-backup-${new Date().toISOString().slice(0, 10)}.json`;
        if (window.AndroidBridge && window.AndroidBridge.shareBackup) {
          window.AndroidBridge.shareBackup(jsonStr, fname);
          showToast('Выбери куда сохранить');
        } else {
          const blob = new Blob([jsonStr], { type: 'application/json' });
          const a = document.createElement('a');
          a.href = URL.createObjectURL(blob); a.download = fname; a.click();
          showToast('Файл скачан');
        }
      }
      else if (act === 'export-copy') {
        const txt = JSON.stringify(state);
        if (window.AndroidBridge && window.AndroidBridge.copyText && window.AndroidBridge.copyText(txt)) {
          showToast('Скопировано! Сохрани в Заметках');
        } else if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(txt).then(() => showToast('Скопировано!'));
        }
      }
      else if (act === 'import-run') {
        const fileInp = document.getElementById('import-file');
        const txtInp = document.getElementById('import-text');
        const applyJson = (rawStr) => {
          try {
            const parsed = JSON.parse(rawStr);
            if (!parsed || typeof parsed !== 'object' || !Array.isArray(parsed.history)) {
              showToast('Неверный файл копии'); return;
            }
            state = mergeWithDefaults(parsed);
            state.activeSession = null;
            saveState();
            showToast(`Восстановлено записей: ${state.history.length}`);
            render();
          } catch { showToast('Ошибка чтения файла'); }
        };
        if (fileInp && fileInp.files && fileInp.files[0]) {
          const reader = new FileReader();
          reader.onload = () => applyJson(reader.result);
          reader.readAsText(fileInp.files[0]);
        } else if (txtInp && txtInp.value.trim()) {
          applyJson(txtInp.value.trim());
        } else {
          showToast('Выбери файл или вставь код');
        }
      }
    });

    document.addEventListener('change', (e) => {
      const el = e.target.closest('[data-action]');
      if (!el) return;
      const act = el.dataset.action;

      if (act === 'sess-inp-w' || act === 'sess-inp-r') {
        const sess = state.activeSession;
        if (!sess) return;
        const ex = state.exercises.find(x => x.id === sess.exId);
        const idx = parseInt(el.dataset.idx, 10);
        const h = el.dataset.hand || sess.hand;
        const draft = getOrInitDraft(ex, h, computePlan(ex, h, sess.week), sess.week);
        if (!draft.sets[idx]) return;
        if (act === 'sess-inp-w') draft.sets[idx].weight = Math.max(0, round2(parseFloat(el.value) || 0));
        else if (ex.type === 'static') draft.sets[idx].sec = Math.max(1, parseInt(el.value, 10) || 15);
        else draft.sets[idx].reps = Math.max(0, parseInt(el.value, 10) || 0);
        saveState();
      }
      else if (act === 'draft-note') {
        const sess = state.activeSession;
        if (!sess) return;
        const ex = state.exercises.find(x => x.id === sess.exId);
        const hands = ex.hands === 'uni' ? ['R', 'L'] : ['both'];
        for (const h of hands) {
          const d = getOrInitDraft(ex, h, computePlan(ex, h, sess.week), sess.week);
          d.note = el.value;
        }
        saveState();
      }
      else if (act === 'prog-ex') { ui.progExId = el.value; render(); }
      else if (act === 'hist-filter') { ui.histFilter = el.value; render(); }
      else if (act === 'set-comp') { state.settings.compDate = el.value; saveState(); render(); }
      else if (act === 'set-sound') { state.settings.soundEnabled = Boolean(el.checked); saveState(); }
      else if (act === 'upd-equip') {
        const eq = state.equipment[el.dataset.id];
        if (!eq) return;
        const v = parseFloat(el.value);
        if (!isNaN(v) && v >= 0) {
          eq[el.dataset.field] = round2(v);
          clearUntouchedDraftsFor(null);
          saveState();
          showToast('Сохранено');
        }
      }
      else if (act === 'ex-elbow-risk') {
        const ex = state.exercises.find(x => x.id === el.dataset.id);
        if (ex) { ex.elbowRisk = Boolean(el.checked); clearUntouchedDraftsFor(ex.id); saveState(); }
      }
      else if (act === 'ex-change-equip') {
        const ex = state.exercises.find(x => x.id === el.dataset.id);
        if (ex) { ex.equipId = el.value; clearUntouchedDraftsFor(ex.id); saveState(); showToast('Снаряд обновлён'); }
      }
      else if (act === 'ex-deload-mode') {
        const ex = state.exercises.find(x => x.id === el.dataset.id);
        if (ex) { ex.deloadMode = el.value; clearUntouchedDraftsFor(ex.id); saveState(); showToast('Режим разгрузки обновлён'); }
      }
      else if (act === 'ex-warmup') {
        const ex = state.exercises.find(x => x.id === el.dataset.id);
        if (ex) {
          ex[el.dataset.field] = Math.max(1, parseInt(el.value, 10) || 1);
          clearUntouchedDraftsFor(ex.id);
          saveState();
          showToast('Обновлено');
        }
      }
      else if (act === 'ex-peak') {
        const ex = state.exercises.find(x => x.id === el.dataset.id);
        if (ex) {
          if (!ex.baselinePeak) ex.baselinePeak = {};
          const v = parseFloat(el.value);
          if (!isNaN(v) && v > 0) ex.baselinePeak[el.dataset.hand] = snapWeight(v, getEquip(ex.equipId)).weight;
          else delete ex.baselinePeak[el.dataset.hand];
          clearUntouchedDraftsFor(ex.id);
          saveState();
        }
      }
    });

    // Android hardware Back button handler
    window.__armplanBack = function() {
      if (state.activeSession && state.activeSession.active) {
        if (ui.editBaseOpen) { ui.editBaseOpen = false; render(); return true; }
        if (state.activeSession.editingSlot) { state.activeSession.editingSlot = null; saveState(); render(); return true; }
        state.activeSession = null;
        saveState();
        syncKeepScreenOn();
        render();
        return true;
      }
      if (ui.tab === 'gym') { ui.tab = ui.prevTab || 'workout'; render(); return true; }
      if (ui.tab !== 'workout') { ui.tab = 'workout'; render(); return true; }
      return false;
    };

    // ==================== BOOT ====================
    async function boot() {
      await loadState();
      ui.planWeek = state.settings.currentWeek;
      ensureTicker();
      syncKeepScreenOn();
      render();
      if ('serviceWorker' in navigator && location.protocol === 'https:' && location.hostname !== 'appassets.androidplatform.net') {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      }
    }
    boot();
  })();
  </script>
</body>
</html>
