<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1120" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>ArmPlan</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/png" href="./icon-192.png" />
  <style>
    :root {
      --bg: #0b1120;
      --bg2: #11192e;
      --card: #162038;
      --card2: #1c2947;
      --border: #263659;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-dark: #0284c7;
      --heavy: #f59e0b;
      --heavy-bg: rgba(245, 158, 11, 0.15);
      --light: #10b981;
      --light-bg: rgba(16, 185, 129, 0.15);
      --danger: #f43f5e;
      --danger-bg: rgba(244, 63, 94, 0.14);
      --ok: #22c55e;
      --radius: 14px;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0;
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 15px; line-height: 1.38;
      overscroll-behavior-y: contain;
    }

    .app {
      max-width: 520px;
      margin: 0 auto;
      min-height: 100vh;
      padding-bottom: calc(88px + var(--safe-bottom));
    }
    .app.has-timer { padding-bottom: calc(148px + var(--safe-bottom)); }

    /* Top Header */
    .topbar {
      position: sticky; top: 0; z-index: 30;
      background: rgba(11, 17, 32, 0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 11px 14px;
    }
    .topbar-row {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
    }
    .brand { display: flex; align-items: center; gap: 9px; }
    .brand-logo {
      width: 32px; height: 32px; border-radius: 9px;
      background: linear-gradient(135deg, #0ea5e9, #1d4ed8);
      display: flex; align-items: center; justify-content: center;
      font-weight: 900; font-size: 17px; color: #fff;
      box-shadow: 0 2px 10px rgba(56, 189, 248, 0.3);
      flex-shrink: 0;
    }
    .brand-title { font-weight: 800; font-size: 16px; }
    .brand-sub { font-size: 11.5px; color: var(--muted); }

    .badge {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 4px 10px; border-radius: 999px;
      font-size: 12px; font-weight: 700; white-space: nowrap;
    }
    .badge-sm { padding: 2px 7px; font-size: 10.5px; }
    .badge-heavy { background: var(--heavy-bg); color: var(--heavy); border: 1px solid rgba(245, 158, 11, 0.35); }
    .badge-light { background: var(--light-bg); color: var(--light); border: 1px solid rgba(16, 185, 129, 0.35); }
    .badge-accent { background: rgba(56, 189, 248, 0.14); color: var(--accent); border: 1px solid rgba(56, 189, 248, 0.3); }
    .badge-danger { background: var(--danger-bg); color: var(--danger); border: 1px solid rgba(244, 63, 94, 0.35); }
    .badge-muted { background: var(--card2); color: var(--muted); border: 1px solid var(--border); }

    .container { padding: 12px 14px; }

    /* Cards & Controls */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 13px;
      margin-bottom: 10px;
    }
    .card-title { font-weight: 700; font-size: 15px; }

    button {
      font-family: inherit; cursor: pointer; border: none; outline: none;
      color: var(--text); background: transparent;
      transition: transform 0.08s ease, opacity 0.12s ease, background 0.12s ease;
    }
    button:active { transform: scale(0.97); }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      padding: 10px 14px; border-radius: 11px;
      font-size: 14px; font-weight: 700;
      background: var(--card2); border: 1px solid var(--border);
      min-height: 44px;
    }
    .btn-primary {
      background: linear-gradient(135deg, #0ea5e9, #2563eb);
      border-color: rgba(56, 189, 248, 0.4); color: #fff;
    }
    .btn-ok {
      background: linear-gradient(135deg, #10b981, #059669);
      border-color: rgba(16, 185, 129, 0.4); color: #fff;
    }
    .btn-danger {
      background: var(--danger-bg); border-color: rgba(244, 63, 94, 0.4); color: var(--danger);
    }
    .btn-sm { padding: 7px 11px; font-size: 13px; min-height: 36px; border-radius: 9px; }
    .btn-xs { padding: 5px 9px; font-size: 12px; min-height: 32px; border-radius: 8px; }
    .btn-block { width: 100%; }

    /* Week switcher */
    .week-bar {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 9px 11px; margin-bottom: 10px;
    }
    .week-nav-btn {
      width: 38px; height: 38px; border-radius: 10px;
      background: var(--card2); border: 1px solid var(--border);
      font-size: 19px; font-weight: 700; display: flex; align-items: center; justify-content: center;
    }
    .week-info { text-align: center; flex: 1; }
    .week-num { font-weight: 800; font-size: 15.5px; display: flex; align-items: center; justify-content: center; gap: 7px; }
    .week-desc { font-size: 12px; color: var(--muted); margin-top: 2px; }

    /* Day tabs */
    .day-tabs {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px;
      margin-bottom: 10px;
    }
    .day-tab {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; padding: 8px 4px; text-align: center;
    }
    .day-tab.active {
      background: rgba(56, 189, 248, 0.16);
      border-color: var(--accent);
      box-shadow: 0 0 0 1px rgba(56, 189, 248, 0.25);
    }
    .day-tab-n { font-weight: 800; font-size: 13px; }
    .day-tab-sub { font-size: 10.5px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .day-tab-prog { font-size: 11px; margin-top: 3px; font-weight: 700; color: var(--accent); }
    .day-tab-prog.done { color: var(--ok); }

    /* Feeling / Elbow bar */
    .factors-card {
      background: var(--bg2); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 10px 12px; margin-bottom: 11px;
    }
    .factors-summary {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      font-size: 13px; cursor: pointer;
    }
    .factors-body { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); }
    .factor-block { margin-bottom: 10px; }
    .factor-block:last-child { margin-bottom: 0; }
    .factor-lbl { font-size: 12.5px; color: var(--muted); margin-bottom: 5px; font-weight: 600; }

    .seg {
      display: inline-flex; background: var(--card); border: 1px solid var(--border);
      border-radius: 10px; padding: 2px; gap: 2px;
    }
    .seg-full { display: grid; width: 100%; }
    .seg button {
      padding: 7px 8px; border-radius: 8px; font-size: 12.5px; font-weight: 700; color: var(--muted);
    }
    .seg button.active { background: var(--accent-dark); color: #fff; }
    .seg button.active-warn { background: #b45309; color: #fff; }
    .seg button.active-danger { background: #be123c; color: #fff; }

    /* Exercise Cards */
    .ex-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); margin-bottom: 10px; overflow: hidden;
    }
    .ex-card.ex-done { border-color: rgba(34, 197, 94, 0.5); }
    .ex-head {
      padding: 12px 13px; display: flex; align-items: flex-start; gap: 10px; cursor: pointer;
    }
    .ex-num {
      width: 28px; height: 28px; border-radius: 8px; flex-shrink: 0;
      background: var(--card2); border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 13px; color: var(--accent); margin-top: 1px;
    }
    .ex-card.ex-done .ex-num { background: rgba(34, 197, 94, 0.2); border-color: var(--ok); color: var(--ok); }
    .ex-meta { flex: 1; min-width: 0; }
    .ex-name { font-weight: 700; font-size: 15px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .ex-sub { font-size: 12px; color: var(--muted); margin-top: 3px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .ex-preview {
      margin-top: 7px; font-size: 13.5px; font-weight: 700; color: #e2e8f0;
      background: rgba(11, 17, 32, 0.55); border-radius: 9px; padding: 6px 9px;
      font-variant-numeric: tabular-nums;
    }
    .ex-chev { color: var(--muted); font-size: 14px; padding: 4px; }

    .ex-body {
      padding: 0 12px 13px;
      border-top: 1px solid var(--border);
      background: rgba(11, 17, 32, 0.25);
    }

    /* Hand tabs inside exercise */
    .hand-tabs {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
      margin: 11px 0 9px;
    }
    .hand-btn {
      padding: 9px 10px; border-radius: 10px; font-weight: 700; font-size: 13.5px;
      background: var(--card2); border: 1px solid var(--border); color: var(--muted);
      display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .hand-btn.active {
      background: rgba(56, 189, 248, 0.18); border-color: var(--accent); color: #fff;
    }

    /* Clean single-line mode strip */
    .mode-strip {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      padding: 7px 10px; margin: 8px 0;
      background: rgba(56, 189, 248, 0.08);
      border: 1px solid rgba(56, 189, 248, 0.2);
      border-radius: 10px; font-size: 12.5px;
    }
    .mode-strip.heavy { background: rgba(245, 158, 11, 0.1); border-color: rgba(245, 158, 11, 0.28); }
    .mode-strip.safe { background: rgba(16, 185, 129, 0.1); border-color: rgba(16, 185, 129, 0.28); }
    .mode-base-btn {
      font-size: 12px; font-weight: 700; color: var(--accent);
      background: rgba(56, 189, 248, 0.12); padding: 3px 8px; border-radius: 7px;
      white-space: nowrap;
    }

    .warn-box {
      font-size: 12.5px; color: #fecdd3;
      background: var(--danger-bg);
      border: 1px solid rgba(244, 63, 94, 0.35);
      border-radius: 10px; padding: 8px 10px; margin: 8px 0;
    }
    .tip-box {
      font-size: 12.5px; color: #bae6fd;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 10px; padding: 7px 10px; margin: 8px 0;
    }
    .calib-box {
      background: rgba(245, 158, 11, 0.1);
      border: 1px solid rgba(245, 158, 11, 0.35);
      border-radius: 11px; padding: 10px; margin: 9px 0;
    }
    .calib-row { display: flex; gap: 7px; margin-top: 8px; align-items: center; }

    /* Set rows - big, crisp, scannable in gym */
    .set-head {
      display: grid; grid-template-columns: 20px minmax(76px, 1fr) 114px 56px 40px;
      gap: 6px; font-size: 11px; color: var(--muted);
      padding: 4px 2px; text-align: center;
    }
    .set-head div:nth-child(2) { text-align: left; }
    .set-row {
      display: grid; grid-template-columns: 20px minmax(76px, 1fr) 114px 56px 40px;
      gap: 6px; align-items: center;
      padding: 7px 2px; border-bottom: 1px solid rgba(38, 54, 89, 0.5);
    }
    .set-row:last-of-type { border-bottom: none; }
    .set-row.done { background: rgba(34, 197, 94, 0.1); border-radius: 10px; padding-left: 4px; padding-right: 4px; }
    .set-idx { font-weight: 800; font-size: 13px; color: var(--muted); text-align: center; }
    .set-target { line-height: 1.2; min-width: 0; }
    .set-target strong { display: block; font-size: 14px; font-weight: 800; color: #f8fafc; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .set-target small { display: block; color: var(--muted); font-size: 11px; margin-top: 2px; white-space: nowrap; }

    .w-ctrl {
      display: flex; align-items: center; gap: 2px;
      background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 2px;
    }
    .w-ctrl button {
      width: 30px; height: 34px; border-radius: 8px; background: var(--card2);
      font-weight: 800; font-size: 17px; flex-shrink: 0;
    }
    .w-ctrl input {
      width: 100%; min-width: 0; background: transparent; border: none; color: var(--text);
      text-align: center; font-weight: 800; font-size: 14px; padding: 2px 0;
      font-variant-numeric: tabular-nums;
    }
    .inp {
      width: 100%; background: var(--bg); border: 1px solid var(--border);
      border-radius: 10px; color: var(--text); padding: 8px 6px;
      font-size: 14px; font-weight: 700; text-align: center;
      font-variant-numeric: tabular-nums;
    }
    .inp-text { text-align: left; font-weight: 500; padding: 9px 10px; }
    .inp:focus, .w-ctrl input:focus, select:focus, textarea:focus {
      outline: none; border-color: var(--accent);
    }
    select, textarea {
      width: 100%; background: var(--bg); border: 1px solid var(--border);
      border-radius: 10px; color: var(--text); padding: 9px 10px;
      font-family: inherit; font-size: 13.5px;
    }

    .check-btn {
      width: 40px; height: 40px; border-radius: 11px;
      background: var(--card2); border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; font-weight: 900; color: var(--muted);
    }
    .check-btn.done { background: var(--ok); border-color: var(--ok); color: #052e16; }

    .effort-row {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px;
      margin: 7px 0 9px;
    }
    .eff-btn {
      padding: 9px 4px; border-radius: 10px; font-size: 12.5px; font-weight: 700;
      background: var(--card2); border: 1px solid var(--border); color: var(--muted);
      text-align: center;
    }
    .eff-btn.active[data-eff="easy"] { background: rgba(16,185,129,0.2); border-color: #10b981; color: #34d399; }
    .eff-btn.active[data-eff="ok"] { background: rgba(56,189,248,0.2); border-color: #38bdf8; color: #7dd3fc; }
    .eff-btn.active[data-eff="hard"] { background: rgba(245,158,11,0.2); border-color: #f59e0b; color: #fbbf24; }
    .eff-btn.active[data-eff="fail"] { background: rgba(244,63,94,0.2); border-color: #f43f5e; color: #fb7185; }

    /* Plan timeline */
    .week-strip {
      display: flex; gap: 7px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 10px;
      scrollbar-width: none;
    }
    .week-strip::-webkit-scrollbar { display: none; }
    .wk-pill {
      flex-shrink: 0; min-width: 78px;
      background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; padding: 8px 10px; text-align: center;
    }
    .wk-pill.active { border-color: var(--accent); background: rgba(56,189,248,0.16); }
    .wk-pill-n { font-weight: 800; font-size: 13px; }
    .wk-pill-t { font-size: 11px; font-weight: 700; margin-top: 2px; }
    .wk-pill-t.heavy { color: var(--heavy); }
    .wk-pill-t.light { color: var(--light); }

    /* Stats & Charts */
    .stat-grid {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 11px;
    }
    .stat-box {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; padding: 10px 8px; text-align: center;
    }
    .stat-val { font-weight: 900; font-size: 18px; color: var(--accent); }
    .stat-lbl { font-size: 11px; color: var(--muted); margin-top: 2px; }

    .chart-wrap {
      background: var(--bg2); border: 1px solid var(--border);
      border-radius: 12px; padding: 10px; margin-top: 10px;
    }

    /* Equipment pills */
    .pill-wrap { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
    .w-pill {
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--card2); border: 1px solid var(--border);
      border-radius: 999px; padding: 5px 10px; font-weight: 700; font-size: 13px;
    }
    .w-pill button { color: var(--muted); font-size: 14px; font-weight: 800; padding: 0 2px; }

    .hist-item {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; padding: 11px 12px; margin-bottom: 8px;
    }
    .hist-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
    .hist-sets {
      margin-top: 6px; font-size: 13px; font-weight: 600; color: #e2e8f0;
      font-variant-numeric: tabular-nums;
    }

    /* Floating Rest Timer */
    .timer-bar {
      position: fixed; left: 50%; transform: translateX(-50%);
      bottom: calc(68px + var(--safe-bottom));
      width: calc(100% - 20px); max-width: 500px; z-index: 40;
      background: #0f1b33; border: 1px solid var(--accent);
      border-radius: 14px; padding: 9px 12px;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.55);
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
    }
    .timer-time { font-size: 24px; font-weight: 900; font-variant-numeric: tabular-nums; color: var(--accent); min-width: 72px; }
    .timer-time.done { color: var(--ok); }
    .timer-lbl { font-size: 12px; color: var(--muted); }
    .timer-prog {
      position: absolute; left: 10px; right: 10px; bottom: 0; height: 3px;
      background: rgba(56,189,248,0.18); border-radius: 3px; overflow: hidden;
    }
    .timer-prog-in { height: 100%; background: var(--accent); transition: width 0.3s linear; }

    /* Bottom Navigation */
    .nav {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 50;
      background: rgba(11, 17, 32, 0.96);
      backdrop-filter: blur(14px);
      border-top: 1px solid var(--border);
      padding: 6px 8px calc(6px + var(--safe-bottom));
    }
    .nav-inner {
      max-width: 520px; margin: 0 auto;
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px;
    }
    .nav-btn {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 6px 4px; border-radius: 11px; color: var(--muted); font-size: 11px; font-weight: 700;
      min-height: 50px; gap: 3px;
    }
    .nav-btn .ico { font-size: 19px; line-height: 1; }
    .nav-btn.active { color: var(--accent); background: rgba(56, 189, 248, 0.12); }

    /* Toast */
    .toast {
      position: fixed; top: 64px; left: 50%; transform: translateX(-50%);
      z-index: 99; background: rgba(15, 23, 42, 0.96); border: 1px solid var(--accent);
      color: #fff; padding: 8px 15px; border-radius: 999px;
      font-size: 13px; font-weight: 700; box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      opacity: 0; pointer-events: none; transition: opacity 0.2s ease;
      max-width: 88vw; text-align: center;
    }
    .toast.show { opacity: 1; }

    .muted { color: var(--muted); }
    .small { font-size: 12px; }
    .row { display: flex; align-items: center; gap: 8px; }
    .row-between { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .mt-8 { margin-top: 8px; }
    .mt-12 { margin-top: 12px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  </style>
</head>
<body>
  <div id="app" class="app"></div>
  <div id="toast" class="toast"></div>

  <script>
  (function() {
    'use strict';

    // ==================== DEFAULT DATA (ZOLOEV 3.0 + ZHEKA'S GYM) ====================
    const STORAGE_KEY = 'armplan_zheka_state_v1';
    const IDB_NAME = 'ArmPlanZhekaDB';
    const IDB_STORE = 'kv';
    const APP_STATE_VERSION = 2;

    const PERIODS = {
      prep:  { name: 'Подготовка',    mult: 0.90 },
      main:  { name: 'Основной',      mult: 1.00 },
      comp:  { name: 'Перед стартом', mult: 1.03 },
      trans: { name: 'Отдых',         mult: 0.80 }
    };

    const DAY_INFO = {
      1: { title: 'День 1', short: 'Жим · Крюк',     full: 'Жим, бицепс и крюк' },
      2: { title: 'День 2', short: 'Натяжка · Угол', full: 'Турник, натяжка и угол' },
      3: { title: 'День 3', short: 'Кисть · Пальцы', full: 'Кисть и пальцы' },
      4: { title: 'День 4', short: 'Спина · Прон.',  full: 'Спина и пронация' }
    };

    const DELOAD_MODES = {
      working: 'Рабочая (10-10-8-8)',
      light:   'Бережная (50–60%)',
      every4:  '3 тяжёлые + 1 лёгкая'
    };

    const DEFAULT_EQUIPMENT = {
      dumbbells: {
        id: 'dumbbells',
        name: 'Гантели',
        mode: 'list',
        weights: [10, 12.5, 15, 16, 20, 22.5],
        note: 'Гантели в зале'
      },
      barbell20: {
        id: 'barbell20',
        name: 'Штанга (20 кг)',
        mode: 'step',
        min: 20,
        step: 1.25,
        note: 'Гриф 20 кг, шаг 1.25 кг'
      },
      barbell8: {
        id: 'barbell8',
        name: 'Кривой гриф (8 кг)',
        mode: 'step',

    const DEFAULT_EX_MAP = Object.fromEntries(DEFAULT_EXERCISES.map(e => [e.id, e]));

    function defaultState() {
      return {
        version: APP_STATE_VERSION,
        updatedAt: Date.now(),
        settings: {
          bodyweight: 75,
          period: 'main',

          energy: 'normal',
          autoTimer: true
        },

    // ==================== PERSISTENCE (localStorage + IndexedDB) ====================
    function idbOpen() {
      return new Promise((resolve) => {
        if (!('indexedDB' in window)) return resolve(null);
        const req = indexedDB.open(IDB_NAME, 1);
        req.onupgradeneeded = () => {
          const db = req.result;
          if (!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE);
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => resolve(null);
      });
    }

    async function idbGet(key) {
      try {
        const db = await idbOpen();
        if (!db) return null;
        return await new Promise((resolve) => {
          const tx = db.transaction(IDB_STORE, 'readonly');
          const req = tx.objectStore(IDB_STORE).get(key);
          req.onsuccess = () => resolve(req.result || null);
          req.onerror = () => resolve(null);
        });
      } catch { return null; }
    }

    async function idbSet(key, val) {
      try {
        const db = await idbOpen();
        if (!db) return;
        await new Promise((resolve) => {
          const tx = db.transaction(IDB_STORE, 'readwrite');
          tx.objectStore(IDB_STORE).put(val, key);
          tx.oncomplete = () => resolve();
          tx.onerror = () => resolve();
        });
      } catch {}
    }

    function mergeWithDefaults(raw) {
      const def = defaultState();
      if (!raw || typeof raw !== 'object') return def;
      const oldVer = Number(raw.version) || 1;
      const merged = {
        version: APP_STATE_VERSION,
        updatedAt: raw.updatedAt || Date.now(),
        settings: Object.assign({}, def.settings, raw.settings || {}),
        equipment: Object.assign({}, def.equipment, raw.equipment || {}),
        exercises: Array.isArray(raw.exercises) && raw.exercises.length ? raw.exercises : def.exercises,
        history: Array.isArray(raw.history) ? raw.history : [],
        drafts: raw.drafts && typeof raw.drafts === 'object' ? raw.drafts : {}
      };
      if (!merged.settings.elbowPain || typeof merged.settings.elbowPain !== 'object') {
        merged.settings.elbowPain = { R: 0, L: 0 };
      }

      // Smooth migration v1 -> v2 (preserves all baseline1RM, history, custom equipment & exercises!)
      const pronIds = new Set(['d4_pron_classic', 'd4_pron_thumb', 'd4_pron_low']);
      merged.exercises = merged.exercises.map(ex => {
        const ref = DEFAULT_EX_MAP[ex.id];
        const copy = Object.assign({}, ex);
        if (!copy.deloadMode) {
          copy.deloadMode = ref ? ref.deloadMode : 'working';
        }
        if (oldVer < 2 && pronIds.has(copy.id)) {
          copy.elbowRisk = false;
        }
        return copy;
      });

      // On v1 -> v2 upgrade, clear untouched drafts so updated deload weights appear immediately
      if (oldVer < 2) {
        for (const k of Object.keys(merged.drafts)) {
          const d = merged.drafts[k];
          if (!d || !d.sets || !d.sets.some(s => s.done)) {
            delete merged.drafts[k];
          }
        }
      }

      return merged;
    }

    let state = defaultState();

    function saveState() {
      state.updatedAt = Date.now();
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch {}
      idbSet(STORAGE_KEY, state);
    }

    async function loadState() {
      let lsData = null;
      try {
        const s = localStorage.getItem(STORAGE_KEY);
        if (s) lsData = JSON.parse(s);
      } catch {}
      const idbData = await idbGet(STORAGE_KEY);
      let chosen = null;
      if (lsData && idbData) {
        chosen = (idbData.updatedAt || 0) > (lsData.updatedAt || 0) ? idbData : lsData;
      } else {
        chosen = lsData || idbData;
      }
      state = mergeWithDefaults(chosen);
      saveState();
    }

    // ==================== MATH & EQUIPMENT SNAPPING ====================
    function round2(n) { return Math.round(n * 100) / 100; }
    function fmtKg(n) {
      if (n === null || n === undefined || isNaN(n)) return '—';
      const r = round2(Number(n));
      return Number.isInteger(r) ? String(r) : String(r);
    }
    function esc(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function getEquip(equipId) {
      return state.equipment[equipId] || state.equipment.plates;
    }

    function getSortedList(equip) {
      return [...new Set((equip.weights || [10]).map(Number).filter(x => !isNaN(x) && x >= 0))].sort((a, b) => a - b);
    }

    function snapWeight(targetKg, equip) {
      if (!equip || equip.mode === 'table') return { weight: 0, clampedMin: false, atMax: false };
      if (equip.mode === 'list') {
        const list = getSortedList(equip);
        if (!list.length) return { weight: round2(Math.max(0, targetKg)), clampedMin: false, atMax: false };
        if (targetKg <= list[0]) {
          return { weight: list[0], clampedMin: targetKg < list[0] * 0.88, atMax: false };
        }
        if (targetKg >= list[list.length - 1]) {
          return { weight: list[list.length - 1], clampedMin: false, atMax: targetKg > list[list.length - 1] * 1.05 };
        }
        let best = list[0], bestDiff = Math.abs(targetKg - list[0]);
        for (const w of list) {
          const d = Math.abs(targetKg - w);
          if (d < bestDiff) { best = w; bestDiff = d; }
        }
        return { weight: best, clampedMin: false, atMax: false };
      }
      const min = Number(equip.min) || 0;
      const step = Math.max(0.25, Number(equip.step) || 1.25);
      if (targetKg <= min) {
        return { weight: round2(min), clampedMin: min > 0 && targetKg < min * 0.88, atMax: false };
      }
      const k = Math.round((targetKg - min) / step);
      return { weight: round2(min + Math.max(0, k) * step), clampedMin: false, atMax: false };
    }

    function stepWeightBy(currentKg, dir, equip) {
      const cur = Number(currentKg) || 0;
      if (!equip || equip.mode === 'table') return cur;
      if (equip.mode === 'list') {
        const list = getSortedList(equip);
        if (!list.length) return Math.max(0, round2(cur + dir * 2.5));
        if (dir > 0) {
          const next = list.find(w => w > cur + 0.01);
          return next !== undefined ? next : list[list.length - 1];
        } else {
          for (let i = list.length - 1; i >= 0; i--) {
            if (list[i] < cur - 0.01) return list[i];
          }
          return list[0];
        }
      }
      const min = Number(equip.min) || 0;
      const step = Math.max(0.25, Number(equip.step) || 1.25);
      if (dir > 0) {
        const snapped = snapWeight(cur, equip).weight;
        return round2(snapped > cur + 0.01 ? snapped : snapped + step);
      } else {
        const snapped = snapWeight(cur, equip).weight;
        const cand = snapped < cur - 0.01 ? snapped : snapped - step;
        return round2(Math.max(min, cand));
      }
    }

    function epley1RM(weight, reps) {
      const w = Number(weight) || 0;
      const r = Math.max(1, Number(reps) || 1);
      if (w <= 0) return 0;
      if (r === 1) return w;
      return round2(w * (1 + r / 30));
    }

    function getWeekType(weekNum, startType) {
      const isOdd = ((weekNum - 1) % 2) === 0;
      if (startType === 'light') return isOdd ? 'light' : 'heavy';
      return isOdd ? 'heavy' : 'light';
    }

    function getEffectiveWeekType(ex, weekNum) {
      const mode = ex.deloadMode || 'working';
      if (mode === 'every4') {
        // 3 heavy weeks in a row, 4th week is deload
        return ((weekNum - 1) % 4) === 3 ? 'light' : 'heavy';
      }
      return getWeekType(weekNum, state.settings.startWeekType);
    }

    function getElbowPainFor(ex, hand, painObj) {
      if (!ex.elbowRisk) return 0;
      const p = painObj || { R: 0, L: 0 };
      if (hand === 'R') return Number(p.R) || 0;
      if (hand === 'L') return Number(p.L) || 0;
      return Math.max(Number(p.R) || 0, Number(p.L) || 0);
    }

    function getElbowFactor(pain) {
      if (pain >= 7) return { mult: 0.50, level: 'stop', msg: 'Локоть сильно болит — лучше пропустить или только лёгкая резина.' };
      if (pain >= 4) return { mult: 0.75, level: 'warn', msg: 'Локоть болит — скинул вес на 25%. Работай строго без боли.' };
      if (pain === 3) return { mult: 0.90, level: 'caution', msg: 'Локоть ноет — скинул 10%, без рывков.' };
      return { mult: 1.00, level: 'ok', msg: '' };
    }

    function painWord(p) {
      const v = Number(p) || 0;
      if (v >= 7) return 'сильно';
      if (v >= 4) return 'болит';
      if (v === 3) return 'ноет';
      return 'норм';
    }

    function getHistoryFor(exerciseId, hand) {
      return state.history
        .filter(h => h.exerciseId === exerciseId && h.hand === hand)
        .sort((a, b) => (b.ts || 0) - (a.ts || 0));
    }

    function clearUntouchedDraftsFor(exId) {
      for (const k of Object.keys(state.drafts)) {
        if (!exId || k.includes(`_${exId}_`)) {
          const d = state.drafts[k];
          if (!d || !d.sets || !d.sets.some(s => s.done)) delete state.drafts[k];
        }
      }
    }

    // ==================== CORE AUTO-PLAN ENGINE ====================
    function computePlan(ex, hand, targetWeek, opts) {
      const options = opts || {};
      const deloadMode = ex.deloadMode || 'working';
      const weekType = getEffectiveWeekType(ex, targetWeek);
      const equip = getEquip(ex.equipId);
      const period = PERIODS[state.settings.period] || PERIODS.main;
      const painObj = options.ignorePain ? { R: 0, L: 0 } : state.settings.elbowPain;
      const pain = getElbowPainFor(ex, hand, painObj);
      const elbow = getElbowFactor(pain);
      const energyMult = (!options.isForecast && state.settings.energy === 'low') ? 0.92 : 1.0;

      // Count heavy weeks ahead for THIS exercise
      let heavyAhead = 0;
      if (targetWeek > state.settings.currentWeek) {
        for (let w = state.settings.currentWeek + 1; w <= targetWeek; w++) {
          if (getEffectiveWeekType(ex, w) === 'heavy') heavyAhead++;
        }
      }

      // 1. TABLE WORK
      if (ex.type === 'table') {
        const isSafe = pain >= 3;
        let recIntensity = weekType === 'heavy' ? 80 : 55;
        let recText = weekType === 'heavy'
          ? 'Спарринг 75–90%, 20–30 мин'
          : 'Техника и резина 50–60%, 15–20 мин';
        if (isSafe) {
          recIntensity = pain >= 7 ? 0 : 50;
          recText = pain >= 7
            ? 'Пропустить стол, пока болит локоть'
            : 'Только техника / резина до 50% без боли';
        }
        return {
          type: 'table', weekType, deloadMode, elbow, pain,
          intensity: recIntensity,
          duration: weekType === 'heavy' ? 25 : 15,
          mode: (weekType === 'light' || isSafe) ? 'Резина / техника' : 'Спарринг',
          modeLabel: weekType === 'heavy' ? '🔥 Спарринг' : '🌿 Техника / резина',
          reason: recText
        };
      }

      // 2. STATIC HOLD (Fingers plate hold)
      if (ex.type === 'static') {
        const recs = getHistoryFor(ex.id, hand);
        const last = recs[0];
        let baseWeight = (ex.baseline1RM && ex.baseline1RM[hand]) ? Number(ex.baseline1RM[hand]) : null;
        let progTag = '';
        if (last && last.sets && last.sets.length) {
          const bestW = Math.max(...last.sets.map(s => Number(s.weight) || 0));
          if (bestW > 0) {
            const wasSoft = last.weekType === 'light' && (last.deloadMode === 'light' || !last.deloadMode);
            baseWeight = wasSoft ? bestW / 0.72 : (last.weekType === 'light' ? bestW / 0.85 : bestW);
            if (last.weekType === 'heavy' && targetWeek > last.week) {
              if (last.effort === 'easy' || last.effort === 'ok') {
                baseWeight = stepWeightBy(baseWeight, +1, equip);
                progTag = '+шаг';
              } else if (last.effort === 'fail') {
                baseWeight = stepWeightBy(baseWeight, -1, equip);
                progTag = '−шаг';
              }
            }
          }
        }
        if (baseWeight === null) {
          return { type: 'static', weekType, deloadMode, elbow, pain, needsCalibration: true, sets: [], modeLabel: 'Удержание' };
        }
        const lightMult = deloadMode === 'light' ? 0.70 : 0.85;
        let targetW = baseWeight * (weekType === 'heavy' ? 1.0 : lightMult) * period.mult * elbow.mult * energyMult;
        if (heavyAhead > 0) targetW *= Math.pow(1.03, heavyAhead);
        const snapped = snapWeight(targetW, equip);
        const secTarget = weekType === 'heavy' ? 15 : (deloadMode === 'light' ? 30 : 20);
        const sets = [1, 2, 3, 4].map((n, idx) => ({
          setNum: n,
          weight: idx === 0 && weekType === 'heavy' ? snapWeight(snapped.weight * 0.75, equip).weight : snapped.weight,
          reps: 1,
          sec: idx === 0 && weekType === 'heavy' ? 20 : secTarget,
          restSec: weekType === 'heavy' ? 150 : 90
        }));
        return {
          type: 'static', weekType, deloadMode, elbow, pain, needsCalibration: false,
          base1RM: round2(baseWeight),
          sets, progTag,
          modeLabel: weekType === 'heavy' ? '🔥 Тяжёлая · 15–20 с' : (deloadMode === 'light' ? '🌿 Бережная · 30 с' : '🌿 Рабочая · 20 с')
        };
      }

      // 3. WEIGHTED & BODYWEIGHT (PYRAMID)
      const isBW = ex.type === 'bodyweight';
      const bw = Number(state.settings.bodyweight) || 75;
      const recs = getHistoryFor(ex.id, hand);
      const lastHeavy = recs.find(r => r.weekType === 'heavy');
      const lastAny = recs[0];

      let base1RM = null;
      let progTag = '';
      let repBoost = 0;
      let doubleProgNote = '';

      if (lastHeavy && lastHeavy.e1rm > 0) {
        const savedElbowMult = lastHeavy.elbowMult || getElbowFactor(lastHeavy.elbowPain || 0).mult;
        const normalized1RM = savedElbowMult < 1 ? round2(Number(lastHeavy.e1rm) / savedElbowMult) : Number(lastHeavy.e1rm);
        const prevHealthy = recs.find(r => r.weekType === 'heavy' && (!r.elbowPain || r.elbowPain < 3) && r.e1rm > 0);
        const baselineVal = (ex.baseline1RM && ex.baseline1RM[hand] > 0) ? Number(ex.baseline1RM[hand]) : 0;
        base1RM = (lastHeavy.elbowPain >= 3)
          ? Math.max(normalized1RM, prevHealthy ? Number(prevHealthy.e1rm) : 0, baselineVal)
          : normalized1RM;

        const isLaterWeek = targetWeek > lastHeavy.week;
        const lastPeakSet = lastHeavy.sets && lastHeavy.sets.length ? lastHeavy.sets[lastHeavy.sets.length - 1] : null;
        const lastPeakW = lastPeakSet ? Number(lastPeakSet.weight) || 0 : 0;
        const nextW = stepWeightBy(lastPeakW, +1, equip);
        const jumpRatio = lastPeakW > 0 ? (nextW - lastPeakW) / lastPeakW : 0;

        if (isLaterWeek) {
          if (lastHeavy.effort === 'easy') {
            if (isBW) {
              base1RM += Math.max(1.25, equip.step || 1.25);
            } else if (nextW > lastPeakW) {
              base1RM *= Math.max(1.03, Math.min(1.10, nextW / Math.max(1, lastPeakW)));
            } else {
              repBoost = 2;
              doubleProgNote = 'Макс. гантель в списке — делаем +2 повтора (или добавь новый вес в «Зал»).';
            }
            progTag = '+шаг';
          } else if (lastHeavy.effort === 'ok') {
            if (!isBW && jumpRatio > 0.12 && (!lastHeavy.elbowPain || lastHeavy.elbowPain < 3)) {
              const targetPeakReps = state.settings.heavyScheme === '8-6-6-4-2' ? 2 : 3;
              const donePeakReps = lastPeakSet ? Number(lastPeakSet.reps) || 0 : 0;
              if (donePeakReps >= targetPeakReps + 2) {
                base1RM = epley1RM(nextW, targetPeakReps);
                progTag = `→ ${fmtKg(nextW)} кг`;
              } else {
                repBoost = 2;
                doubleProgNote = `До следующей гантели (${fmtKg(nextW)} кг) большой шаг — сначала +2 повтора, потом переход.`;
                progTag = '+2 повт';
              }
            } else {
              base1RM *= 1.025;
              progTag = '+шаг';
            }
          } else if (lastHeavy.effort === 'hard') {
            progTag = 'закрепляем';
          } else if (lastHeavy.effort === 'fail') {
            base1RM *= 0.94;
            progTag = '−6%';
          }
        }
      } else if (lastAny && lastAny.e1rm > 0) {
        const maxW = Math.max(...(lastAny.sets || []).map(s => Number(s.weight) || 0));
        if (isBW) {
          base1RM = Math.max(lastAny.e1rm, bw + maxW);
        } else if (lastAny.deloadMode === 'working') {
          base1RM = Math.max(lastAny.e1rm, maxW / 0.78);
        } else {
          base1RM = Math.max(lastAny.e1rm, maxW / 0.58);
        }
      } else if (ex.baseline1RM && ex.baseline1RM[hand] > 0) {
        base1RM = Number(ex.baseline1RM[hand]);
      }

      // Determine scheme & percentages
      let schemeReps, pcts, modeLabel, modeTone;
      if (weekType === 'heavy') {
        schemeReps = state.settings.heavyScheme === '8-6-6-4-2' ? [8, 6, 6, 4, 2] : [8, 6, 6, 3, 3];
        pcts = state.settings.heavyScheme === '8-6-6-4-2'
          ? [0.60, 0.72, 0.78, 0.86, 0.94]
          : [0.60, 0.72, 0.78, 0.87, 0.91];
        const cycleIdx = ((targetWeek - 1) % 4) + 1;
        modeLabel = deloadMode === 'every4'
          ? `🔥 Тяжёлая (${cycleIdx} из 3) · ${state.settings.heavyScheme}`
          : `🔥 Тяжёлая · ${state.settings.heavyScheme}`;
        modeTone = 'heavy';
      } else if (deloadMode === 'light') {
        // Protective side-pressure deload (50-60%, 5 sets)
        schemeReps = [10, 10, 10, 8, 8];
        pcts = [0.50, 0.52, 0.55, 0.58, 0.60];
        modeLabel = '🛡️ Бережём локоть · 50–60%';
        modeTone = 'safe';
      } else {
        // Zheka's working deload: 4 sets 10-10-8-8 with working middle weights (65-78%)
        schemeReps = [10, 10, 8, 8];
        pcts = [0.65, 0.70, 0.74, 0.78];
        modeLabel = deloadMode === 'every4'
          ? '🌿 Разгрузка (4-я нед.) · 10-10-8-8'
          : '🌿 Лёгкая · 10-10-8-8';
        modeTone = 'normal';
      }

      if (base1RM === null) {
        return {
          type: ex.type, weekType, deloadMode, elbow, pain, needsCalibration: true,
          schemeReps, modeLabel, modeTone,
          sets: schemeReps.map((r, i) => ({
            setNum: i + 1,
            weight: equip.mode === 'list' ? getSortedList(equip)[0] : (equip.min || 0),
            reps: r,
            restSec: weekType === 'light' ? 90 : (i < 2 ? 90 : i === 2 ? 150 : 210)
          }))
        };
      }

      let effective1RM = base1RM;
      if (heavyAhead > 0) {
        effective1RM = base1RM * Math.pow(1.025, heavyAhead);
      }

      const totalMult = period.mult * elbow.mult * energyMult;
      const adjusted1RM = effective1RM * totalMult;

      let clampedMinAny = false;
      let atMaxAny = false;

      const sets = schemeReps.map((baseReps, idx) => {
        const pct = pcts[idx];
        let rawKg = adjusted1RM * pct;
        if (isBW) rawKg = Math.max(0, rawKg - bw);
        const snapped = snapWeight(rawKg, equip);
        if (snapped.clampedMin) clampedMinAny = true;
        if (snapped.atMax) atMaxAny = true;

        let reps = baseReps;
        if (weekType === 'heavy' && repBoost > 0 && idx >= 3) {
          reps = baseReps + repBoost;
        }
        const restSec = weekType === 'light'
          ? (deloadMode === 'light' ? 90 : (idx >= 2 ? 120 : 90))
          : (idx < 2 ? 90 : idx === 2 ? 150 : 210);

        return {
          setNum: idx + 1,
          weight: snapped.weight,
          reps,
          restSec,
          clampedMin: snapped.clampedMin,
          atMax: snapped.atMax
        };
      });

      return {
        type: ex.type,
        weekType,
        deloadMode,
        elbow,
        pain,
        needsCalibration: false,
        base1RM: round2(effective1RM),
        sets,
        clampedMinAny,
        atMaxAny,
        doubleProgNote,
        progTag,
        modeLabel,
        modeTone
      };
    }

    // ==================== UI STATE ====================
    const ui = {
      tab: 'workout',
      selectedDay: 1,
      expandedExId: null,
      selectedHand: {},
      editBaseKey: null, // `${exId}_${hand}` when editing quick base inline
      factorsOpen: false,
      planWeek: 1,
      planDay: 1,
      planHand: 'R',
      planIgnorePain: false,
      progExId: 'd1_hook_mid',
      progHand: 'R',
      histFilter: 'all',
      gymSub: 'equip',
      timer: { active: false, remain: 0, total: 0, label: '', interval: null }
    };

    function showToast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(el._t);
      el._t = setTimeout(() => el.classList.remove('show'), 2200);
    }

    // ==================== REST TIMER ====================
    function beep() {
      try { if (window.AndroidBridge && window.AndroidBridge.vibrate) window.AndroidBridge.vibrate(); } catch {}
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine'; osc.frequency.value = 880;
        gain.gain.value = 0.15;
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start();
        setTimeout(() => { osc.stop(); ctx.close(); }, 280);
      } catch {}
      try { if (navigator.vibrate) navigator.vibrate([180, 90, 180]); } catch {}
    }

    function startTimer(seconds, label) {
      stopTimer();
      ui.timer.active = true;
      ui.timer.total = seconds;
      ui.timer.remain = seconds;
      ui.timer.label = label || 'Отдых';
      ui.timer.interval = setInterval(() => {
        ui.timer.remain--;
        if (ui.timer.remain <= 0) {
          ui.timer.remain = 0;
          clearInterval(ui.timer.interval);
          ui.timer.interval = null;
          beep();
          showToast('Отдых закончился — пора на подход!');
        }
        updateTimerDom();
      }, 1000);
      render();
    }

    function addTimer(sec) {
      if (!ui.timer.active) return;
      ui.timer.remain += sec;
      ui.timer.total = Math.max(ui.timer.total, ui.timer.remain);
      if (!ui.timer.interval && ui.timer.remain > 0) {
        ui.timer.interval = setInterval(() => {
          ui.timer.remain--;
          if (ui.timer.remain <= 0) {
            ui.timer.remain = 0;
            clearInterval(ui.timer.interval);
            ui.timer.interval = null;
            beep();
          }
          updateTimerDom();
        }, 1000);
      }
      updateTimerDom();
    }

    function stopTimer() {
      if (ui.timer.interval) clearInterval(ui.timer.interval);
      ui.timer.interval = null;
      ui.timer.active = false;
      ui.timer.remain = 0;
      const bar = document.getElementById('timer-bar');
      if (bar) bar.remove();
      const app = document.getElementById('app');
      if (app) app.classList.remove('has-timer');
    }

    function fmtTime(sec) {
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    function updateTimerDom() {
      const tEl = document.getElementById('timer-time-val');
      const pEl = document.getElementById('timer-prog-in');
      if (!tEl) return;
      tEl.textContent = ui.timer.remain > 0 ? fmtTime(ui.timer.remain) : 'ГОТОВО';
      tEl.className = 'timer-time' + (ui.timer.remain <= 0 ? ' done' : '');
      if (pEl && ui.timer.total > 0) {
        const pct = Math.max(0, Math.min(100, ((ui.timer.total - ui.timer.remain) / ui.timer.total) * 100));
        pEl.style.width = pct + '%';
      }
    }

    // ==================== DRAFTS & SAVING WORKOUTS ====================
    function draftKey(week, exId, hand) { return `w${week}_${exId}_${hand}`; }

    function getOrInitDraft(ex, hand, plan) {
      const k = draftKey(state.settings.currentWeek, ex.id, hand);
      if (state.drafts[k]) return state.drafts[k];
      if (ex.type === 'table') {
        state.drafts[k] = {
          intensity: plan.intensity,
          duration: plan.duration,
          mode: plan.mode,
          effort: 'ok',
          note: ''
        };
      } else {
        state.drafts[k] = {
          sets: (plan.sets || []).map(s => ({
            weight: s.weight,
            reps: s.reps,
            sec: s.sec || null,
            done: false
          })),
          effort: 'ok',
          note: ''
        };
      }
      return state.drafts[k];
    }

    function isExerciseDoneThisWeek(ex) {
      const wk = state.settings.currentWeek;
      if (ex.hands === 'both') {
        return state.history.some(h => h.week === wk && h.exerciseId === ex.id && h.hand === 'both');
      }
      return state.history.some(h => h.week === wk && h.exerciseId === ex.id && h.hand === 'R') &&
             state.history.some(h => h.week === wk && h.exerciseId === ex.id && h.hand === 'L');
    }

    function isHandDoneThisWeek(exId, hand) {
      return state.history.some(h => h.week === state.settings.currentWeek && h.exerciseId === exId && h.hand === hand);
    }

    function saveExerciseRecord(ex, hand) {
      const wk = state.settings.currentWeek;
      const effWeekType = getEffectiveWeekType(ex, wk);
      const plan = computePlan(ex, hand, wk);
      const draft = getOrInitDraft(ex, hand, plan);
      const equip = getEquip(ex.equipId);
      const today = new Date().toISOString().slice(0, 10);
      const pain = getElbowPainFor(ex, hand, state.settings.elbowPain);

      let e1rm = 0;
      let setsSnapshot = [];

      if (ex.type === 'table') {
        setsSnapshot = [{
          weight: Number(draft.intensity) || 0,
          reps: Number(draft.duration) || 0,
          mode: draft.mode || 'Спарринг',
          done: true
        }];
      } else {
        const doneSets = draft.sets.filter(s => s.done);
        const usedSets = doneSets.length ? doneSets : draft.sets;
        setsSnapshot = usedSets.map(s => ({
          weight: round2(Number(s.weight) || 0),
          reps: Math.max(0, parseInt(s.reps, 10) || 0),
          sec: s.sec ? parseInt(s.sec, 10) : null,
          done: true
        }));
        const bw = Number(state.settings.bodyweight) || 75;
        for (const s of setsSnapshot) {
          if (ex.type === 'static') {
            e1rm = Math.max(e1rm, s.weight);
          } else if (ex.type === 'bodyweight') {
            e1rm = Math.max(e1rm, epley1RM(bw + s.weight, Math.max(1, s.reps)));
          } else {
            e1rm = Math.max(e1rm, epley1RM(s.weight, Math.max(1, s.reps)));
          }
        }
      }

      state.history.push({
        id: 'rec_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
        date: today,
        ts: Date.now(),
        week: wk,
        weekType: effWeekType,
        deloadMode: ex.deloadMode || 'working',
        day: ex.day,
        exerciseId: ex.id,
        exerciseName: ex.name,
        equipId: ex.equipId,
        equipName: equip ? equip.name : '',
        hand,
        type: ex.type,
        sets: setsSnapshot,
        effort: draft.effort || 'ok',
        elbowPain: pain,
        elbowMult: getElbowFactor(pain).mult,
        e1rm: round2(e1rm),
        note: (draft.note || '').trim()
      });

      delete state.drafts[draftKey(wk, ex.id, hand)];
      saveState();

      const hLabel = hand === 'R' ? ' (П)' : hand === 'L' ? ' (Л)' : '';
      showToast(`Сохранено: ${ex.name}${hLabel}`);

      if (ex.hands === 'uni') {
        const other = hand === 'R' ? 'L' : 'R';
        if (!isHandDoneThisWeek(ex.id, other)) {
          ui.selectedHand[ex.id] = other;
        }
      }
      render();
    }

    function daysUntilComp() {
      if (!state.settings.compDate) return null;
      const target = new Date(state.settings.compDate + 'T00:00:00');
      const now = new Date();
      return Math.ceil((target - now) / (1000 * 60 * 60 * 24));
    }

    function effortLabel(e) {
      return { easy: 'Легко', ok: 'Норм', hard: 'Тяжело', fail: 'Не дожал' }[e] || 'Норм';
    }

    // ==================== RENDER FUNCTIONS ====================
    function renderTopbar() {
      const wk = state.settings.currentWeek;
      const wType = getWeekType(wk, state.settings.startWeekType);
      const daysLeft = daysUntilComp();
      return `
        <div class="topbar">
          <div class="topbar-row">
            <div class="brand">
              <div class="brand-logo">Z</div>
              <div>
                <div class="brand-title">ArmPlan</div>
                <div class="brand-sub">${daysLeft !== null && daysLeft >= 0 ? `До марта: ${daysLeft} дн.` : 'Программа Золоева'}</div>
              </div>
            </div>
            <span class="badge ${wType === 'heavy' ? 'badge-heavy' : 'badge-light'}">
              ${wType === 'heavy' ? '🔥 Тяжёлая' : '🌿 Лёгкая'} · Н${wk}
            </span>
          </div>
        </div>
      `;
    }

    function renderWorkoutTab() {
      const wk = state.settings.currentWeek;
      const wType = getWeekType(wk, state.settings.startWeekType);
      const dayEx = state.exercises.filter(e => e.day === ui.selectedDay).sort((a, b) => a.order - b.order);
      const pR = Number(state.settings.elbowPain.R) || 0;
      const pL = Number(state.settings.elbowPain.L) || 0;
      const maxPain = Math.max(pR, pL);

      const dayTabsHtml = [1, 2, 3, 4].map(d => {
        const list = state.exercises.filter(e => e.day === d);
        const doneCount = list.filter(isExerciseDoneThisWeek).length;
        const allDone = list.length > 0 && doneCount === list.length;
        return `
          <button class="day-tab ${ui.selectedDay === d ? 'active' : ''}" data-action="sel-day" data-day="${d}">
            <div class="day-tab-n">День ${d}</div>
            <div class="day-tab-sub">${DAY_INFO[d].short}</div>
            <div class="day-tab-prog ${allDone ? 'done' : ''}">${allDone ? '✅' : `${doneCount}/${list.length}`}</div>
          </button>
        `;
      }).join('');

      const elbowSummary = maxPain >= 3
        ? `Локоть: П ${painWord(pR)} / Л ${painWord(pL)}`
        : 'Локоть: норм';
      const energySummary = state.settings.energy === 'low' ? 'Устал (−8%)' : 'Силы: норм';

      const exHtml = dayEx.map((ex, idx) => renderExerciseCard(ex, idx + 1)).join('');

      return `
        <div class="container">
          <div class="week-bar">
            <button class="week-nav-btn" data-action="week-prev" ${wk <= 1 ? 'style="opacity:0.35"' : ''}>‹</button>
            <div class="week-info">
              <div class="week-num">
                Неделя ${wk}
                <span class="badge ${wType === 'heavy' ? 'badge-heavy' : 'badge-light'}">${wType === 'heavy' ? 'Тяжёлая' : 'Лёгкая'}</span>
              </div>
              <div class="week-desc">
                ${wType === 'heavy'
                  ? `Схема ${state.settings.heavyScheme} · отдых 2–4 мин`
                  : `10-10-8-8 · боковое 50–60% · жим 3+1`}
              </div>
            </div>
            <button class="week-nav-btn" data-action="week-next">›</button>
          </div>

          <div class="day-tabs">${dayTabsHtml}</div>

          <div class="factors-card">
            <div class="factors-summary" data-action="toggle-factors">
              <div><strong>${elbowSummary}</strong> · <span class="muted">${energySummary}</span></div>
              <span class="badge ${maxPain >= 4 ? 'badge-danger' : maxPain === 3 ? 'badge-heavy' : 'badge-muted'}">
                ${ui.factorsOpen ? 'Скрыть' : 'Локоть / силы'}
              </span>
            </div>
            ${ui.factorsOpen ? `
              <div class="factors-body">
                <div class="factor-block">
                  <div class="factor-lbl">Правый локоть</div>
                  <div class="seg seg-full" style="grid-template-columns:repeat(4,1fr);">
                    <button class="${pR <= 2 ? 'active' : ''}" data-action="pain-set" data-hand="R" data-val="0">Норм</button>
                    <button class="${pR === 3 ? 'active-warn' : ''}" data-action="pain-set" data-hand="R" data-val="3">Ноет</button>
                    <button class="${pR >= 4 && pR <= 6 ? 'active-danger' : ''}" data-action="pain-set" data-hand="R" data-val="5">Болит</button>
                    <button class="${pR >= 7 ? 'active-danger' : ''}" data-action="pain-set" data-hand="R" data-val="8">Сильно</button>
                  </div>
                </div>
                <div class="factor-block">
                  <div class="factor-lbl">Левый локоть</div>
                  <div class="seg seg-full" style="grid-template-columns:repeat(4,1fr);">
                    <button class="${pL <= 2 ? 'active' : ''}" data-action="pain-set" data-hand="L" data-val="0">Норм</button>
                    <button class="${pL === 3 ? 'active-warn' : ''}" data-action="pain-set" data-hand="L" data-val="3">Ноет</button>
                    <button class="${pL >= 4 && pL <= 6 ? 'active-danger' : ''}" data-action="pain-set" data-hand="L" data-val="5">Болит</button>
                    <button class="${pL >= 7 ? 'active-danger' : ''}" data-action="pain-set" data-hand="L" data-val="8">Сильно</button>
                  </div>
                </div>
                <div class="factor-block">
                  <div class="factor-lbl">Самочувствие</div>
                  <div class="seg seg-full" style="grid-template-columns:1fr 1fr;">
                    <button class="${state.settings.energy !== 'low' ? 'active' : ''}" data-action="set-energy" data-val="normal">Нормально</button>
                    <button class="${state.settings.energy === 'low' ? 'active-warn' : ''}" data-action="set-energy" data-val="low">Устал (−8%)</button>
                  </div>
                </div>
                ${wType === 'heavy' ? `
                  <div class="factor-block">
                    <div class="factor-lbl">Схема тяжёлой</div>
                    <div class="seg seg-full" style="grid-template-columns:1fr 1fr;">
                      <button class="${state.settings.heavyScheme === '8-6-6-3-3' ? 'active' : ''}" data-action="set-scheme" data-val="8-6-6-3-3">8-6-6-3-3</button>
                      <button class="${state.settings.heavyScheme === '8-6-6-4-2' ? 'active' : ''}" data-action="set-scheme" data-val="8-6-6-4-2">8-6-6-4-2</button>
                    </div>
                  </div>
                ` : ''}
                <div class="small muted">Если локоть ноет — сам снижу вес в крюке, кисти и за столом. Пронацию не трогаю.</div>
              </div>
            ` : ''}
          </div>

          <div class="row-between" style="margin-bottom:8px; padding:0 2px;">
            <div style="font-weight:800; font-size:15px;">${DAY_INFO[ui.selectedDay].full}</div>
            <button class="btn btn-xs" data-action="open-plan-today">План вперёд →</button>
          </div>

          ${exHtml}

          <div class="card" style="text-align:center; background:var(--bg2);">
            <button class="btn btn-primary btn-block" data-action="week-next">
              Следующая неделя — Н${wk + 1} (${getWeekType(wk + 1, state.settings.startWeekType) === 'heavy' ? 'Тяжёлая 🔥' : 'Лёгкая 🌿'}) →
            </button>
          </div>
        </div>
      `;
    }

    function renderExerciseCard(ex, num) {
      const equip = getEquip(ex.equipId);
      const isOpen = ui.expandedExId === ex.id;
      const done = isExerciseDoneThisWeek(ex);
      const activeHand = ex.hands === 'both' ? 'both' : (ui.selectedHand[ex.id] || 'R');
      const plan = computePlan(ex, activeHand, state.settings.currentWeek);
      const globalWType = getWeekType(state.settings.currentWeek, state.settings.startWeekType);

      // Compact badge if this exercise runs a special mode on current week
      let modeBadge = '';
      if (ex.type !== 'table') {
        if (globalWType === 'light' && plan.weekType === 'heavy') {
          modeBadge = `<span class="badge badge-sm badge-heavy">🔥 тяжёлая</span>`;
        } else if (plan.weekType === 'light' && ex.deloadMode === 'light') {
          modeBadge = `<span class="badge badge-sm badge-light">50–60%</span>`;
        }
      }

      let previewHtml = '';
      if (ex.type === 'table') {
        previewHtml = `${esc(plan.mode)} · ${plan.intensity}% · ${plan.duration} мин`;
      } else if (plan.needsCalibration) {
        previewHtml = `<span style="color:var(--heavy);">Нажми и впиши рабочий вес →</span>`;
      } else if (ex.type === 'static') {
        previewHtml = plan.sets.map(s => `${fmtKg(s.weight)}×${s.sec}с`).join(' · ');
      } else {
        const prefix = ex.hands === 'uni' ? (activeHand === 'R' ? 'П: ' : 'Л: ') : '';
        const pfxPlus = ex.type === 'bodyweight' ? '+' : '';
        previewHtml = prefix + plan.sets.map(s => `${s.weight > 0 ? pfxPlus + fmtKg(s.weight) : (ex.type === 'bodyweight' ? 'СВ' : '0')}×${s.reps}`).join(' · ');
      }

      let bodyHtml = '';
      if (isOpen) {
        bodyHtml = renderExerciseBody(ex, activeHand, plan, equip);
      }

      return `
        <div class="ex-card ${done ? 'ex-done' : ''}">
          <div class="ex-head" data-action="toggle-ex" data-id="${ex.id}">
            <div class="ex-num">${done ? '✓' : num}</div>
            <div class="ex-meta">
              <div class="ex-name">
                ${esc(ex.name)}
                ${modeBadge}
                ${ex.elbowRisk && plan.pain >= 3 ? `<span class="badge badge-sm badge-danger">локоть</span>` : ''}
              </div>
              <div class="ex-sub">
                <span>${esc(equip.name)}</span>
                ${ex.hands === 'uni' ? `<span>· ${isHandDoneThisWeek(ex.id, 'R') ? 'П✅' : 'П○'} ${isHandDoneThisWeek(ex.id, 'L') ? 'Л✅' : 'Л○'}</span>` : ''}
              </div>
              ${!isOpen ? `<div class="ex-preview">${previewHtml}</div>` : ''}
            </div>
            <div class="ex-chev">${isOpen ? '▲' : '▼'}</div>
          </div>
          ${bodyHtml}
        </div>
      `;
    }

    function renderExerciseBody(ex, hand, plan, equip) {
      const draft = getOrInitDraft(ex, hand, plan);
      const handDone = isHandDoneThisWeek(ex.id, hand);
      const editKey = `${ex.id}_${hand}`;
      const showCalib = plan.needsCalibration || ui.editBaseKey === editKey;

      const handTabs = ex.hands === 'uni' ? `
        <div class="hand-tabs">
          <button class="hand-btn ${hand === 'R' ? 'active' : ''}" data-action="sel-hand" data-id="${ex.id}" data-hand="R">
            Правая ${isHandDoneThisWeek(ex.id, 'R') ? '✅' : ''}
          </button>
          <button class="hand-btn ${hand === 'L' ? 'active' : ''}" data-action="sel-hand" data-id="${ex.id}" data-hand="L">
            Левая ${isHandDoneThisWeek(ex.id, 'L') ? '✅' : ''}
          </button>
        </div>
      ` : '<div style="height:6px;"></div>';

      const elbowWarn = plan.elbow && plan.elbow.msg
        ? `<div class="warn-box">⚠️ ${esc(plan.elbow.msg)}</div>`
        : '';

      if (ex.type === 'table') {
        return `
          <div class="ex-body">
            ${handTabs}
            ${elbowWarn}
            <div class="mode-strip ${plan.weekType === 'heavy' ? 'heavy' : 'safe'}">
              <span>${esc(plan.reason)}</span>
            </div>
            <div class="grid-2 mt-8">
              <div>
                <div class="small muted" style="margin-bottom:4px;">Формат</div>
                <select data-action="draft-table" data-id="${ex.id}" data-hand="${hand}" data-field="mode">
                  <option ${draft.mode === 'Спарринг' ? 'selected' : ''}>Спарринг</option>
                  <option ${draft.mode === 'Резина / техника' ? 'selected' : ''}>Резина / техника</option>
                  <option ${draft.mode === 'Изометрия' ? 'selected' : ''}>Изометрия</option>
                </select>
              </div>
              <div>
                <div class="small muted" style="margin-bottom:4px;">Усилие (%)</div>
                <input class="inp" type="number" inputmode="numeric" value="${esc(draft.intensity)}" data-action="draft-table" data-id="${ex.id}" data-hand="${hand}" data-field="intensity" />
              </div>
            </div>
            <div class="mt-8">
              <div class="small muted" style="margin-bottom:4px;">Время (мин)</div>
              <input class="inp" type="number" inputmode="numeric" value="${esc(draft.duration)}" data-action="draft-table" data-id="${ex.id}" data-hand="${hand}" data-field="duration" />
            </div>
            <div class="mt-8">
              <input class="inp inp-text" placeholder="Заметка (необязательно)" value="${esc(draft.note || '')}" data-action="draft-note" data-id="${ex.id}" data-hand="${hand}" />
            </div>
            <button class="btn btn-ok btn-block mt-12" data-action="save-ex" data-id="${ex.id}" data-hand="${hand}">
              ✅ Сохранить${ex.hands === 'uni' ? (hand === 'R' ? ' (Правая)' : ' (Левая)') : ''}
            </button>
          </div>
        `;
      }

      const calibBox = showCalib ? `
        <div class="calib-box">
          <div class="row-between">
            <div style="font-weight:700; font-size:13.5px; color:var(--heavy);">Твой рабочий вес</div>
            ${!plan.needsCalibration ? `<button class="btn btn-xs" data-action="close-calib">✕</button>` : ''}
          </div>
          <div class="small muted" style="margin-top:2px;">
            ${ex.type === 'bodyweight' ? 'Вес на поясе (0 = свой вес) и повторы:' : (ex.type === 'static' ? 'Рабочий вес блинов (кг):' : 'Впиши плотный рабочий вес и повторы — распишу подходы:')}
          </div>
          <div class="calib-row">
            <input id="calib-w-${ex.id}-${hand}" class="inp" type="number" step="0.25" inputmode="decimal" placeholder="Кг" style="flex:1;" />
            ${ex.type !== 'static' ? `
              <span class="muted">×</span>
              <input id="calib-r-${ex.id}-${hand}" class="inp" type="number" inputmode="numeric" value="8" placeholder="повт" style="width:68px;" />
            ` : ''}
            <button class="btn btn-primary btn-sm" data-action="apply-calib" data-id="${ex.id}" data-hand="${hand}">Ок</button>
          </div>
        </div>
      ` : '';

      const modeStrip = !plan.needsCalibration ? `
        <div class="mode-strip ${plan.modeTone || ''}">
          <div>
            <strong>${esc(plan.modeLabel)}</strong>
            ${plan.progTag ? `<span class="badge badge-sm badge-accent" style="margin-left:5px;">${esc(plan.progTag)}</span>` : ''}
          </div>
          <button class="mode-base-btn" data-action="open-calib" data-key="${editKey}">
            макс ~${fmtKg(plan.base1RM)} кг ✎
          </button>
        </div>
      ` : '';

      const tips = [];
      if (plan.doubleProgNote) tips.push(plan.doubleProgNote);
      if (plan.atMaxAny) tips.push(`Дошли до макс. веса в «${equip.name}» — добавь новый вес в «Зал».`);
      const tipHtml = tips.length ? `<div class="tip-box">${tips.map(t => esc(t)).join('<br>')}</div>` : '';

      const isStatic = ex.type === 'static';
      const setRowsHtml = draft.sets.map((s, idx) => {
        const target = plan.sets[idx] || {};
        const targetStr = isStatic
          ? `${fmtKg(target.weight)} × ${target.sec || 15}с`
          : `${ex.type === 'bodyweight' && target.weight === 0 ? 'СВ' : (ex.type === 'bodyweight' ? '+' : '') + fmtKg(target.weight)} × ${target.reps}`;
        const subStr = `отдых ${fmtTime(target.restSec || 90)}`;

        return `
          <div class="set-row ${s.done ? 'done' : ''}">
            <div class="set-idx">${idx + 1}</div>
            <div class="set-target">
              <strong>${targetStr}</strong>
              <small>${subStr}</small>
            </div>
            <div class="w-ctrl">
              <button data-action="set-w-step" data-id="${ex.id}" data-hand="${hand}" data-idx="${idx}" data-dir="-1">−</button>
              <input type="number" step="0.25" inputmode="decimal" value="${fmtKg(s.weight)}"
                data-action="set-w-input" data-id="${ex.id}" data-hand="${hand}" data-idx="${idx}" />
              <button data-action="set-w-step" data-id="${ex.id}" data-hand="${hand}" data-idx="${idx}" data-dir="1">+</button>
            </div>
            <input class="inp" type="number" inputmode="numeric" value="${isStatic ? (s.sec || 15) : s.reps}"
              data-action="${isStatic ? 'set-sec-input' : 'set-r-input'}" data-id="${ex.id}" data-hand="${hand}" data-idx="${idx}" />
            <button class="check-btn ${s.done ? 'done' : ''}" data-action="set-done" data-id="${ex.id}" data-hand="${hand}" data-idx="${idx}" data-rest="${target.restSec || 90}">
              ✓
            </button>
          </div>
        `;
      }).join('');

      const lastRecs = getHistoryFor(ex.id, hand);
      const lastInfo = lastRecs[0]
        ? `<div class="small muted mt-8">Прошлый раз: ${lastRecs[0].sets.map(s => `${fmtKg(s.weight)}×${isStatic ? s.sec + 'с' : s.reps}`).join(' · ')} (${effortLabel(lastRecs[0].effort)})</div>`
        : '';

      return `
        <div class="ex-body">
          ${handTabs}
          ${elbowWarn}
          ${calibBox}
          ${modeStrip}
          ${tipHtml}

          <div class="set-head">
            <div>#</div>
            <div>План</div>
            <div>Вес (кг)</div>
            <div>${isStatic ? 'Сек' : 'Повт'}</div>
            <div>✓</div>
          </div>
          ${setRowsHtml}

          <div class="row-between mt-8">
            <button class="btn btn-xs" data-action="add-set" data-id="${ex.id}" data-hand="${hand}">+ Подход</button>
            <button class="btn btn-xs" data-action="reset-draft" data-id="${ex.id}" data-hand="${hand}">По плану</button>
          </div>

          <div class="small muted mt-12">Как зашло?</div>
          <div class="effort-row">
            ${['easy', 'ok', 'hard', 'fail'].map(ef => `
              <button class="eff-btn ${draft.effort === ef ? 'active' : ''}" data-eff="${ef}" data-action="set-effort" data-id="${ex.id}" data-hand="${hand}">
                ${effortLabel(ef)}
              </button>
            `).join('')}
          </div>

          <input class="inp inp-text" placeholder="Заметка (необязательно)" value="${esc(draft.note || '')}" data-action="draft-note" data-id="${ex.id}" data-hand="${hand}" />
          ${lastInfo}

          <button class="btn btn-ok btn-block mt-12" data-action="save-ex" data-id="${ex.id}" data-hand="${hand}">
            ${handDone ? '✅ Сохранить ещё раз' : `✅ Сохранить${ex.hands === 'uni' ? (hand === 'R' ? ' (Правая)' : ' (Левая)') : ''}`}
          </button>
        </div>
      `;
    }

    // ==================== PLAN TAB ====================
    function renderPlanTab() {
      const startW = Math.max(1, state.settings.currentWeek);
      const weeks = [];
      for (let w = startW; w < startW + 8; w++) weeks.push(w);
      if (ui.planWeek < startW) ui.planWeek = startW;

      const wType = getWeekType(ui.planWeek, state.settings.startWeekType);
      const dayEx = state.exercises.filter(e => e.day === ui.planDay).sort((a, b) => a.order - b.order);

      const stripHtml = weeks.map(w => {
        const wt = getWeekType(w, state.settings.startWeekType);
        return `
          <button class="wk-pill ${ui.planWeek === w ? 'active' : ''}" data-action="plan-week" data-week="${w}">
            <div class="wk-pill-n">Нед. ${w}</div>
            <div class="wk-pill-t ${wt}">${wt === 'heavy' ? '🔥 Тяж.' : '🌿 Лёгк.'}</div>
          </button>
        `;
      }).join('');

      const rowsHtml = dayEx.map((ex, i) => {
        const hand = ex.hands === 'both' ? 'both' : ui.planHand;
        const plan = computePlan(ex, hand, ui.planWeek, { isForecast: ui.planWeek > state.settings.currentWeek, ignorePain: ui.planIgnorePain });

        let tag = '';
        if (ex.type !== 'table') {
          if (wType === 'light' && plan.weekType === 'heavy') tag = `<span class="badge badge-sm badge-heavy">тяжёлая</span>`;
          else if (plan.weekType === 'light' && ex.deloadMode === 'light') tag = `<span class="badge badge-sm badge-light">50–60%</span>`;
        }

        let detail = '';
        if (ex.type === 'table') {
          detail = `<div class="small" style="color:#cbd5e1; margin-top:4px;">${esc(plan.mode)} · ${plan.intensity}% · ${plan.duration} мин</div>`;
        } else if (plan.needsCalibration) {
          detail = `<div class="small muted" style="margin-top:4px;">Вес ещё не задан</div>`;
        } else if (ex.type === 'static') {
          detail = `<div class="ex-preview">${plan.sets.map(s => `${fmtKg(s.weight)}×${s.sec}с`).join(' · ')}</div>`;
        } else {
          const pfx = ex.type === 'bodyweight' ? '+' : '';
          detail = `<div class="ex-preview">${plan.sets.map(s => `${s.weight === 0 && ex.type === 'bodyweight' ? 'СВ' : pfx + fmtKg(s.weight)}×${s.reps}`).join('  →  ')}</div>`;
        }

        return `
          <div class="card" style="padding:11px 12px; margin-bottom:8px;">
            <div class="row-between">
              <div style="font-weight:700; font-size:14px;">${i + 1}. ${esc(ex.name)}</div>
              ${tag}
            </div>
            ${detail}
            ${plan.doubleProgNote ? `<div class="small" style="color:var(--accent); margin-top:4px;">${esc(plan.doubleProgNote)}</div>` : ''}
            ${plan.elbow && plan.elbow.msg ? `<div class="small" style="color:var(--danger); margin-top:4px;">⚠️ ${esc(plan.elbow.msg)}</div>` : ''}
          </div>
        `;
      }).join('');

      return `
        <div class="container">
          <div class="row-between" style="margin-bottom:10px;">
            <div style="font-weight:800; font-size:16px;">План наперёд</div>
            <span class="badge ${wType === 'heavy' ? 'badge-heavy' : 'badge-light'}">${wType === 'heavy' ? '🔥 Тяжёлая' : '🌿 Лёгкая'} · Н${ui.planWeek}</span>
          </div>

          <div class="week-strip">${stripHtml}</div>

          <div class="day-tabs">
            ${[1, 2, 3, 4].map(d => `
              <button class="day-tab ${ui.planDay === d ? 'active' : ''}" data-action="plan-day" data-day="${d}">
                <div class="day-tab-n">День ${d}</div>
                <div class="day-tab-sub">${DAY_INFO[d].short}</div>
              </button>
            `).join('')}
          </div>

          <div class="row-between" style="margin-bottom:10px;">
            <div class="seg">
              <button class="${ui.planHand === 'R' ? 'active' : ''}" data-action="plan-hand" data-hand="R">Правая</button>
              <button class="${ui.planHand === 'L' ? 'active' : ''}" data-action="plan-hand" data-hand="L">Левая</button>
            </div>
            <button class="btn btn-xs ${ui.planIgnorePain ? 'btn-primary' : ''}" data-action="plan-toggle-pain">
              ${ui.planIgnorePain ? 'Без скидки на локоть' : 'С учётом локтя'}
            </button>
          </div>

          ${rowsHtml}

          ${ui.planWeek !== state.settings.currentWeek ? `
            <button class="btn btn-primary btn-block" data-action="jump-to-week" data-week="${ui.planWeek}">
              Перейти на Неделю ${ui.planWeek} →
            </button>
          ` : ''}
        </div>
      `;
    }

    // ==================== PROGRESS & HISTORY TAB ====================
    function renderProgressTab() {
      const totalSessions = state.history.length;
      const totalSets = state.history.reduce((a, h) => a + (h.sets ? h.sets.length : 0), 0);
      const uniqueDays = new Set(state.history.map(h => h.date)).size;

      const progEx = state.exercises.find(e => e.id === ui.progExId) || state.exercises[0];
      const activeHand = progEx.hands === 'both' ? 'both' : ui.progHand;
      const recs = getHistoryFor(progEx.id, activeHand).slice().reverse();

      let maxW = 0, max1RM = 0;
      for (const r of recs) {
        if (r.e1rm > max1RM) max1RM = r.e1rm;
        for (const s of (r.sets || [])) {
          if (Number(s.weight) > maxW) maxW = Number(s.weight);
        }
      }

      let chartHtml = '<div class="small muted" style="text-align:center; padding:18px 8px;">Сохрани первую тренировку — здесь появится график роста.</div>';
      if (recs.length >= 1 && progEx.type !== 'table') {
        const pts = recs.map((r, i) => ({
          x: i,
          y: r.e1rm || Math.max(...r.sets.map(s => Number(s.weight) || 0)),
          lbl: r.date.slice(5)
        }));
        const W = 320, H = 140, padL = 36, padR = 14, padT = 16, padB = 24;
        const ys = pts.map(p => p.y);
        const minY = Math.floor(Math.min(...ys) * 0.9);
        const maxY = Math.ceil(Math.max(...ys) * 1.08 + 0.5);
        const mapX = i => pts.length === 1 ? (padL + W - padR) / 2 : padL + (i / (pts.length - 1)) * (W - padL - padR);
        const mapY = y => H - padB - ((y - minY) / Math.max(1, maxY - minY)) * (H - padT - padB);

        const poly = pts.map((p, i) => `${mapX(i).toFixed(1)},${mapY(p.y).toFixed(1)}`).join(' ');
        const dots = pts.map((p, i) => `
          <circle cx="${mapX(i).toFixed(1)}" cy="${mapY(p.y).toFixed(1)}" r="4.5" fill="#38bdf8" stroke="#0b1120" stroke-width="2" />
          <text x="${mapX(i).toFixed(1)}" y="${(mapY(p.y) - 8).toFixed(1)}" fill="#e2e8f0" font-size="10" text-anchor="middle" font-weight="700">${fmtKg(p.y)}</text>
          <text x="${mapX(i).toFixed(1)}" y="${H - 6}" fill="#94a3b8" font-size="9.5" text-anchor="middle">${p.lbl}</text>
        `).join('');

        chartHtml = `
          <svg viewBox="0 0 ${W} ${H}" style="width:100%; height:auto; display:block;">
            <line x1="${padL}" y1="${padT}" x2="${padL}" y2="${H - padB}" stroke="#263659" stroke-width="1" />
            <line x1="${padL}" y1="${H - padB}" x2="${W - padR}" y2="${H - padB}" stroke="#263659" stroke-width="1" />
            <text x="${padL - 5}" y="${padT + 4}" fill="#94a3b8" font-size="9.5" text-anchor="end">${fmtKg(maxY)}</text>
            <text x="${padL - 5}" y="${H - padB}" fill="#94a3b8" font-size="9.5" text-anchor="end">${fmtKg(minY)}</text>
            ${pts.length > 1 ? `<polyline fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linejoin="round" points="${poly}" />` : ''}
            ${dots}
          </svg>
        `;
      }

      const filteredHist = state.history
        .filter(h => ui.histFilter === 'all' || String(h.day) === ui.histFilter)
        .slice()
        .sort((a, b) => (b.ts || 0) - (a.ts || 0));

      const histHtml = filteredHist.length ? filteredHist.slice(0, 50).map(h => {
        const handStr = h.hand === 'R' ? 'Правая' : h.hand === 'L' ? 'Левая' : 'Обе';
        const setsStr = h.type === 'table'
          ? `${h.sets[0]?.mode || 'Стол'} · ${h.sets[0]?.weight || 0}% · ${h.sets[0]?.reps || 0} мин`
          : (h.sets || []).map(s => `${fmtKg(s.weight)}×${h.type === 'static' ? (s.sec || 0) + 'с' : s.reps}`).join(' · ');
        return `
          <div class="hist-item">
            <div class="hist-top">
              <div>
                <div style="font-weight:700; font-size:14px;">${esc(h.exerciseName)}</div>
                <div class="small muted">${h.date} · Н${h.week} (${h.weekType === 'heavy' ? 'Тяж.' : 'Лёгк.'}) · ${handStr} · ${effortLabel(h.effort)}</div>
              </div>
              <button class="btn btn-xs btn-danger" data-action="del-hist" data-id="${h.id}">✕</button>
            </div>
            <div class="hist-sets">${esc(setsStr)}</div>
            ${h.note ? `<div class="small muted" style="margin-top:4px;">${esc(h.note)}</div>` : ''}
          </div>
        `;
      }).join('') : `<div class="card small muted" style="text-align:center;">История пока пуста.</div>`;

      return `
        <div class="container">
          <div class="stat-grid">
            <div class="stat-box"><div class="stat-val">${uniqueDays}</div><div class="stat-lbl">Тренировок</div></div>
            <div class="stat-box"><div class="stat-val">${totalSessions}</div><div class="stat-lbl">Записей</div></div>
            <div class="stat-box"><div class="stat-val">${totalSets}</div><div class="stat-lbl">Подходов</div></div>
          </div>

          <div class="card">
            <div class="card-title" style="margin-bottom:8px;">📈 Рост силы (макс, кг)</div>
            <select data-action="prog-ex">
              ${[1, 2, 3, 4].map(d => `
                <optgroup label="День ${d} — ${DAY_INFO[d].full}">
                  ${state.exercises.filter(e => e.day === d && e.type !== 'table').map(e => `
                    <option value="${e.id}" ${e.id === progEx.id ? 'selected' : ''}>${esc(e.name)}</option>
                  `).join('')}
                </optgroup>
              `).join('')}
            </select>
            ${progEx.hands === 'uni' ? `
              <div class="hand-tabs">
                <button class="hand-btn ${ui.progHand === 'R' ? 'active' : ''}" data-action="prog-hand" data-hand="R">Правая</button>
                <button class="hand-btn ${ui.progHand === 'L' ? 'active' : ''}" data-action="prog-hand" data-hand="L">Левая</button>
              </div>
            ` : ''}
            ${recs.length ? `
              <div class="grid-2 mt-8">
                <div class="stat-box" style="background:var(--bg2);"><div class="stat-val" style="font-size:16px;">${fmtKg(maxW)} кг</div><div class="stat-lbl">Лучший вес</div></div>
                <div class="stat-box" style="background:var(--bg2);"><div class="stat-val" style="font-size:16px;">${fmtKg(max1RM)} кг</div><div class="stat-lbl">Расч. макс</div></div>
              </div>
            ` : ''}
            <div class="chart-wrap">${chartHtml}</div>
          </div>

          <div class="row-between" style="margin:12px 0 8px;">
            <div style="font-weight:800;">История (${filteredHist.length})</div>
            <select style="width:auto; padding:5px 9px; font-size:12px;" data-action="hist-filter">
              <option value="all" ${ui.histFilter === 'all' ? 'selected' : ''}>Все дни</option>
              <option value="1" ${ui.histFilter === '1' ? 'selected' : ''}>День 1</option>
              <option value="2" ${ui.histFilter === '2' ? 'selected' : ''}>День 2</option>
              <option value="3" ${ui.histFilter === '3' ? 'selected' : ''}>День 3</option>
              <option value="4" ${ui.histFilter === '4' ? 'selected' : ''}>День 4</option>
            </select>
          </div>
          ${histHtml}
        </div>
      `;
    }

    // ==================== GYM & SETTINGS TAB ====================
    function renderGymTab() {
      const subNav = `
        <div class="seg seg-full" style="grid-template-columns:repeat(4,1fr); margin-bottom:11px;">
