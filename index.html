<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta id="meta-theme-color" name="theme-color" content="#F4F5F7" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>ArmPlan</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/png" href="./icon-192.png" />
  <style>
    :root {
      --bg: #F4F5F7;
      --surface: #FFFFFF;
      --surface-2: #F8FAFC;
      --seg-bg: #E5E7EB;
      --border: #E5E7EB;
      --border-soft: #F1F5F9;
      --text: #111827;
      --text-2: #4B5563;
      --muted: #6B7280;
      --muted-2: #9CA3AF;

      --primary-bg: #111827;
      --primary-text: #FFFFFF;

      --blue: #2563EB;
      --blue-text: #1D4ED8;
      --blue-bg: #EFF6FF;
      --blue-border: #BFDBFE;

      --heavy: #EA580C;
      --heavy-bg: #FFF7ED;
      --heavy-border: #FED7AA;

      --light: #059669;
      --light-text: #047857;
      --light-bg: #ECFDF5;
      --light-border: #A7F3D0;

      --ok: #16A34A;
      --ok-bg: #DCFCE7;
      --ok-text: #15803D;

      --danger: #DC2626;
      --danger-bg: #FEF2F2;
      --danger-border: #FECACA;

      --shadow: 0 2px 10px rgba(15, 23, 42, 0.045);
      --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.06);
      --nav-bg: #FFFFFF;
      --topbar-bg: rgba(244, 245, 247, 0.96);
      --radius: 18px;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    [data-theme="dark"] {
      --bg: #09090B;
      --surface: #131317;
      --surface-2: #1B1B22;
      --seg-bg: #18181E;
      --border: #25252E;
      --border-soft: #1E1E26;
      --text: #FAFAFA;
      --text-2: #D4D4D8;
      --muted: #A1A1AA;
      --muted-2: #71717A;

      --primary-bg: #FAFAFA;
      --primary-text: #09090B;

      --blue: #3B82F6;
      --blue-text: #93C5FD;
      --blue-bg: rgba(59, 130, 246, 0.16);
      --blue-border: rgba(59, 130, 246, 0.36);

      --heavy: #F59E0B;
      --heavy-bg: rgba(245, 158, 11, 0.15);
      --heavy-border: rgba(245, 158, 11, 0.38);

      --light: #10B981;
      --light-text: #6EE7B7;
      --light-bg: rgba(16, 185, 129, 0.15);
      --light-border: rgba(16, 185, 129, 0.35);

      --ok: #22C55E;
      --ok-bg: rgba(34, 197, 94, 0.16);
      --ok-text: #4ADE80;

      --danger: #F43F5E;
      --danger-bg: rgba(244, 63, 94, 0.15);
      --danger-border: rgba(244, 63, 94, 0.35);

      --shadow: none;
      --shadow-sm: none;
      --nav-bg: #09090B;
      --topbar-bg: rgba(9, 9, 11, 0.96);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0;
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 15px; line-height: 1.4;
      overscroll-behavior-y: contain;
      -webkit-font-smoothing: antialiased;
    }

    .app {
      max-width: 500px;
      margin: 0 auto;
      min-height: 100vh;
      padding-bottom: calc(86px + var(--safe-bottom));
    }
    .app.in-session {
      padding-bottom: calc(28px + var(--safe-bottom));
    }

    button {
      font-family: inherit; cursor: pointer; border: none; outline: none;
      color: inherit; background: transparent;
      transition: transform 0.08s ease, opacity 0.12s ease, background 0.15s ease;
    }
    button:active { transform: scale(0.97); }

    /* Top Header */
    .topbar {
      position: sticky; top: 0; z-index: 30;
      background: var(--topbar-bg);
      backdrop-filter: blur(14px);
      padding: 12px 18px 10px;
    }
    .topbar-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .top-sub { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 700; }
    .top-sub.heavy { color: var(--heavy); }
    .top-sub.light { color: var(--light); }
    .top-dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; display: inline-block; }
    .top-title { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; margin-top: 2px; line-height: 1.18; }
    .top-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .ico-btn {
      width: 38px; height: 38px; border-radius: 12px;
      background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow-sm);
      display: flex; align-items: center; justify-content: center; color: var(--text-2);
    }
    .ico-btn.active { background: var(--blue-bg); border-color: var(--blue-border); color: var(--blue); }

    .container { padding: 4px 18px 16px; }

    /* Cards */
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); box-shadow: var(--shadow);
      padding: 15px 16px; margin-bottom: 11px;
    }
    .card-tight { padding: 12px 14px; }
    .card-title { font-weight: 700; font-size: 15.5px; letter-spacing: -0.2px; }

    /* Badges & Chips */
    .chip {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 3px 9px; border-radius: 999px;
      font-size: 11.5px; font-weight: 700; white-space: nowrap;
    }
    .chip-heavy { background: var(--heavy-bg); color: var(--heavy); }
    .chip-light { background: var(--light-bg); color: var(--light); }
    .chip-blue { background: var(--blue-bg); color: var(--blue); }
    .chip-ok { background: var(--ok-bg); color: var(--ok-text); }
    .chip-danger { background: var(--danger-bg); color: var(--danger); }
    .chip-muted { background: var(--surface-2); color: var(--muted); border: 1px solid var(--border); }

    /* Buttons */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      padding: 10px 14px; border-radius: 13px;
      font-size: 14.5px; font-weight: 700;
      background: var(--surface-2); border: 1px solid var(--border);
      color: var(--text); min-height: 44px;
    }
    .btn-primary { background: var(--primary-bg); border-color: var(--primary-bg); color: var(--primary-text); }
    .btn-blue { background: var(--blue); border-color: var(--blue); color: #FFFFFF; }
    .btn-ok { background: var(--ok); border-color: var(--ok); color: #FFFFFF; }
    .btn-danger { background: var(--danger-bg); border-color: var(--danger-border); color: var(--danger); }
    .btn-lg { min-height: 52px; font-size: 16px; border-radius: 15px; font-weight: 800; }
    .btn-sm { min-height: 36px; padding: 6px 11px; font-size: 13px; border-radius: 10px; }
    .btn-xs { min-height: 30px; padding: 4px 10px; font-size: 12px; border-radius: 9px; }
    .btn-block { width: 100%; }

    /* Week switcher strip */
    .week-bar {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 15px; box-shadow: var(--shadow-sm);
      padding: 8px 10px; margin-bottom: 10px;
    }
    .week-nav {
      width: 34px; height: 34px; border-radius: 10px;
      background: var(--surface-2); border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; font-weight: 700; color: var(--text-2);
    }
    .week-center { text-align: center; flex: 1; }
    .week-title { font-weight: 800; font-size: 14.5px; display: flex; align-items: center; justify-content: center; gap: 7px; }
    .week-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }

    /* Segmented control */
    .seg {
      background: var(--seg-bg);
      border-radius: 12px; padding: 3px;
      display: grid; gap: 3px;
    }
    .seg button {
      min-height: 34px; border-radius: 9px; padding: 6px 6px;
      font-size: 13px; font-weight: 600; color: var(--muted);
      display: flex; align-items: center; justify-content: center; gap: 4px;
    }
    .seg button.active {
      background: var(--surface); color: var(--text);
      font-weight: 700; box-shadow: var(--shadow-sm);
    }
    .day-done-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); display: inline-block; }

    /* Elbow 1-tap care card */
    .elbow-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 15px; box-shadow: var(--shadow-sm);
      padding: 11px 13px; margin-bottom: 11px;
    }
    .elbow-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; gap: 8px; }
    .elbow-lbl { font-size: 12.5px; font-weight: 700; color: var(--text-2); }
    .elbow-hint { font-size: 11.5px; color: var(--muted); }
    .elbow-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .elbow-pill {
      display: flex; align-items: center; justify-content: space-between;
      padding: 9px 11px; border-radius: 11px;
      border: 1.5px solid var(--border); background: var(--surface-2);
      font-size: 13px; font-weight: 700; color: var(--text-2);
    }
    .elbow-pill.care {
      background: var(--heavy-bg); border-color: var(--heavy); color: var(--heavy);
    }
    .elbow-status { font-size: 11.5px; font-weight: 800; }

    /* Start Workout Hero Card */
    .start-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); box-shadow: var(--shadow);
      padding: 14px 16px; margin-bottom: 11px;
    }
    .start-meta { display: flex; align-items: center; justify-content: space-between; margin-bottom: 11px; gap: 8px; }
    .start-day-name { font-size: 16px; font-weight: 800; letter-spacing: -0.2px; }

    /* Exercise list rows on Overview */
    .ex-row {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 15px; box-shadow: var(--shadow-sm);
      padding: 12px 14px; margin-bottom: 8px;
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      cursor: pointer; width: 100%; text-align: left;
    }
    .ex-row.done { opacity: 0.74; }
    .ex-row-left { display: flex; align-items: center; gap: 11px; min-width: 0; flex: 1; }
    .ex-circle {
      width: 27px; height: 27px; border-radius: 50%; flex-shrink: 0;
      background: var(--surface-2); border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-size: 12.5px; font-weight: 700; color: var(--muted);
    }
    .ex-row.done .ex-circle { background: var(--ok-bg); border-color: transparent; color: var(--ok-text); }
    .ex-row-info { min-width: 0; flex: 1; }
    .ex-row-name {
      font-size: 14.5px; font-weight: 700; color: var(--text);
      display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
    }
    .ex-row.done .ex-row-name { color: var(--muted); }
    .ex-row-sub {
      font-size: 12.5px; color: var(--muted); margin-top: 2px;
      font-variant-numeric: tabular-nums;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .ex-row-chev { color: var(--muted-2); font-size: 19px; flex-shrink: 0; }

    /* ==================== GUIDED SESSION MODE ==================== */
    .sess-top {
      position: sticky; top: 0; z-index: 30;
      background: var(--topbar-bg); backdrop-filter: blur(14px);
      padding: 12px 18px 10px;
    }
    .sess-top-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .back-btn {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 14px; font-weight: 700; color: var(--text-2);
      padding: 6px 10px 6px 2px; border-radius: 10px;
    }
    .sess-bars { display: flex; gap: 5px; margin-top: 9px; }
    .sess-bar { flex: 1; height: 4px; border-radius: 4px; background: var(--border); }
    .sess-bar.done { background: var(--ok); }
    .sess-bar.active { background: var(--blue); }

    .ex-nav-strip {
      display: flex; align-items: center; justify-content: space-between;
      margin: 6px 0 4px; font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: 0.2px;
    }
    .ex-skip-btns { display: flex; gap: 6px; }
    .ex-skip-btn {
      width: 30px; height: 28px; border-radius: 8px;
      background: var(--surface); border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-size: 15px; font-weight: 700; color: var(--text-2);
    }

    .sess-title-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
    .sess-title { font-size: 22px; font-weight: 800; letter-spacing: -0.45px; line-height: 1.2; }

    /* Plain-Russian 1-line why banner */
    .why-line {
      background: var(--blue-bg); border: 1px solid var(--blue-border);
      color: var(--blue-text); border-radius: 12px;
      padding: 8px 12px; margin-bottom: 11px;
      font-size: 12.5px; font-weight: 600; line-height: 1.35;
    }
    .why-line.warmup { background: var(--light-bg); border-color: var(--light-border); color: var(--light-text); }
    .why-line.warn { background: var(--heavy-bg); border-color: var(--heavy-border); color: var(--heavy); }

    /* Rest finished alert banner */
    .go-banner {
      background: var(--ok-bg); border: 1.5px solid var(--ok);
      color: var(--ok-text); border-radius: 14px;
      padding: 11px 13px; margin-bottom: 11px;
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      font-weight: 800; font-size: 14px;
      animation: popIn 0.25s ease;
    }
    @keyframes popIn {
      from { transform: scale(0.96); opacity: 0.4; }
      to { transform: scale(1); opacity: 1; }
    }

    /* Active Set / Rest Stage Card */
    .stage-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 20px; box-shadow: var(--shadow);
      padding: 18px 16px 16px; margin-bottom: 11px;
      text-align: center;
    }
    .stage-card.working { border-color: var(--blue); box-shadow: 0 0 0 3px var(--blue-bg); }
    .stage-card.rest-done { border-color: var(--ok); box-shadow: 0 0 0 3px var(--ok-bg); }

    .stage-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; gap: 8px; }
    .stage-lbl { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; color: var(--muted); }
    .pulse-dot {
      width: 9px; height: 9px; border-radius: 50%; background: var(--blue);
      display: inline-block; animation: pulse 1.3s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.8); }
    }

    .hand-pill-lg {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 4px 12px; border-radius: 999px;
      font-size: 12.5px; font-weight: 800; margin-bottom: 4px;
      background: var(--blue-bg); color: var(--blue);
    }
    .hand-pill-lg.left { background: var(--heavy-bg); color: var(--heavy); }

    .big-target {
      display: flex; align-items: baseline; justify-content: center; gap: 7px;
      margin: 4px 0 6px; font-variant-numeric: tabular-nums;
    }
    .big-val { font-size: 50px; font-weight: 900; letter-spacing: -2px; line-height: 1.02; color: var(--text); }
    .big-unit { font-size: 18px; font-weight: 700; color: var(--muted); }
    .big-x { font-size: 26px; font-weight: 600; color: var(--muted-2); margin: 0 2px; }
    .big-reps { font-size: 50px; font-weight: 900; letter-spacing: -1.8px; line-height: 1.02; color: var(--blue); }
    .stage-hint { font-size: 13px; color: var(--muted); margin-bottom: 16px; }

    /* Rest clock */
    .rest-clock {
      font-size: 58px; font-weight: 900; letter-spacing: -2px; line-height: 1.05;
      font-variant-numeric: tabular-nums; color: var(--text); margin: 4px 0 10px;
    }
    .rest-prog-track { height: 6px; border-radius: 6px; background: var(--seg-bg); overflow: hidden; margin-bottom: 14px; }
    .rest-prog-fill { height: 100%; background: var(--blue); border-radius: 6px; transition: width 0.25s linear; }
    .rest-btns { display: grid; grid-template-columns: 1fr 1fr 1.6fr; gap: 8px; margin-bottom: 12px; }

    .next-preview-box {
      background: var(--surface-2); border: 1px solid var(--border);
      border-radius: 14px; padding: 11px 13px;
      display: flex; align-items: center; justify-content: space-between; text-align: left; gap: 8px;
    }

    /* Live per-set feel box (Autoregulation!) */
    .feel-box {
      background: var(--surface-2); border: 1px solid var(--border);
      border-radius: 14px; padding: 10px 11px; margin-bottom: 12px; text-align: left;
    }
    .feel-head {
      display: flex; align-items: center; justify-content: space-between; gap: 6px;
      font-size: 12px; font-weight: 700; color: var(--muted); margin-bottom: 7px;
    }
    .feel-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
    .feel-btn {
      padding: 7px 3px 6px; border-radius: 10px; font-size: 11px; font-weight: 800;
      background: var(--surface); border: 1.5px solid var(--border); color: var(--muted);
      line-height: 1.15; text-align: center;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    }
    .feel-sub { font-size: 9px; font-weight: 600; opacity: 0.78; white-space: nowrap; }
    .feel-btn.active[data-feel="easy"] { background: var(--ok-bg); border-color: var(--ok); color: var(--ok-text); }
    .feel-btn.active[data-feel="ok"] { background: var(--blue-bg); border-color: var(--blue); color: var(--blue); }
    .feel-btn.active[data-feel="hard"] { background: var(--heavy-bg); border-color: var(--heavy); color: var(--heavy); }
    .feel-btn.active[data-feel="fail"] { background: var(--danger-bg); border-color: var(--danger); color: var(--danger); }
    .feel-feedback {
      margin-top: 7px; font-size: 12px; font-weight: 700; line-height: 1.32;
      padding: 7px 9px; border-radius: 9px;
    }
    .feel-feedback.easy { background: var(--ok-bg); color: var(--ok-text); }
    .feel-feedback.hard { background: var(--heavy-bg); color: var(--heavy); }
    .feel-feedback.fail { background: var(--danger-bg); color: var(--danger); }
    .retry-banner {
      background: var(--danger-bg); border: 1px solid rgba(220,38,38,0.22);
      color: var(--danger); border-radius: 12px; padding: 9px 11px; margin-bottom: 12px;
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      text-align: left; font-size: 12px; font-weight: 700; line-height: 1.3;
    }

    /* Inline editor */
    .edit-panel {
      background: var(--surface-2); border: 1px solid var(--border);
      border-radius: 14px; padding: 12px; margin: 0 0 12px; text-align: left;
    }
    .stepper {
      display: flex; align-items: center; gap: 4px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 11px; padding: 3px;
    }
    .stepper button {
      width: 36px; height: 36px; border-radius: 8px;
      background: var(--surface-2); font-size: 18px; font-weight: 800; color: var(--text); flex-shrink: 0;
    }
    .stepper input {
      width: 100%; min-width: 0; border: none; background: transparent;
      text-align: center; font-size: 16px; font-weight: 800; color: var(--text);
      font-variant-numeric: tabular-nums;
    }

    /* Clean Notebook Set List */
    .nb-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); box-shadow: var(--shadow);
      padding: 12px 15px; margin-bottom: 11px;
    }
    .nb-head {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 6px; font-size: 12.5px; font-weight: 700; color: var(--muted);
    }
    .nb-row {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      padding: 9px 2px; border-bottom: 1px solid var(--border-soft);
      cursor: pointer;
    }
    .nb-row:last-child { border-bottom: none; }
    .nb-left { display: flex; align-items: center; gap: 11px; min-width: 0; flex: 1; }
    .nb-idx { width: 18px; font-size: 13px; font-weight: 700; color: var(--muted-2); flex-shrink: 0; }
    .nb-row.active .nb-idx { color: var(--blue); }
    .nb-weight { font-size: 15.5px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
    .nb-row.done .nb-weight { color: var(--muted-2); }
    .nb-x { color: var(--muted-2); font-weight: 500; margin: 0 2px; }
    .nb-tag { font-size: 11.5px; color: var(--muted); font-weight: 600; white-space: nowrap; }
    .nb-check {
      width: 26px; height: 26px; border-radius: 8px;
      border: 2px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      color: transparent; flex-shrink: 0;
    }
    .nb-row.active .nb-check { border-color: var(--blue); background: var(--blue-bg); }
    .nb-row.done .nb-check { border-color: var(--ok); background: var(--ok); color: #FFFFFF; }
    .nb-row.extra-row { padding: 7px 2px; cursor: default; opacity: 0.85; }
    .nb-row.extra-row .nb-weight { font-size: 14px; font-weight: 600; color: var(--muted); }
    .nb-row.extra-fail .nb-weight { text-decoration: line-through; color: var(--muted-2); }
    .nb-idx.warm { color: var(--ok-text); font-weight: 800; }
    .nb-idx.fail { color: var(--danger); font-weight: 800; }
    .nb-pill-warm {

        const req = indexedDB.open(IDB_NAME, 1);
        req.onupgradeneeded = () => {
          const db = req.result;
          if (!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE);
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => resolve(null);
      });
    }

    async function idbGet(key) {
      try {
        const db = await idbOpen();
        if (!db) return null;
        return await new Promise((resolve) => {
          const tx = db.transaction(IDB_STORE, 'readonly');
          const req = tx.objectStore(IDB_STORE).get(key);
          req.onsuccess = () => resolve(req.result || null);
          req.onerror = () => resolve(null);
        });
      } catch { return null; }
    }

        const db = await idbOpen();
        if (!db) return;
        await new Promise((resolve) => {
          const tx = db.transaction(IDB_STORE, 'readwrite');
          tx.objectStore(IDB_STORE).put(val, key);
          tx.oncomplete = () => resolve();

    }

    function getSortedList(equip) {
      return [...new Set((equip.weights || [10]).map(Number).filter(x => !isNaN(x) && x >= 0))].sort((a, b) => a - b);
    }

    function snapWeight(targetKg, equip) {
      if (!equip || equip.mode === 'warmup') return { weight: 0, atMax: false };
      if (equip.mode === 'list') {
        const list = getSortedList(equip);
        if (!list.length) return { weight: round2(Math.max(0, targetKg)), atMax: false };
        if (targetKg <= list[0]) return { weight: list[0], atMax: false };
        if (targetKg >= list[list.length - 1]) return { weight: list[list.length - 1], atMax: targetKg > list[list.length - 1] * 1.04 };
        let best = list[0], bestDiff = Math.abs(targetKg - list[0]);
        for (const w of list) {
          const d = Math.abs(targetKg - w);
          if (d < bestDiff) { best = w; bestDiff = d; }
        }
        return { weight: best, atMax: false };
      }
      const min = Number(equip.min) || 0;
      const step = Math.max(0.25, Number(equip.step) || 1.25);
      if (targetKg <= min) return { weight: round2(min), atMax: false };
      const k = Math.round((targetKg - min) / step);
      return { weight: round2(min + Math.max(0, k) * step), atMax: false };
    }

    function stepWeightBy(currentKg, dir, equip) {
      const cur = Number(currentKg) || 0;
      if (!equip || equip.mode === 'warmup') return cur;
      if (equip.mode === 'list') {
        const list = getSortedList(equip);
        if (!list.length) return Math.max(0, round2(cur + dir * 2.5));
        if (dir > 0) {
          const next = list.find(w => w > cur + 0.01);
          return next !== undefined ? next : list[list.length - 1];
        } else {
          for (let i = list.length - 1; i >= 0; i--) {
            if (list[i] < cur - 0.01) return list[i];
          }
          return list[0];
        }
      }
      const min = Number(equip.min) || 0;
      const step = Math.max(0.25, Number(equip.step) || 1.25);
      const snapped = snapWeight(cur, equip).weight;
      if (dir > 0) return round2(snapped > cur + 0.01 ? snapped : snapped + step);
      const cand = snapped < cur - 0.01 ? snapped : snapped - step;
      return round2(Math.max(min, cand));
    }

    function estimatePeakFromWorking(weight, reps, equip, is42) {
      const w = Number(weight) || 0;
      const r = Math.max(1, parseInt(reps, 10) || 1);
      if (w <= 0) return 0;
      // If user already typed a heavy set (1-4 reps), use that exact weight as peak — no Epley distortion!
      if (r <= 4) return snapWeight(w, equip).weight;
      const e1rm = w * (1 + r / 30);
      const peakRatio = is42 ? 0.94 : 0.92;
      return snapWeight(e1rm * peakRatio, equip).weight;
    }

    function mergeWithDefaults(raw) {
      const def = defaultState();
      if (!raw || typeof raw !== 'object') return def;
      const oldVer = Number(raw.version) || 1;

      const rawSettings = raw.settings || {};
      let elbowCare = { R: false, L: false };
      if (rawSettings.elbowCare && typeof rawSettings.elbowCare === 'object') {
        elbowCare = { R: Boolean(rawSettings.elbowCare.R), L: Boolean(rawSettings.elbowCare.L) };
      } else if (rawSettings.elbowPain && typeof rawSettings.elbowPain === 'object') {
        elbowCare = { R: (Number(rawSettings.elbowPain.R) || 0) >= 3, L: (Number(rawSettings.elbowPain.L) || 0) >= 3 };
      }

      const settings = {
        theme: rawSettings.theme === 'dark' ? 'dark' : 'light',
        heavyScheme: rawSettings.heavyScheme === '8-6-6-4-2' ? '8-6-6-4-2' : '8-6-6-3-3',
        startWeekType: rawSettings.startWeekType === 'heavy' ? 'heavy' : 'light',
        currentWeek: Math.max(1, parseInt(rawSettings.currentWeek, 10) || 1),
        compDate: rawSettings.compDate || '2027-03-15',
        elbowCare,
        soundEnabled: rawSettings.soundEnabled !== false
      };

      const equipment = Object.assign({}, def.equipment, raw.equipment || {});
      delete equipment.table;
      delete equipment.bodyweight_plates;
      equipment.bodyweight_warmup = def.equipment.bodyweight_warmup;
      if (oldVer < 3) {
        if (equipment.barbell20 && equipment.barbell20.step === 1.25) equipment.barbell20.step = 2.5;
        if (equipment.barbell8 && equipment.barbell8.step === 1.25) equipment.barbell8.step = 2.5;
      }

      const rawExList = Array.isArray(raw.exercises) && raw.exercises.length ? raw.exercises : def.exercises;
      const pronIds = new Set(['d4_pron_classic', 'd4_pron_thumb', 'd4_pron_low']);
      const pullupIds = new Set(['d2_pullups', 'd4_pullups']);
      const tableIds = new Set(['d1_table', 'd2_table', 'd4_table']);
      const is42 = settings.heavyScheme === '8-6-6-4-2';

      const exercises = [];
      for (const ex of rawExList) {
        if (!ex || !ex.id) continue;
        // v5 migration: remove table / sparring exercises completely
        if (oldVer < 5 && (tableIds.has(ex.id) || ex.type === 'table')) continue;
        if (ex.type === 'table') continue;

        const ref = DEFAULT_EX_MAP[ex.id];
        const copy = Object.assign({}, ex);
        if (!copy.deloadMode) copy.deloadMode = ref ? ref.deloadMode : 'working';
        if (oldVer < 2 && pronIds.has(copy.id)) copy.elbowRisk = false;

        // v5 migration: convert pull-ups to bodyweight 3x10 warm-up
        if (pullupIds.has(copy.id) || copy.type === 'bodyweight') {
          copy.name = pullupIds.has(copy.id) ? 'Подтягивания' : copy.name;
          copy.type = 'warmup';
          copy.equipId = 'bodyweight_warmup';
          copy.hands = 'both';
          copy.elbowRisk = false;
          copy.warmupSets = copy.warmupSets || 3;
          copy.warmupReps = copy.warmupReps || 10;
          copy.warmupRestSec = copy.warmupRestSec || 90;
          copy.baselinePeak = {};
          delete copy.baseline1RM;
        } else {
          // Migrate old baseline1RM -> clean baselinePeak
          if (!copy.baselinePeak || typeof copy.baselinePeak !== 'object') copy.baselinePeak = {};
          if (copy.baseline1RM && typeof copy.baseline1RM === 'object') {
            const eq = equipment[copy.equipId] || equipment.plates;
            for (const h of ['both', 'R', 'L']) {
              if (!copy.baselinePeak[h] && Number(copy.baseline1RM[h]) > 0) {
                const rawVal = Number(copy.baseline1RM[h]);
                copy.baselinePeak[h] = copy.type === 'static'
                  ? snapWeight(rawVal, eq).weight
                  : snapWeight(rawVal * (is42 ? 0.94 : 0.92), eq).weight;
              }
            }
          }
        }
        exercises.push(copy);
      }

      const merged = {
        version: APP_STATE_VERSION,
        updatedAt: raw.updatedAt || Date.now(),
        settings,
        equipment,
        exercises: exercises.length ? exercises : def.exercises,
        history: Array.isArray(raw.history) ? raw.history : [],
        drafts: raw.drafts && typeof raw.drafts === 'object' ? raw.drafts : {},
        activeSession: raw.activeSession && typeof raw.activeSession === 'object' ? raw.activeSession : null
      };

      if (oldVer < APP_STATE_VERSION) {
        merged.activeSession = null;
        merged.drafts = {};
      }
      return merged;
    }

    let state = defaultState();

    function saveState() {
      state.updatedAt = Date.now();
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch {}
      idbSet(STORAGE_KEY, state);
    }

    async function loadState() {
      let lsData = null;
      try {
        const s = localStorage.getItem(STORAGE_KEY);
        if (s) lsData = JSON.parse(s);
      } catch {}
      const idbData = await idbGet(STORAGE_KEY);
      let chosen = null;
      if (lsData && idbData) {
        chosen = (idbData.updatedAt || 0) > (lsData.updatedAt || 0) ? idbData : lsData;
      } else {
        chosen = lsData || idbData;
      }
      state = mergeWithDefaults(chosen);
      saveState();
    }

    function applyTheme() {
      const isDark = state.settings.theme === 'dark';
      document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
      const meta = document.getElementById('meta-theme-color');
      if (meta) meta.setAttribute('content', isDark ? '#09090B' : '#F4F5F7');
      try { if (window.AndroidBridge && window.AndroidBridge.setTheme) window.AndroidBridge.setTheme(isDark); } catch {}
    }

    function syncKeepScreenOn() {
      const keep = Boolean(state.activeSession && state.activeSession.active && state.activeSession.phase !== 'day_done');
      try { if (window.AndroidBridge && window.AndroidBridge.setKeepScreenOn) window.AndroidBridge.setKeepScreenOn(keep); } catch {}
    }

    function getEquip(equipId) {
      return state.equipment[equipId] || state.equipment.plates;
    }

    function getWeekType(weekNum, startType) {
      const isOdd = ((weekNum - 1) % 2) === 0;
      if (startType === 'light') return isOdd ? 'light' : 'heavy';
      return isOdd ? 'heavy' : 'light';
    }

    function getEffectiveWeekType(ex, weekNum) {
      if (ex.type === 'warmup') return 'warmup';
      const mode = ex.deloadMode || 'working';
      if (mode === 'every4') return ((weekNum - 1) % 4) === 3 ? 'light' : 'heavy';
      return getWeekType(weekNum, state.settings.startWeekType);
    }

    function isElbowCared(ex, hand) {
      if (!ex.elbowRisk) return false;
      const ec = state.settings.elbowCare || { R: false, L: false };
      if (hand === 'R') return Boolean(ec.R);
      if (hand === 'L') return Boolean(ec.L);
      return Boolean(ec.R || ec.L);
    }

    function feelLabel(f) {
      return { easy: 'Легко', ok: 'Норм', hard: 'Еле-еле', fail: 'Не пошло' }[f] || 'Норм';
    }

    function feelLabelLong(f) {
      return { easy: 'Очень легко', ok: 'Норм', hard: 'Еле-еле', fail: 'Не пошло' }[f] || 'Норм';
    }

    function getHistoryFor(exerciseId, hand) {
      return state.history
        .filter(h => h.exerciseId === exerciseId && h.hand === hand)
        .sort((a, b) => (b.ts || 0) - (a.ts || 0));
    }

    function getBestPeakFromRecord(rec) {
      let bestW = 0, bestR = 0, bestSec = 0;
      const validSets = (rec.sets || []).filter(s => !s.warmup && !s.uncounted && !s.failed);
      const list = validSets.length ? validSets : (rec.sets || []);
      for (const s of list) {
        const w = Number(s.weight) || 0;
        const r = Number(s.reps) || 0;
        const sec = Number(s.sec) || 0;
        if (w > bestW || (Math.abs(w - bestW) <= 0.01 && (r > bestR || sec > bestSec))) {
          bestW = w; bestR = r; bestSec = sec;
        }
      }
      return { weight: round2(bestW), reps: bestR, sec: bestSec };
    }

    function clearUntouchedDraftsFor(exId) {
      for (const k of Object.keys(state.drafts)) {
        if (!exId || k.includes(`_${exId}_`)) {
          const d = state.drafts[k];
          if (!d || !d.sets || (!d.sets.some(s => s.done) && !(d.extraLog && d.extraLog.length))) delete state.drafts[k];
        }
      }
    }

    // ==================== TRANSPARENT PROGRESSION ENGINE (NO 1RM BLACK BOX, NO 83x2!) ====================
    function firstHeavyWeekFor(ex) {
      for (let w = 1; w <= 8; w++) {
        if (getEffectiveWeekType(ex, w) === 'heavy') return w;
      }
      return 1;
    }

    function nextHeavyWeekAfter(ex, weekNum) {
      for (let w = weekNum + 1; w <= weekNum + 6; w++) {
        if (getEffectiveWeekType(ex, w) === 'heavy') return w;
      }
      return weekNum + 2;
    }

    // Single honest step forward from a clean peak:
    // - Small step (<=5.5% of weight): +1 equipment step directly
    // - Large step (>5.5% of weight): first +1 rep (repBonus 0->1), then +1 equipment step (repBonus -> 0)
    // - If effort === 'easy' and step <= 12%, can step weight right away
    function stepPeakForward(peakW, repBonus, equip, allowFastJump) {
      const curW = snapWeight(peakW, equip).weight;
      const nextW = stepWeightBy(curW, +1, equip);
      if (nextW <= curW + 0.01) {
        return {
          weight: curW,
          repBonus: Math.min(3, repBonus + 1),
          tag: '+1 повт',
          note: 'Дошли до макс. снаряда — добавляем повтор (или добавь новый вес в Снарядах).'
        };
      }
      const jumpRatio = curW > 0 ? (nextW - curW) / curW : 0;
      const smallStep = jumpRatio <= 0.055;
      const fastOk = allowFastJump && jumpRatio <= 0.12;
      if (smallStep || fastOk || repBonus >= 1) {
        return {
          weight: nextW,
          repBonus: 0,
          tag: `+${fmtKg(nextW - curW)} кг`,
          note: ''
        };
      }
      return {
        weight: curW,
        repBonus: 1,
        tag: '+1 повт',
        note: `Закрепляем ${fmtKg(curW)} кг (+1 повтор), переход на ${fmtKg(nextW)} кг — в следующем цикле.`
      };
    }

    function computePlan(ex, hand, targetWeek, opts) {
      const options = opts || {};
      const equip = getEquip(ex.equipId);

      // 1. WARM-UP PULL-UPS (3x10 bodyweight, rest 1:30, no weight/math)
      if (ex.type === 'warmup') {
        const nSets = Math.max(1, parseInt(ex.warmupSets, 10) || 3);
        const nReps = Math.max(1, parseInt(ex.warmupReps, 10) || 10);
        const restSec = parseInt(ex.warmupRestSec, 10) || 90;
        const sets = [];
        for (let i = 0; i < nSets; i++) {
          sets.push({ setNum: i + 1, weight: 0, reps: nReps, restSec });
        }
        return {
          type: 'warmup', weekType: 'warmup', elbowCared: false, needsCalibration: false,
          sets, progTag: '', whyText: 'Разминка со своим весом · без утяжеления',
          modeLabel: `Разминка · ${nSets}×${nReps}`
        };
      }

      const deloadMode = ex.deloadMode || 'working';
      const weekType = getEffectiveWeekType(ex, targetWeek);
      const elbowCared = !options.ignoreElbow && isElbowCared(ex, hand);
      const elbowMult = elbowCared ? ELBOW_CARE_MULT : 1.0;

      // 2. STATIC HOLD (Пальцы — удержание блинов)
      if (ex.type === 'static') {
        const recs = getHistoryFor(ex.id, hand).filter(r => r.week <= targetWeek);
        const last = recs[0];
        let baseW = (ex.baselinePeak && ex.baselinePeak[hand] > 0) ? Number(ex.baselinePeak[hand]) : null;
        let progTag = '', whyText = '';
        if (last && last.sets && last.sets.length) {
          const best = getBestPeakFromRecord(last);
          if (best.weight > 0) {
            const wasSoft = last.weekType === 'light' && last.deloadMode === 'light';
            baseW = wasSoft ? best.weight / 0.72 : (last.weekType === 'light' ? best.weight / 0.85 : best.weight);
            baseW = snapWeight(baseW, equip).weight;
            let hSteps = 0;
            for (let w = last.week + 1; w <= targetWeek; w++) {
              if (getEffectiveWeekType(ex, w) === 'heavy') hSteps++;
            }
            hSteps = Math.min(2, hSteps); // Cap forecast!
            if (hSteps > 0) {
              if (last.effort === 'fail') {
                baseW = stepWeightBy(baseW, -1, equip);
                progTag = '−шаг';
                whyText = `Прошлый раз ${fmtKg(best.weight)} кг (не пошло) → откат на ${fmtKg(baseW)} кг`;
              } else if (last.effort === 'hard') {
                progTag = 'закрепляем';
                whyText = `Прошлый раз ${fmtKg(best.weight)} кг (еле-еле) → закрепляем вес`;
              } else {
                for (let i = 0; i < hSteps; i++) baseW = stepWeightBy(baseW, +1, equip);
                progTag = '+шаг';
                whyText = `Прошлый раз ${fmtKg(best.weight)} кг (${feelLabel(last.effort).toLowerCase()}) → цель ${fmtKg(baseW)} кг`;
              }
            }
          }
        }
        if (baseW === null) {
          return { type: 'static', weekType, deloadMode, elbowCared, needsCalibration: true, sets: [], modeLabel: 'Удержание' };
        }
        const mult = (weekType === 'heavy' ? 1.0 : (deloadMode === 'light' ? 0.72 : 0.85)) * elbowMult;
        const targetW = snapWeight(baseW * mult, equip).weight;
        const secTarget = weekType === 'heavy' ? 15 : (deloadMode === 'light' ? 25 : 20);
        const sets = [1, 2, 3, 4].map((n, idx) => ({
          setNum: n,
          weight: idx === 0 && weekType === 'heavy' ? snapWeight(targetW * 0.75, equip).weight : targetW,
          reps: 1,
          sec: idx === 0 && weekType === 'heavy' ? 20 : secTarget,
          restSec: weekType === 'heavy' ? 120 : 90
        }));
        if (!whyText) {
          whyText = weekType === 'heavy'
            ? `Тяжёлая неделя · удержание ${fmtKg(targetW)} кг по ${secTarget} сек`
            : `Разгрузка · спокойное удержание ${fmtKg(targetW)} кг по ${secTarget} сек`;
        }
        return {
          type: 'static', weekType, deloadMode, elbowCared, needsCalibration: false,
          peakW: targetW, healthyPeakW: baseW, repBonus: 0, sets, progTag, whyText,
          modeLabel: weekType === 'heavy' ? `Тяжёлая · ${secTarget} с` : `Разгрузка · ${secTarget} с`
        };
      }

      // 3. STANDARD WEIGHT EXERCISES
      const is42 = state.settings.heavyScheme === '8-6-6-4-2';
      const basePeakReps = is42 ? 2 : 3;
      const heavyRatios = is42 ? [0.64, 0.76, 0.83, 0.92, 1.00] : [0.65, 0.78, 0.85, 0.95, 1.00];

      let schemeReps, ratios, modeLabel;
      if (weekType === 'heavy') {
        schemeReps = is42 ? [8, 6, 6, 4, 2] : [8, 6, 6, 3, 3];
        ratios = heavyRatios;
        const cycleIdx = ((targetWeek - 1) % 4) + 1;
        modeLabel = deloadMode === 'every4' ? `Тяжёлая (${cycleIdx}/3) · ${state.settings.heavyScheme}` : `Тяжёлая · ${state.settings.heavyScheme}`;
      } else if (deloadMode === 'light') {
        schemeReps = [10, 10, 10, 8, 8];
        ratios = [0.54, 0.57, 0.60, 0.63, 0.65];
        modeLabel = 'Бережная · 50–60%';
      } else {
        schemeReps = [10, 10, 8, 8];
        ratios = [0.71, 0.76, 0.80, 0.85];
        modeLabel = deloadMode === 'every4' ? 'Разгрузка 3+1 · 10-10-8-8' : 'Лёгкая · 10-10-8-8';
      }

      // Find latest logged workout on or before targetWeek (strictly < targetWeek when forecasting future weeks, or <= if reviewing current)
      const allRecs = getHistoryFor(ex.id, hand);
      const recsBefore = allRecs.filter(r => r.week < targetWeek);
      const recsUpTo = allRecs.filter(r => r.week <= targetWeek);
      const lastHeavy = recsBefore.find(r => r.weekType === 'heavy') || recsUpTo.find(r => r.weekType === 'heavy');
      const lastAny = recsBefore[0] || recsUpTo[0];

      let healthyPeakW = null;
      let repBonus = 0;
      let progTag = '';
      let whyText = '';
      let stepNote = '';

      if (lastHeavy && lastHeavy.sets && lastHeavy.sets.length) {
        const best = getBestPeakFromRecord(lastHeavy);
        const wasElbowCared = Boolean(lastHeavy.elbowCared) || (Number(lastHeavy.elbowPain) || 0) >= 3;
        const prevHealthyRec = recsUpTo.find(r => r.weekType === 'heavy' && !r.elbowCared && !(r.elbowPain >= 3));
        const baseVal = (ex.baselinePeak && ex.baselinePeak[hand] > 0) ? Number(ex.baselinePeak[hand]) : 0;

        let anchorPeakW = best.weight;
        if (wasElbowCared) {
          const restored = snapWeight(best.weight / ELBOW_CARE_MULT, equip).weight;
          const prevHealthyW = prevHealthyRec ? getBestPeakFromRecord(prevHealthyRec).weight : 0;
          anchorPeakW = Math.max(restored, prevHealthyW, baseVal);
        }

        // Count how many heavy weeks from lastHeavy.week to targetWeek (capped at 2!)
        let heavySteps = 0;
        for (let w = lastHeavy.week + 1; w <= targetWeek; w++) {
          if (getEffectiveWeekType(ex, w) === 'heavy') heavySteps++;
        }
        const cappedSteps = Math.min(2, heavySteps);

        if (cappedSteps === 0) {
          healthyPeakW = anchorPeakW;
          repBonus = Math.max(0, Math.min(2, (best.reps || basePeakReps) - basePeakReps));
          whyText = weekType === 'heavy'
            ? `Рабочий пик: ${fmtKg(anchorPeakW)}×${basePeakReps + repBonus}`
            : (deloadMode === 'light'
              ? 'Разгрузка крюка 50–60% — бережём связки локтя'
              : 'Рабочая разгрузка 10-10-8-8 — ровно, без отказа');
        } else {
          const plannedW = Number(lastHeavy.plannedPeakW) || 0;
          const plannedR = Number(lastHeavy.plannedPeakReps) || basePeakReps;
          const actualR = best.reps || basePeakReps;
          const actualRepBonus = Math.max(0, Math.min(2, actualR - basePeakReps));
          const missedPlan = !wasElbowCared && plannedW > 0 && (
            best.weight < plannedW - 0.01 ||
            (Math.abs(best.weight - plannedW) <= 0.01 && actualR < plannedR)
          );

          let curW = anchorPeakW;
          let curRB = actualRepBonus;

          if (lastHeavy.effort === 'fail') {
            curW = (!wasElbowCared && best.weight < plannedW - 0.01)
              ? best.weight
              : stepWeightBy(anchorPeakW, -1, equip);
            curRB = 0;
            progTag = '−шаг';
            whyText = `Прошлый раз ${fmtKg(best.weight)}×${actualR} (не пошло) → цель ${fmtKg(curW)}×${basePeakReps}`;
          } else if (lastHeavy.effort === 'hard') {
            curW = anchorPeakW;
            curRB = Math.min(1, actualRepBonus);
            progTag = 'закрепляем';
            whyText = `Прошлый раз ${fmtKg(best.weight)}×${actualR} (еле-еле) → закрепляем вес`;
          } else if (missedPlan) {
            curW = best.weight < plannedW - 0.01
              ? Math.min(plannedW, stepWeightBy(best.weight, +1, equip))
              : plannedW;
            curRB = Math.max(0, plannedR - basePeakReps);
            progTag = 'повтор цели';
            whyText = `Прошлый раз ${fmtKg(best.weight)}×${actualR} → повторяем цель ${fmtKg(curW)}×${basePeakReps + curRB}`;
          } else {
            const stepped = stepPeakForward(anchorPeakW, curRB, equip, lastHeavy.effort === 'easy');
            curW = stepped.weight;
            curRB = stepped.repBonus;
            progTag = stepped.tag;
            stepNote = stepped.note;
            whyText = `Прошлый раз ${fmtKg(best.weight)}×${actualR} (${feelLabel(lastHeavy.effort).toLowerCase()}) → сегодня цель ${fmtKg(curW)}×${basePeakReps + curRB}`;
          }

          // At most 1 more forecast step for the 4-week Plan view (NEVER endless!)
          for (let s = 1; s < cappedSteps; s++) {
            const stepped = stepPeakForward(curW, curRB, equip, false);
            curW = stepped.weight;
            curRB = stepped.repBonus;
            progTag = stepped.tag;
            stepNote = stepped.note;
          }

          healthyPeakW = curW;
          repBonus = curRB;
          if (weekType === 'light') {
            whyText = deloadMode === 'light'
              ? 'Разгрузка крюка 50–60% — бережём связки локтя'
              : 'Рабочая разгрузка 10-10-8-8 — ровно, без отказа';
            progTag = '';
          }
        }
      } else {
        // No heavy history yet — start from baselinePeak (or estimate from any light record)
        let startPeakW = null;
        if (ex.baselinePeak && ex.baselinePeak[hand] > 0) {
          startPeakW = snapWeight(Number(ex.baselinePeak[hand]), equip).weight;
        } else if (lastAny && lastAny.sets && lastAny.sets.length) {
          const best = getBestPeakFromRecord(lastAny);
          if (best.weight > 0) {
            const div = lastAny.deloadMode === 'light' ? 0.65 : 0.85;
            startPeakW = snapWeight(best.weight / div, equip).weight;
          }
        }

        if (startPeakW !== null) {
          const fh = firstHeavyWeekFor(ex);
          let plannedSteps = 0;
          const endW = weekType === 'heavy' ? targetWeek : targetWeek - 1;
          for (let w = fh + 1; w <= endW; w++) {
            if (getEffectiveWeekType(ex, w) === 'heavy') plannedSteps++;
          }
          // CAP forecast steps to at most 2 — guarantees NO 83x2 fantasy!
          plannedSteps = Math.min(2, plannedSteps);

          let curW = startPeakW, curRB = 0;
          for (let s = 0; s < plannedSteps; s++) {
            const stepped = stepPeakForward(curW, curRB, equip, false);
            curW = stepped.weight;
            curRB = stepped.repBonus;
            progTag = stepped.tag;
            stepNote = stepped.note;
          }
          healthyPeakW = curW;
          repBonus = curRB;

          if (weekType === 'light') {
            whyText = deloadMode === 'light'
              ? 'Разгрузка крюка 50–60% — бережём связки локтя'
              : 'Рабочая разгрузка 10-10-8-8 — ровно, без отказа';
            progTag = '';
          } else if (plannedSteps === 0) {
            whyText = `Твой стартовый пик: ${fmtKg(curW)}×${basePeakReps} (потом подстроим по факту)`;
          } else {
            whyText = curRB > 0
              ? `Закрепляем ${fmtKg(curW)} кг (+1 повтор), шаг на вес — дальше`
              : `План цикла: идём на ${fmtKg(curW)}×${basePeakReps}`;
          }
        }
      }

      if (healthyPeakW === null) {
        return {
          type: ex.type, weekType, deloadMode, elbowCared, needsCalibration: true,
          schemeReps, modeLabel, sets: [], whyText: ''
        };
      }

      const activePeakW = elbowCared ? snapWeight(healthyPeakW * ELBOW_CARE_MULT, equip).weight : healthyPeakW;
      const sets = schemeReps.map((baseR, idx) => {
        const rawW = activePeakW * ratios[idx];
        const snapped = snapWeight(rawW, equip);
        const reps = (weekType === 'heavy' && idx >= 3) ? (baseR + repBonus) : baseR;
        const restSec = weekType === 'light'
          ? (deloadMode === 'light' ? 90 : (idx >= 2 ? 120 : 90))
          : (idx < 2 ? 90 : idx === 2 ? 150 : 180);
        return { setNum: idx + 1, weight: snapped.weight, reps, restSec, isPeak: weekType === 'heavy' && idx >= 3 };
      });

      if (elbowCared) {
        const hWord = hand === 'R' ? 'Правый локоть' : (hand === 'L' ? 'Левый локоть' : 'Локоть');
        whyText = `${hWord}: бережный режим (−20%) — пик снижен с ${fmtKg(healthyPeakW)} до ${fmtKg(activePeakW)} кг`;
      }

      return {
        type: ex.type, weekType, deloadMode, elbowCared, needsCalibration: false,
        peakW: activePeakW, healthyPeakW, repBonus, sets, progTag, stepNote, whyText, modeLabel
      };
    }

    // Compute what NEXT heavy week will look like if we finish with `actualSets` and `effort`
    function previewNextHeavyOutcome(ex, hand, week, actualSets, effort, plannedPeakW, plannedPeakReps) {
      if (ex.type === 'warmup') return '';
      const nextWk = nextHeavyWeekAfter(ex, week);
      const equip = getEquip(ex.equipId);
      const is42 = state.settings.heavyScheme === '8-6-6-4-2';
      const basePeakReps = is42 ? 2 : 3;

      if (ex.type === 'static') {
        const bestW = Math.max(0, ...actualSets.map(s => Number(s.weight) || 0));
        if (!bestW) return '';
        if (effort === 'fail') return `Нед ${nextWk}: откат до ${fmtKg(stepWeightBy(bestW, -1, equip))} кг`;
        if (effort === 'hard') return `Нед ${nextWk}: закрепим ${fmtKg(bestW)} кг`;
        return `Нед ${nextWk}: поднимем до ${fmtKg(stepWeightBy(bestW, +1, equip))} кг`;
      }

      const best = getBestPeakFromRecord({ sets: actualSets });
      if (!best.weight) return '';
      const actualR = best.reps || basePeakReps;
      const actualRB = Math.max(0, Math.min(2, actualR - basePeakReps));
      const plannedW = Number(plannedPeakW) || 0;
      const plannedR = Number(plannedPeakReps) || basePeakReps;
      const missedPlan = plannedW > 0 && (
        best.weight < plannedW - 0.01 ||
        (Math.abs(best.weight - plannedW) <= 0.01 && actualR < plannedR)
      );

      if (effort === 'fail') {
        const nextW = (plannedW > 0 && best.weight < plannedW - 0.01) ? best.weight : stepWeightBy(best.weight, -1, equip);
        return `Нед ${nextWk} (тяжёлая): откат на ${fmtKg(nextW)}×${basePeakReps}`;
      }
      if (effort === 'hard') {
        return `Нед ${nextWk} (тяжёлая): закрепим ${fmtKg(best.weight)}×${basePeakReps + Math.min(1, actualRB)}`;
      }
      if (missedPlan) {
        const nextW = best.weight < plannedW - 0.01 ? Math.min(plannedW, stepWeightBy(best.weight, +1, equip)) : plannedW;
        const nextR = basePeakReps + Math.max(0, plannedR - basePeakReps);
        return `Нед ${nextWk} (тяжёлая): вернёмся к цели ${fmtKg(nextW)}×${nextR}`;
      }
      const stepped = stepPeakForward(best.weight, actualRB, equip, effort === 'easy');
      const nextR = basePeakReps + stepped.repBonus;
      const verb = stepped.weight > best.weight + 0.01 ? 'переход на' : 'добавим повтор →';
      return `Нед ${nextWk} (тяжёлая): ${verb} ${fmtKg(stepped.weight)}×${nextR}`;
    }

    function fmtSetShort(ex, s) {
      if (ex.type === 'warmup') return `${s.reps} повт.`;
      if (ex.type === 'static') return `${fmtKg(s.weight)}×${s.sec || 15}с`;
      return `${fmtKg(s.weight)}×${s.reps}`;
    }

    // ==================== AUDIO & VIBRATION ====================
    let sharedAudioCtx = null;
    function unlockAudio() {
      try {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) return;
        if (!sharedAudioCtx) sharedAudioCtx = new Ctx();
        if (sharedAudioCtx.state === 'suspended') sharedAudioCtx.resume();
      } catch {}
    }

    function notifyRestDone() {
      try { if (window.AndroidBridge && window.AndroidBridge.vibrate) window.AndroidBridge.vibrate(); } catch {}
      try {
        if (navigator.vibrate && (!navigator.userActivation || navigator.userActivation.hasBeenActive)) {
          navigator.vibrate([220, 100, 220, 100, 300]);
        }
      } catch {}
      if (!state.settings.soundEnabled) return;
      try {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) return;
        if (!sharedAudioCtx) sharedAudioCtx = new Ctx();
        const ctx = sharedAudioCtx;
        if (ctx.state === 'suspended') ctx.resume();
        const now = ctx.currentTime;
        [[0, 740, 0.14], [0.22, 987.77, 0.24]].forEach(([delay, freq, dur]) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now + delay);
          gain.gain.setValueAtTime(0.001, now + delay);
          gain.gain.linearRampToValueAtTime(0.22, now + delay + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.001, now + delay + dur);
          osc.connect(gain); gain.connect(ctx.destination);
          osc.start(now + delay);
          osc.stop(now + delay + dur + 0.02);
        });
      } catch {}
    }

    // ==================== UI STATE & LIVE TICKER ====================
    const ui = {
      tab: 'workout', // 'workout' | 'plan' | 'progress' | 'gym'
      prevTab: 'workout',
      selectedDay: 1,
      editBaseOpen: false,
      calibSameHands: true,
      planWeek: 1,
      planDay: 1,
      progExId: 'd1_ez_curl',
      progHand: 'R',
      histFilter: 'all',
      gymSub: 'program',
      staticTargetBeeped: false
    };

    function showToast(msg) {
      const el = document.getElementById('toast');
      if (!el) return;
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(el._t);
      el._t = setTimeout(() => el.classList.remove('show'), 2300);
    }

    let tickerId = null;
    function ensureTicker() {
      if (tickerId) return;
      tickerId = setInterval(onTick, 250);
    }

    function onTick() {
      const sess = state.activeSession;
      if (!sess || !sess.active) return;

      if (sess.phase === 'resting' && sess.restEndAt) {
        const remainMs = sess.restEndAt - Date.now();
        if (remainMs <= 0) {
          sess.restEndAt = 0;
          sess.restType = null;
          sess.phase = 'rest_done';
          if (sess.lastCompleted && sess.lastCompleted.fromFailBtn) sess.lastCompleted = null;
          saveState();
          notifyRestDone();
          showToast('Время вышло — приступай к подходу!');
          render();
          return;
        }
        const remainSec = Math.ceil(remainMs / 1000);
        const clockEl = document.getElementById('live-clock');
        const progEl = document.getElementById('live-prog');
        if (clockEl) clockEl.textContent = fmtTime(remainSec);
        if (progEl && sess.restTotal > 0) {
          const pct = Math.max(0, Math.min(100, ((sess.restTotal * 1000 - remainMs) / (sess.restTotal * 1000)) * 100));
          progEl.style.width = pct.toFixed(1) + '%';
        }
      } else if (sess.phase === 'working' && sess.workStartedAt) {
        const elapsed = Math.max(0, Math.floor((Date.now() - sess.workStartedAt) / 1000));
        const el = document.getElementById('work-elapsed');
        if (el) el.textContent = fmtTime(elapsed);
        const ex = state.exercises.find(x => x.id === sess.exId);
        if (ex && ex.type === 'static') {
          const plan = computePlan(ex, sess.hand, sess.week);
          const draft = getOrInitDraft(ex, sess.hand, plan, sess.week);
          const curSet = draft.sets[sess.setIdx];
          const targetSec = (curSet && curSet.sec) || 15;
          if (elapsed >= targetSec && !ui.staticTargetBeeped) {
            ui.staticTargetBeeped = true;
            notifyRestDone();
            showToast(`Есть ${targetSec} сек! Можно на отдых.`);
          }
        }
      }
    }

    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) onTick();
    });

    // ==================== DRAFTS, LIVE AUTOREGULATION & PAIRED R->L SESSION ====================
    function draftKey(week, exId, hand) { return `w${week}_${exId}_${hand}`; }

    function getOrInitDraft(ex, hand, plan, weekOverride) {
      const wk = weekOverride || (state.activeSession && state.activeSession.active ? state.activeSession.week : state.settings.currentWeek);
      const k = draftKey(wk, ex.id, hand);
      const makeSets = () => (plan.sets || []).map(s => ({
        weight: s.weight, reps: s.reps, sec: s.sec || null, done: false, feel: 'ok', isPeak: Boolean(s.isPeak)
      }));
      if (state.drafts[k]) {
        const d = state.drafts[k];
        if ((!d.sets || !d.sets.length) && plan.sets && plan.sets.length) {
          d.sets = makeSets();
          d.baseSets = JSON.parse(JSON.stringify(d.sets));
        }
        if (!d.baseSets || d.baseSets.length !== d.sets.length) {
          d.baseSets = JSON.parse(JSON.stringify(d.sets));
        }
        if (!Array.isArray(d.extraLog)) d.extraLog = [];
        return d;
      }
      const sets = makeSets();
      state.drafts[k] = {
        sets,
        baseSets: JSON.parse(JSON.stringify(sets)),
        extraLog: [],
        effort: 'ok',
        effortManual: false,
        liveNote: '',
        liveFeel: 'ok',
        note: ''
      };
      return state.drafts[k];
    }

    function cloneObj(x) {
      return JSON.parse(JSON.stringify(x));
    }

    // Bump weight by at least 1 step; when strong=true ("Очень легко") and 1 step is tiny (<6%), step +2 (up to ~13%)
    function bumpWeightForFeel(w, dir, equip, strong) {
      const one = stepWeightBy(w, dir, equip);
      if (!strong || w <= 0) return one;
      const pct = Math.abs(one - w) / w;
      if (pct > 0 && pct < 0.06) {
        const two = stepWeightBy(one, dir, equip);
        if (Math.abs(two - w) / w <= 0.13) return two;
      }
      return one;
    }

    function adjustRemainingWorkingSets(draft, fromIdx, dir, ex, equip, strong) {
      for (let i = fromIdx; i < draft.sets.length; i++) {
        if (draft.sets[i].done) continue;
        const curW = Number(draft.sets[i].weight) || 0;
        if (dir > 0) {
          const raised = bumpWeightForFeel(curW, +1, equip, strong);
          if (raised > curW + 0.01) {
            draft.sets[i].weight = raised;
          } else if (ex.type !== 'static') {
            draft.sets[i].reps = (draft.sets[i].reps || 1) + 1;
          }
        } else if (dir < 0) {
          const lowered = bumpWeightForFeel(curW, -1, equip, false);
          if (lowered < curW - 0.01) {
            draft.sets[i].weight = lowered;
          } else if (ex.type !== 'static' && (draft.sets[i].reps || 1) > 2) {
            draft.sets[i].reps = draft.sets[i].reps - 1;
          }
        }
      }
    }

    function deriveDraftEffort(draft) {
      if (draft.effortManual) return;
      const doneSets = draft.sets.filter(s => s.done);
      const peakDone = doneSets.filter(s => s.isPeak);
      const pool = peakDone.length ? peakDone : doneSets;
      const hasFailAttempt = (draft.extraLog || []).some(x => x.kind === 'fail');
      if (pool.some(s => s.feel === 'fail')) draft.effort = 'fail';
      else if (pool.some(s => s.feel === 'hard')) draft.effort = 'hard';
      else if (hasFailAttempt) draft.effort = 'hard';
      else if (pool.length && pool[pool.length - 1].feel === 'easy') draft.effort = 'easy';
      else draft.effort = 'ok';
    }

    // LIVE PER-SET AUTOREGULATION (v2.1.1):
    // - Restores clean pre-feel snapshot of THIS completion event -> 100% idempotent when toggling buttons,
    //   AND genuinely stacks across consecutive sets!
    // - 'easy' ("Очень легко"): moves attempt to warm-up (does NOT burn a working set!), raises this + remaining sets.
    // - 'ok' ("Норм"): counts normally, continues plan.
    // - 'hard' ("Еле-еле"): counts normally, eases remaining sets -1 step.
    // - 'fail' ("Не пошло"): marks attempt as uncounted (NOT in records!), lowers this + remaining sets -1 step to redo.
    function applyLiveFeelOnSession(sess, ex, feel) {
      if (!sess || !sess.lastCompleted || !sess.lastCompleted.snap || ex.type === 'warmup') return;
      const lc = sess.lastCompleted;
      const snap = lc.snap;
      const isUni = ex.hands === 'uni';
      const equip = getEquip(ex.equipId);

      const draftR = isUni
        ? getOrInitDraft(ex, 'R', computePlan(ex, 'R', sess.week), sess.week)
        : getOrInitDraft(ex, 'both', computePlan(ex, 'both', sess.week), sess.week);
      const draftL = isUni
        ? getOrInitDraft(ex, 'L', computePlan(ex, 'L', sess.week), sess.week)
        : null;

      // 1. Restore exact pre-feel baseline for this completion
      draftR.sets = cloneObj(snap.setsR);
      draftR.extraLog = cloneObj(snap.extraR || []);
      draftR.effort = snap.effortR;
      if (isUni && draftL) {
        draftL.sets = cloneObj(snap.setsL);
        draftL.extraLog = cloneObj(snap.extraL || []);
        draftL.effort = snap.effortL;
      }
      sess.setIdx = snap.nextSetIdx;
      sess.hand = snap.nextHand;
      sess.phase = snap.nextPhase;
      sess.restType = snap.nextRestType;

      const targetHands = (lc.pairedBoth && isUni) ? ['R', 'L'] : [lc.hand];
      const getD = h => (isUni ? (h === 'R' ? draftR : draftL) : draftR);

      if (feel === 'ok') {
        lc.feel = 'ok';
        lc.feedback = '';
        draftR.liveNote = '';
        if (draftL) draftL.liveNote = '';
        return;
      }

      if (feel === 'easy') {
        for (const h of targetHands) {
          const d = getD(h);
          const s = d.sets[lc.setIdx];
          if (!s) continue;
          d.extraLog.push({ kind: 'warmup', setIdx: lc.setIdx, weight: s.weight, reps: s.reps, sec: s.sec || null });
          s.done = false;
          s.feel = 'ok';
          adjustRemainingWorkingSets(d, lc.setIdx, +1, ex, equip, true);
          deriveDraftEffort(d);
        }
        // Keep working set counter intact — next up is THIS same working set at higher weight!
        if (lc.pairedBoth && isUni) {
          sess.setIdx = lc.setIdx;
          sess.hand = 'R';
        } else if (!isUni) {
          sess.setIdx = lc.setIdx;
          sess.hand = 'both';
        } else if (lc.hand === 'L') {
          sess.setIdx = lc.setIdx;
          sess.hand = (draftR.sets[lc.setIdx] && !draftR.sets[lc.setIdx].done) ? 'R' : 'L';
        } else {
          // Right hand rated separately before Left: Left goes next, then Right retries this set heavier
          sess.setIdx = lc.setIdx;
          sess.hand = 'L';
        }
        const d0 = getD(targetHands[0]);
        const nextS = d0.sets[lc.setIdx];
        const peakS = d0.sets[d0.sets.length - 1];
        lc.feel = 'easy';
        lc.feedback = `Записал в разминку (подход не сгорел) — поднял веса: подход ${lc.setIdx + 1} → ${fmtSetShort(ex, nextS)}, пик ${fmtSetShort(ex, peakS)}`;
      } else if (feel === 'hard') {
        for (const h of targetHands) {
          const d = getD(h);
          if (!d.sets[lc.setIdx]) continue;
          d.sets[lc.setIdx].feel = 'hard';
          adjustRemainingWorkingSets(d, lc.setIdx + 1, -1, ex, equip, false);
          deriveDraftEffort(d);
        }
        const d0 = getD(targetHands[0]);
        const peakS = d0.sets[d0.sets.length - 1];
        lc.feel = 'hard';
        lc.feedback = lc.setIdx < d0.sets.length - 1
          ? `Подход засчитан — притормозил оставшиеся (пик ${fmtSetShort(ex, peakS)})`
          : 'Запомнил «еле-еле» — на следующей тяжёлой закрепим вес.';
      } else if (feel === 'fail') {
        for (const h of targetHands) {
          const d = getD(h);
          const s = d.sets[lc.setIdx];
          if (!s) continue;
          d.extraLog.push({ kind: 'fail', setIdx: lc.setIdx, weight: s.weight, reps: s.reps, sec: s.sec || null });
          s.done = false;
          s.feel = 'ok';
          adjustRemainingWorkingSets(d, lc.setIdx, -1, ex, equip, false);
          deriveDraftEffort(d);
        }
        if (lc.pairedBoth && isUni) {
          sess.setIdx = lc.setIdx;
          sess.hand = 'R';
        } else if (!isUni) {
          sess.setIdx = lc.setIdx;
          sess.hand = 'both';
        } else if (lc.hand === 'L') {
          sess.setIdx = lc.setIdx;
          sess.hand = (draftR.sets[lc.setIdx] && !draftR.sets[lc.setIdx].done) ? 'R' : 'L';
        } else {
          sess.setIdx = lc.setIdx;
          sess.hand = 'L';
        }
        const d0 = getD(targetHands[0]);
        const retryS = d0.sets[lc.setIdx];
        const peakS = d0.sets[d0.sets.length - 1];
        lc.feel = 'fail';
        lc.feedback = `Не засчитал — скинул вес, переделаем подход ${lc.setIdx + 1} (${fmtSetShort(ex, retryS)}, пик ${fmtSetShort(ex, peakS)})`;
      }
      for (const h of targetHands) {
        const d = getD(h);
        d.liveNote = lc.feedback;
        d.liveFeel = lc.feel;
      }
    }

    function isHandDoneOnWeek(exId, hand, week) {
      return state.history.some(h => h.week === week && h.exerciseId === exId && h.hand === hand);
    }

    function isExerciseDoneOnWeek(ex, week) {
      if (ex.hands === 'both') return isHandDoneOnWeek(ex.id, 'both', week);
      return isHandDoneOnWeek(ex.id, 'R', week) && isHandDoneOnWeek(ex.id, 'L', week);
    }

    function getDraftProgress(ex, week) {
      if (ex.hands === 'uni') {
        const dR = state.drafts[draftKey(week, ex.id, 'R')];
        const dL = state.drafts[draftKey(week, ex.id, 'L')];
        if (!dR && !dL) return { hasAny: false, hasMarked: false, doneSets: 0, totalSets: 0 };
        const setsR = dR && dR.sets ? dR.sets : [];
        const setsL = dL && dL.sets ? dL.sets : [];
        const total = Math.max(setsR.length, setsL.length);
        let doneSets = 0;
        for (let i = 0; i < total; i++) {
          if (setsR[i] && setsR[i].done && setsL[i] && setsL[i].done) doneSets++;
        }
        const anyDone = setsR.some(s => s.done) || setsL.some(s => s.done);
        const anyExtra = Boolean((dR && dR.extraLog && dR.extraLog.length) || (dL && dL.extraLog && dL.extraLog.length));
        const anyDiff = Boolean(
          (dR && dR.baseSets && (setsR.length !== dR.baseSets.length || setsR.some((s, i) => dR.baseSets[i] && (s.weight !== dR.baseSets[i].weight || s.reps !== dR.baseSets[i].reps)))) ||
          (dL && dL.baseSets && (setsL.length !== dL.baseSets.length || setsL.some((s, i) => dL.baseSets[i] && (s.weight !== dL.baseSets[i].weight || s.reps !== dL.baseSets[i].reps))))
        );
        return { hasAny: anyDone || anyExtra || anyDiff, hasMarked: anyDone || anyExtra, doneSets, totalSets: total };
      }
      const d = state.drafts[draftKey(week, ex.id, 'both')];
      if (!d || !d.sets) return { hasAny: false, hasMarked: false, doneSets: 0, totalSets: 0 };
      const doneSets = d.sets.filter(s => s.done).length;
      const anyExtra = Boolean(d.extraLog && d.extraLog.length);
      const anyDiff = Boolean(d.baseSets && (d.sets.length !== d.baseSets.length || d.sets.some((s, i) => d.baseSets[i] && (s.weight !== d.baseSets[i].weight || s.reps !== d.baseSets[i].reps))));
      return { hasAny: doneSets > 0 || anyExtra || anyDiff, hasMarked: doneSets > 0 || anyExtra, doneSets, totalSets: d.sets.length };
    }

    function getDayExercises(day) {
      return state.exercises.filter(e => e.day === day).sort((a, b) => a.order - b.order);
    }

    // Find next undone (setIdx, hand) in paired order: 0-R, 0-L, 1-R, 1-L, ...
    function findNextPairedSlot(ex, week, startSetIdx, startHand) {
      if (ex.hands === 'both') {
        const plan = computePlan(ex, 'both', week);
        const draft = getOrInitDraft(ex, 'both', plan, week);
        for (let i = startSetIdx; i < draft.sets.length; i++) {
          if (!draft.sets[i].done) return { setIdx: i, hand: 'both' };
        }
        for (let i = 0; i < startSetIdx; i++) {
          if (!draft.sets[i].done) return { setIdx: i, hand: 'both' };
        }
        return null;
      }
      const planR = computePlan(ex, 'R', week);
      const planL = computePlan(ex, 'L', week);
      const draftR = getOrInitDraft(ex, 'R', planR, week);
      const draftL = getOrInitDraft(ex, 'L', planL, week);
      const maxLen = Math.max(draftR.sets.length, draftL.sets.length);

      // Build ordered paired queue starting from (startSetIdx, startHand)
      const queue = [];
      for (let i = 0; i < maxLen; i++) {
        if (draftR.sets[i]) queue.push({ setIdx: i, hand: 'R' });
        if (draftL.sets[i]) queue.push({ setIdx: i, hand: 'L' });
      }
      let startPos = queue.findIndex(q => q.setIdx === startSetIdx && q.hand === startHand);
      if (startPos < 0) startPos = 0;
      for (let k = 0; k < queue.length; k++) {
        const slot = queue[(startPos + k) % queue.length];
        const d = slot.hand === 'R' ? draftR : draftL;
        if (d.sets[slot.setIdx] && !d.sets[slot.setIdx].done) return slot;
      }
      return null;
    }

    function needsCalibrationForEx(ex, week) {
      if (ex.type === 'warmup') return false;
      if (ex.hands === 'both') return computePlan(ex, 'both', week).needsCalibration;
      return computePlan(ex, 'R', week).needsCalibration || computePlan(ex, 'L', week).needsCalibration;
    }

    function startSession(day, specificExId) {
      unlockAudio();
      const week = state.settings.currentWeek;
      const list = getDayExercises(day);
      if (!list.length) return;
      let ex = specificExId ? list.find(e => e.id === specificExId) : list.find(e => !isExerciseDoneOnWeek(e, week));
      if (!ex) ex = list[0];

      const initHand = ex.hands === 'both' ? 'both' : 'R';
      let setIdx = 0, hand = initHand, initPhase = 'ready';
      if (!needsCalibrationForEx(ex, week)) {
        const slot = findNextPairedSlot(ex, week, 0, initHand);
        if (slot) { setIdx = slot.setIdx; hand = slot.hand; }
        else { initPhase = 'finish_ex'; }
      }

      state.activeSession = {
        active: true,
        week, day,
        exId: ex.id,
        hand,
        setIdx,
        phase: initPhase, // 'ready' | 'working' | 'resting' | 'rest_done' | 'finish_ex' | 'day_done'
        restType: null, // 'between_hands' | 'between_sets' | 'between_ex'
        restTotal: 90,
        restEndAt: 0,
        workStartedAt: 0,
        editingSlot: null, // { setIdx, hand }
        lastCompleted: null // { setIdx, hand, weight, reps, sec, pairedBoth }
      };
      ui.editBaseOpen = false;
      ui.calibSameHands = true;
      saveState();
      syncKeepScreenOn();
      render();
      window.scrollTo({ top: 0, behavior: 'instant' });
    }

    function switchSessionTo(ex) {
      const sess = state.activeSession;
      if (!sess) return;
      const initHand = ex.hands === 'both' ? 'both' : 'R';
      let setIdx = 0, hand = initHand, initPhase = 'ready';
      if (!needsCalibrationForEx(ex, sess.week)) {
        const slot = findNextPairedSlot(ex, sess.week, 0, initHand);
        if (slot) { setIdx = slot.setIdx; hand = slot.hand; }
        else { initPhase = 'finish_ex'; }
      }
      sess.exId = ex.id;
      sess.hand = hand;
      sess.setIdx = setIdx;
      sess.phase = initPhase;
      sess.restType = null;
      sess.restEndAt = 0;
      sess.workStartedAt = 0;
      sess.editingSlot = null;
      sess.lastCompleted = null;
      ui.editBaseOpen = false;
      ui.calibSameHands = true;
      saveState();
      render();
      window.scrollTo({ top: 0, behavior: 'instant' });
    }

    function findNextExAfter(ex, week) {
      const list = getDayExercises(ex.day);
      const curPos = list.findIndex(e => e.id === ex.id);
      for (let i = curPos + 1; i < list.length; i++) {
        if (!isExerciseDoneOnWeek(list[i], week)) return list[i];
      }
      for (let i = 0; i < curPos; i++) {
        if (!isExerciseDoneOnWeek(list[i], week)) return list[i];
      }
      return null;
    }

    function saveSingleHandRecord(ex, hand, week) {
      const effWeekType = getEffectiveWeekType(ex, week);
      const plan = computePlan(ex, hand, week);
      const draft = getOrInitDraft(ex, hand, plan, week);
      const equip = getEquip(ex.equipId);
      const today = new Date().toISOString().slice(0, 10);

      const doneSets = draft.sets.filter(s => s.done);
      const usedSets = doneSets.length ? doneSets : draft.sets;
      const setsSnapshot = usedSets.map(s => ({
        weight: round2(Number(s.weight) || 0),
        reps: Math.max(0, parseInt(s.reps, 10) || 0),
        sec: s.sec ? parseInt(s.sec, 10) : null,
        feel: s.feel || 'ok',
        done: true
      }));
      const warmupSnapshot = (draft.extraLog || [])
        .filter(x => x.kind === 'warmup')
        .map(x => ({
          weight: round2(Number(x.weight) || 0),
          reps: Math.max(0, parseInt(x.reps, 10) || 0),
          sec: x.sec ? parseInt(x.sec, 10) : null
        }));

      const plannedPeakSet = (plan.sets && plan.sets.length) ? plan.sets[plan.sets.length - 1] : null;
      const best = getBestPeakFromRecord({ sets: setsSnapshot });

      state.history.push({
        id: 'rec_' + Date.now() + '_' + hand + '_' + Math.random().toString(36).slice(2, 5),
        date: today,
        ts: Date.now(),
        week,
        weekType: effWeekType,
        deloadMode: ex.deloadMode || 'working',
        day: ex.day,
        exerciseId: ex.id,
        exerciseName: ex.name,
        equipId: ex.equipId,
        equipName: equip ? equip.name : '',
        hand,
        type: ex.type,
        sets: setsSnapshot,
        warmupSets: warmupSnapshot.length ? warmupSnapshot : undefined,
        plannedPeakW: plannedPeakSet ? Number(plannedPeakSet.weight) || 0 : 0,
        plannedPeakReps: plannedPeakSet ? Number(plannedPeakSet.reps) || 0 : 0,
        bestWeight: best.weight,
        bestReps: best.reps,
        effort: ex.type === 'warmup' ? 'ok' : (draft.effort || 'ok'),
        elbowCared: Boolean(plan.elbowCared),
        note: (draft.note || '').trim()
      });

      delete state.drafts[draftKey(week, ex.id, hand)];
    }

    function saveExerciseComplete(ex, week) {
      if (ex.hands === 'uni') {
        saveSingleHandRecord(ex, 'R', week);
        saveSingleHandRecord(ex, 'L', week);
      } else {
        saveSingleHandRecord(ex, 'both', week);
      }
      clearUntouchedDraftsFor(ex.id);
      saveState();
    }

    // ==================== RENDER: TOP HEADER ====================
    function renderHeader() {
      const wk = state.settings.currentWeek;
      const wType = getWeekType(wk, state.settings.startWeekType);
      const isDark = state.settings.theme === 'dark';

      let subHtml = `<div class="top-sub ${wType}"><span class="top-dot"></span>Неделя ${wk} · ${wType === 'heavy' ? 'Тяжёлая' : 'Лёгкая'}</div>`;
      let title = `День ${ui.selectedDay} · ${DAY_INFO[ui.selectedDay].short}`;

      if (ui.tab === 'plan') {
        const pwt = getWeekType(ui.planWeek, state.settings.startWeekType);
        subHtml = `<div class="top-sub ${pwt}"><span class="top-dot"></span>Неделя ${ui.planWeek} · ${pwt === 'heavy' ? 'Тяжёлая' : 'Лёгкая'}</div>`;
        title = 'План на цикл';
      } else if (ui.tab === 'progress') {
        const daysLeft = state.settings.compDate
          ? Math.ceil((new Date(state.settings.compDate + 'T00:00:00') - new Date()) / 86400000)
          : null;
        subHtml = `<div class="top-sub light"><span class="top-dot"></span>${daysLeft !== null && daysLeft >= 0 ? `До старта: ${daysLeft} дн.` : 'Дневник силы'}</div>`;
        title = 'Прогресс';
      } else if (ui.tab === 'gym') {
        subHtml = `<div class="top-sub" style="color:var(--blue);">ArmPlan v2.1.2</div>`;
        title = 'Настройки и зал';
      }

      return `
        <header class="topbar">
          <div class="topbar-row">
            <div style="min-width:0;">
              ${subHtml}
              <div class="top-title">${title}</div>
            </div>
            <div class="top-actions">
              <button class="ico-btn" data-action="toggle-theme" aria-label="Сменить тему">
                ${isDark ? ICONS.sun : ICONS.moon}
              </button>
              <button class="ico-btn ${ui.tab === 'gym' ? 'active' : ''}" data-action="toggle-gym" aria-label="Настройки">
                ${ICONS.gear}
              </button>
            </div>
          </div>
        </header>
      `;
    }

    // ==================== RENDER: WORKOUT OVERVIEW ====================
    function renderWorkoutOverview() {
      const wk = state.settings.currentWeek;
      const wType = getWeekType(wk, state.settings.startWeekType);
      const dayEx = getDayExercises(ui.selectedDay);
      const doneCount = dayEx.filter(e => isExerciseDoneOnWeek(e, wk)).length;
      const allDone = dayEx.length > 0 && doneCount === dayEx.length;
      const nextUndoneIdx = dayEx.findIndex(e => !isExerciseDoneOnWeek(e, wk));
      const ec = state.settings.elbowCare || { R: false, L: false };

      const dayBtns = [1, 2, 3, 4].map(d => {
        const list = getDayExercises(d);
        const done = list.length > 0 && list.every(e => isExerciseDoneOnWeek(e, wk));
        return `
          <button class="${ui.selectedDay === d ? 'active' : ''}" data-action="sel-day" data-day="${d}">
            День ${d}${done ? '<span class="day-done-dot"></span>' : ''}
          </button>
        `;
      }).join('');

      let ctaText = 'Поехали!';
      let ctaSub = `Начнём с 1-го упражнения: ${dayEx[0] ? dayEx[0].name : ''}`;
      if (allDone) {
        ctaText = 'Пройти ещё раз';
        ctaSub = 'Все упражнения дня на этой неделе уже записаны';
      } else if (doneCount > 0 && nextUndoneIdx >= 0) {
        ctaText = `Продолжить (упр. ${nextUndoneIdx + 1} из ${dayEx.length})`;
        ctaSub = `Дальше: ${dayEx[nextUndoneIdx].name}`;
      }

      const exRows = dayEx.map((ex, idx) => {
        const done = isExerciseDoneOnWeek(ex, wk);
        let subText = '';
        let badges = '';

        if (ex.type === 'warmup') {
          subText = `${ex.warmupSets || 3} × ${ex.warmupReps || 10} · свой вес · отдых ${fmtTime(ex.warmupRestSec || 90)}`;
          badges = '<span class="chip chip-light">разминка</span>';
        } else if (ex.hands === 'uni') {
          const pR = computePlan(ex, 'R', wk);
          const pL = computePlan(ex, 'L', wk);
          if (pR.needsCalibration || pL.needsCalibration) {
            subText = 'Нажми и впиши рабочий вес';
          } else {
            const rFirst = pR.sets[0], rPeak = pR.sets[pR.sets.length - 1];
            const lFirst = pL.sets[0], lPeak = pL.sets[pL.sets.length - 1];
            const sameW = rFirst.weight === lFirst.weight && rPeak.weight === lPeak.weight && rPeak.reps === lPeak.reps;
            if (sameW) {
              subText = `П·Л · ${fmtSetShort(ex, rFirst)} → ${fmtSetShort(ex, rPeak)} · ${pR.sets.length} подх.`;
            } else {
              subText = `П ${fmtKg(rFirst.weight)}→${fmtKg(rPeak.weight)} кг · Л ${fmtKg(lFirst.weight)}→${fmtKg(lPeak.weight)} кг · ${pR.sets.length} подх.`;
            }
          }
          if (pR.elbowCared && pL.elbowCared) badges += '<span class="chip chip-heavy">П·Л −20%</span>';
          else if (pR.elbowCared) badges += '<span class="chip chip-heavy">П −20%</span>';
          else if (pL.elbowCared) badges += '<span class="chip chip-heavy">Л −20%</span>';
          if (pR.progTag === '+1 повт' || pL.progTag === '+1 повт') badges += '<span class="chip chip-blue">+1 повт</span>';
          if (wType === 'light' && pR.weekType === 'heavy') badges += '<span class="chip chip-heavy">тяжёлая</span>';
          else if (pR.weekType === 'light' && ex.deloadMode === 'light') badges += '<span class="chip chip-light">50–60%</span>';
        } else {
          const plan = computePlan(ex, 'both', wk);
          if (plan.needsCalibration) {
            subText = 'Нажми и впиши рабочий вес';
          } else if (plan.sets && plan.sets.length) {
            const first = plan.sets[0], peak = plan.sets[plan.sets.length - 1];
